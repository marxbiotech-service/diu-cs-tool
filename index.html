<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Noto Sans TC', sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }

.topbar { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 10px 20px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.topbar h1 { font-size: 15px; font-weight: 700; color: #111; }

.category-bar { background: #fff; border-bottom: 2px solid #e5e7eb; padding: 8px 16px; display: flex; align-items: center; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }
.cat-label { font-size: 11px; color: #9ca3af; font-weight: 600; margin-right: 2px; white-space: nowrap; }
.cat-btn { padding: 5px 12px; border-radius: 16px; border: 1.5px solid #d1d5db; background: #fff; font-size: 12px; cursor: pointer; color: #374151; transition: all 0.2s; white-space: nowrap; font-weight: 500; user-select: none; }
.cat-btn:hover { border-color: #6366f1; color: #6366f1; }
.cat-btn.selected.diu { background: #6366f1; border-color: #6366f1; color: #fff; }
.cat-btn.selected.dual { background: #8b5cf6; border-color: #8b5cf6; color: #fff; }
.cat-btn.selected.daiji { background: #d97706; border-color: #d97706; color: #fff; }
.cat-btn.selected.snow-b { background: #0891b2; border-color: #0891b2; color: #fff; }

.token-info { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.token-badge { font-size: 11px; padding: 3px 8px; border-radius: 10px; background: #f3f4f6; color: #6b7280; white-space: nowrap; }
.token-badge.low { background: #d1fae5; color: #065f46; }
.token-badge.mid { background: #fef3c7; color: #92400e; }

.sidebar { width: 175px; background: #fff; border-right: 1px solid #e5e7eb; padding: 10px; overflow-y: auto; flex-shrink: 0; }
.sidebar-title { font-size: 11px; color: #9ca3af; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; padding: 0 4px; }
.quick-btn { display: block; width: 100%; text-align: left; padding: 6px 8px; border-radius: 6px; border: none; background: transparent; font-size: 12px; color: #374151; cursor: pointer; margin-bottom: 2px; line-height: 1.4; transition: background 0.15s; }

.msg.user { align-self: flex-end; background: #6366f1; color: #fff; border-bottom-right-radius: 4px; }
.msg.assistant { align-self: flex-start; background: #fff; border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; color: #111; }
.msg.sys { align-self: center; background: #f9fafb; border: 1px dashed #e5e7eb; color: #9ca3af; font-size: 11px; padding: 5px 12px; border-radius: 16px; max-width: 92%; text-align: center; }

.risk-badge { display: inline-block; padding: 2px 7px; border-radius: 8px; font-size: 11px; font-weight: 600; margin-right: 6px; }
.risk-high { background: #fee2e2; color: #dc2626; }
.risk-mid { background: #fef3c7; color: #d97706; }
.risk-low { background: #d1fae5; color: #059669; }
.copy-btn { padding: 3px 10px; border: 1px solid #e5e7eb; border-radius: 5px; background: #fff; font-size: 11px; color: #6b7280; cursor: pointer; transition: all 0.2s; }
.copy-btn:hover { background: #f3f4f6; }
.copy-btn.copied { background: #d1fae5; color: #059669; border-color: #a7f3d0; }
.msg-wrap { align-self: flex-start; max-width: 82%; }
.msg-meta { display: flex; align-items: center; gap: 6px; margin-top: 5px; }

.input-area { padding: 12px 16px; background: #fff; border-top: 1px solid #e5e7eb; flex-shrink: 0; }
.input-row { display: flex; gap: 8px; align-items: flex-end; }
textarea { flex: 1; padding: 10px 14px; border: 1.5px solid #e5e7eb; border-radius: 10px; font-size: 13.5px; resize: none; font-family: inherit; line-height: 1.5; min-height: 44px; max-height: 140px; transition: border-color 0.2s; background: #f9fafb; }
textarea:focus { outline: none; border-color: #6366f1; background: #fff; }
.send-btn { padding: 10px 18px; background: #6366f1; color: #fff; border: none; border-radius: 10px; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
.send-btn:hover { background: #4f46e5; }
.send-btn:disabled { background: #c7d2fe; cursor: not-allowed; }

.loading { display: flex; gap: 4px; align-items: center; padding: 12px 14px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #6366f1; animation: bounce 1.2s infinite; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,100%{transform:translateY(0);opacity:.5} 50%{transform:translateY(-5px);opacity:1} }
.empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #9ca3af; gap: 6px; }
.empty-icon { font-size: 40px; }
.no-select-warning { background: #fef3c7; border: 1px solid #fde68a; color: #92400e; font-size: 12px; padding: 6px 14px; border-radius: 8px; text-align: center; margin: 8px 16px 0; flex-shrink: 0; display: none; }
</style>
</head>

<script>

釋為何經期需注意\n真的完全無法判斷 → 才保守回覆或建議諮詢醫師\n---\n知識庫使用說明\n本系統包含以下知識文件，請優先參考：\nDiu+ 完整知識庫：所有 Diu+、大激賞產品完整成分、食用方式、禁忌、過敏原\nFAQ 完整庫：240 筆真實客服問答案例（含標準回覆語氣）\n樹飛雪完整知識庫：樹飛雪 64 款產品完整資料\n客訴 SOP 庫：各類客訴情境標準處理流程\n若問題有對應產品資料，直接依資料回覆；若有對應案例，參考案例語氣調整；若都沒有，依守則保守回覆並建議諮詢專業人士。\n", "faqKB": "\n---\n\n### FAQ1｜如果吃一天吃2包酵素 沒效果可建議客人增量嗎?\n**Q：** 如果吃一天吃2包酵素 沒效果可建議客人增量嗎?\n**A：** 可以\n先從3包起再到4包\n\n重點要搭配大量飲水\n如果可以，1包配400cc左右的水\n這水量不包括咖啡/茶/飲料之類\n\n因為喝水量也會幫助新陳代謝\n當我們的酵素分解食物後\n加上益生菌幫助消化\n再來透過膳食纖維幫助排出\n所補充充足的水分，讓腸道蠕動更順暢\n便便也相對比較軟化\n就會比較容易排出\n\n---\n\n### FAQ2｜【Diu+】 咕嚕咕嚕超纖酵素 ：鳳梨、莓果、優格。 【Diu+】康普茶…\n**Q：** 【Diu+】 咕嚕咕嚕超纖酵素 ：鳳梨、莓果、優格。\n【Diu+】康普茶微泡飲 阿里山茶葉發酵：熱帶水果、綠茶、薑檸。\n【Diu+】順暢+代謝 水油切 茶包：鳳梨酵素茶、順暢大麥薄荷茶、藤黃果洛神茶油切。\n\n以上全部月經來能吃嗎？以上全部孕婦生完大約何時可開始吃？\n**A：** 以上都會有加快代謝的效果\n建議月經期間份量減半\n\n如果產後沒有哺乳的話\n建議在坐完月子\n身體元氣回覆後再開始食用\n\n但如果有哺育嬰幼兒\n因為嬰幼兒各自的體質不同\n會建議詢問醫師再確認\n\n---\n\n### FAQ3｜閃閃金閃閃銀 如果有在吃沙棘果油是不是也會被阻斷掉?\n**Q：** 客戶詢問閃閃金閃閃銀\n如果有在吃沙棘果油是不是也會被阻斷掉?\n**A：** 同時吃會有阻斷的狀況喔\n會建議隔餐吃\n\n譬如\n沙棘油：空腹或少油餐時吃 → 幫助吸收。\n\n閃金閃銀：配合油膩、澱粉多的餐吃 → 發揮效果。\n\n間隔 3–4 小時，避免互相干擾。\n\n---\n\n### FAQ4｜藍銅彈力緊緻水凝霜這樣狀態是正常嗎?(會凝結成塊再瓶中滑動)\n**Q：** 客人詢問藍銅彈力緊緻水凝霜這樣狀態是正常嗎?(會凝結成塊再瓶中滑動)\n**A：** 感謝您對這款水凝霜的支持與喜愛。由於我們的配方中含有高比例的水凝型保濕成分，質地特別水潤輕盈，在不同的溫度環境下，會自然產生些微凝結或與玻璃瓶壁分離的情況。\n\n這是一種正常的物理現象，並不會影響產品的品質與保養效果。實驗檢測也已確認，產品在保濕力與使用感上都能維持最佳狀態，您可以安心使用。\n\n---\n\n### FAQ5｜客人睡前喝酵素 感覺變胖還有點水腫 有建議方式嗎?\n**Q：** 客人睡前喝酵素 感覺變胖還有點水腫 有建議方式嗎?\n**A：** 建議可改為晚餐飯後半小時食用喔\n\n---\n\n### FAQ6｜客人喝Diu+藤黃果洛神茶茶包 ，晚上20:30喝,大約半夜1點多開始肚…\n**Q：** 客人喝Diu+藤黃果洛神茶茶包\n，晚上20:30喝,大約半夜1點多開始肚子痛 是正常的嗎?\n**A：** Diu+藤黃果洛神茶主要是幫助腸胃蠕動與代謝的效果，所以有些人在飲用後會比較快感受到腸道活動。\n\n建議您可以改成 白天或飯後飲用，或先減半水量飲用，通常身體適應後就會比較舒服了\n\n---\n\n### FAQ7｜金銀是每餐前30分鐘吃兩顆嗎？是午晚餐嗎？ 還是有吃大餐吃2顆，沒吃大餐…\n**Q：** 請問金銀是每餐前30分鐘吃兩顆嗎？是午晚餐嗎？\n還是有吃大餐吃2顆，沒吃大餐吃一顆?\n另18歲及經期可以吃嗎？\n另需要特別飲食控制嗎？\n**A：** 食用方式是依照您的飲食習慣調整，基本午餐及晚餐吃即可，若您早餐比較油膩且豐盛，也可以吃~\n\n午餐/晚餐前半小時先吃一顆閃金，避免過多的油脂吸收，飯後再一顆閃銀，避免吸收過多的糖分，而且可以減少對零食和甜點的慾望~\n當餐如果吃較油膩或是吃到飽，也可以改吃各兩顆加強~\n若正餐會喝飲料吃甜食，或者擔心餐後忘記吃，飯前兩種一起吃也是沒問題的\n經期不影響\n因產品是食品級，輔助用。\n所以飲食部分雖然不用特別節食，但仍建議要調整吃的內容物，進而調整份量\n\n---\n\n### FAQ8｜少一顆腎可吃酵素/茶包/閃金/閃銀嗎? 非疾病，是因為受傷摘除 是否減量…\n**Q：** 客戶詢問\n少一顆腎可吃酵素/茶包/閃金/閃銀嗎?\n非疾病，是因為受傷摘除\n是否減量即可?或不建議食用?\n**A：** 我們產品本身沒有添加對腎臟有害的成分，但因為只有一顆腎臟，代謝壓力會比一般人高一些，會建議最好先與醫師確認，若嘗試可先減量觀察，但以醫師建議為優先\n\n---\n\n### FAQ9｜康普茶（客人以為是苦瓜胜肽產品，覺得苦瓜萃取物排序很後面、沒有專利標章）\n**Q：** 客戶訂購苦瓜胜肽膠囊，覺得成分萃取物很少,排到很後面，苦瓜專利沒有標章\n**客服備註：** 客人實際購買的是康普茶（成分含山苦瓜萃取物），誤以為是苦瓜胜肽產品；以下回覆是針對康普茶說明。\n**A：** 以下是說明\n我們的產品以康普茶發酵為主要核心，透過 SCOBY 共生菌群發酵，帶來活菌、有機酸、多酚、SOD-like 活性等營養，是調整代謝與腸道健康保養的主要來源。\n苦瓜萃取部分僅作為少量添加，目的在於提供輔助性的營養加值，而非產品的主要訴求成分。市面上強調專利苦瓜肽的產品與我們走的是不同方向。我們希望提供的是一款 天然發酵、複合營養、低糖 的飲品，而不是單一成分的補充劑。」\n如果您要的是專利苦瓜肽，那可能要選擇專門的苦瓜產品；但如果希望同時有發酵營養、低糖又能幫助代謝，這款康普茶會更適合喔\n\n---\n\n### FAQ10｜飯前跟睡前都要吃中藥，那喝咕嚕咕嚕要隔開嗎？\n**Q：** 客詢問飯前跟睡前都要吃中藥，那喝咕嚕咕嚕要隔開嗎？\n**A：** 有服用藥物基本上還是隔開比較好喔\n\n---\n\n### FAQ11｜有類風濕關節炎可以吃有含靈芝多醣體的東西嗎？\n**Q：** 請問有類風濕關節炎可以吃有含靈芝多醣體的東西嗎？\n**A：** 可以的\n純化的靈芝多醣體的潛在幫助免疫調節+抗發炎+抗氧化\n所以對於類風溼關節炎是有幫助的\n一般來說\n非純化的靈芝、牛樟芝等萃取，除了多醣體，還有其他的成分會交互作用，有些可能會有免疫刺激作用，對類風溼關節炎來說，是建議先避開的\n\n我們的靈芝多醣體是高度純化的(β-D-glucan ≥50%，總多醣 ≥60%)，保留的是β-D-glucan多醣體，主要是免疫調節，而不是刺激免疫反應，相對來說是較為溫和的食品\n\n如果客戶仍有疑慮，或正在使用免疫抑制藥物，建議可洽詢醫師確認喔\n\n---\n\n### FAQ12｜客戶購買口味：藤黃果洛神茶、鳳梨酵素茶 飲用方式：先用熱水沖開茶包，再加…\n**Q：** 客戶購買口味：藤黃果洛神茶、鳳梨酵素茶\n飲用方式：先用熱水沖開茶包，再加到約 1000ml 冷水中\n平時飲水量：約 1000–2000ml\n\n因客戶在直播中有聽到茶包可幫助消水腫，但實際飲用後覺得「越喝越腫」，懷疑是否喝法錯誤？\n**A：** 產品功能差異\n\n藤黃果洛神茶：幫助油脂代謝。\n鳳梨酵素茶：順暢與代謝。\n大麥薄荷茶：幫助水分代謝\n\n飲用方式\n我們的茶包建議一包搭配約 300cc 熱水沖泡，這樣有效成分的濃度會比較適中。\n如果加到大容量水壺（像 1000ml），等於是把一包的成分「分散稀釋」了，效果可能就比較不明顯喔\n\n---\n\n### FAQ13｜備孕中可以吃酵素，茶包，閃閃金，閃閃銀嗎?\n**Q：** 備孕中可以吃酵素，茶包，閃閃金，閃閃銀嗎?\n**A：** 建議酵素就好\n其他產品基本上建議孕後再食用唷\n\n---\n\n### FAQ14｜餐後有吃魚油，請問有要避開這些食品吃下肚的時間嗎，客人購買酵素、茶包、閃…\n**Q：** 客人反應：餐後有吃魚油，請問有要避開這些食品吃下肚的時間嗎，客人購買酵素、茶包、閃閃膠囊\n**A：** 因為茶包和閃閃系列基本上都是糗像排/阻油的效果\n在吃完魚油，至少1-2小時讓魚油被身體吸收後，再飲用茶包或閃閃膠囊\n\n酵素基本上較不影響\n\n---\n\n### FAQ15｜我目前是都要跟人家分享喝您們茶包取代水 養成習慣。 酵素我有吃都是在排便…\n**Q：** 我目前是都要跟人家分享喝您們茶包取代水 養成習慣。 酵素我有吃都是在排便 調整體質 飲食控制管理，我考量到胖子會胖因為無法抑制食慾需要吃一點排油碇產品讓自己可以不會一直想吃東西\n**A：** 目前丟丟妹系列的商品\n\n如果要針對抑制食慾\n主要還是推薦閃閃金/閃閃銀系列\n\n如果針對現有產品(酵素/茶包/康普茶)\n主要是茶包裡的藤黃果成分\n其中大麥薄荷和藤黃果洛神會比較適合\n\n下面是建議的食用時機\n酵素和茶包，請隔開30分鐘食用\n\n康普茶和茶包，請不要同時一起喝，因為都有酸性成分，腸胃敏感會比較容易不適\n食用的參考\n\n早餐前：可喝大麥薄荷茶（抑制食慾，清爽代謝）\n午餐中：若有油膩餐點，可搭配消化酵素\n午餐後 30 分鐘：康普茶（幫助腸道菌相平衡）\n下午茶時間：藤黃果洛神茶（取代手搖飲，抑制零食慾望）\n晚餐後：若覺得消化慢，可用鳳梨酵素茶\n\n---\n\n### FAQ16｜從8/20吃酵素，早晚各1 但未每天上廁所，有上都拉稀的，飲食 早餐吃蛋…\n**Q：** 客人反應從8/20吃酵素，早晚各1  但未每天上廁所，有上都拉稀的，飲食 早餐吃蛋餅配白開水，中午跟晚上吃蝦子或牛肉每天早上空腹吃酵素 體重也完全沒動，請問是不是有哪裡需改善\n**A：** 因為客戶現在吃很多海鮮和肉類\n->蛋白質偏多，再加上酵素分解，反而會讓腸胃消化快，比較容易拉稀。\n建議您酵素一天改為一包，隨餐吃就好，不一定要空腹吃\n\n水喝得夠，但缺少「纖維質」把水分吸收、形成糞便結構 → 只會變稀水便\n建議補充蔬菜和水果來增加纖維素\n\n也可以搭配康普茶，幫助穩定和調整腸道環境，也比較能幫助有助於體重管理\n\n以上提供參考\n\n---\n\n### FAQ17｜丟丟茶 與酵素 哪些疾病不能喝\n**Q：** 客人詢問 丟丟茶 與酵素 哪些疾病不能喝\n**A：** 大麥薄荷茶基本屬性是較清涼\n如果是體質偏寒的，喝太多可能有腸胃不適狀況\n\n大麥薄荷茶本身\n沒有刺激女性荷爾蒙或促進子宮肌瘤生長的成分\n所以基本上不會直接影響子宮肌瘤復發\n\n但由於個人體質差異，以及服用的藥物不同\n所以還是建議詢問專業醫師以便確認\n\n---\n\n### FAQ18｜喝酵素跟茶有胃酸反應 是可以繼續喝的嗎?\n**Q：** 客戶反應喝酵素跟茶有胃酸反應\n是可以繼續喝的嗎?\n**A：** (1)酵素會增加胃的消化活性，空腹吃有可能會刺激胃分泌\n(2)茶品的成分再抑制食慾和代謝時，也可能會產生胃酸產生\n\n建議\n如果只是輕微胃酸，避免空腹喝，餐後或搭配食物一起飲用會比較好。\n若仍然持續出現胃酸逆流或不適，最好暫停食用，並詢問醫師。\n\n---\n\n### FAQ19｜酵素。茶包 血糖高可以吃嗎?\n**Q：** 請問酵素。茶包  血糖高可以吃嗎?\n**A：** 茶包部分\n成分基本上不影響血糖\n\n酵素部分\n含有乳糖和果寡糖，雖升糖指數(GI)低\n但建議不食用過量，並搭配血糖監測，觀察是否有波動\n\n---\n\n### FAQ20｜酵素可以跟乳清蛋白一起使用嗎?\n**Q：** 酵素可以跟乳清蛋白一起使用嗎?\n**A：** 酵素和乳清是可以一起吃的\n\n不過有一個狀況\n空腹吃的時候，有些人會覺得胃酸多或脹氣\n會建議\n(1)先喝乳清 → 吃早餐 → 再吃酵素\n或\n(2)酵素改在正餐中/餐後，避免胃部刺激。\n\n---\n\n### FAQ21｜吃酵素一直拉 肚子痛 請問是不適合嗎?\n**Q：** 客人反饋吃酵素一直拉 肚子痛 請問是不適合嗎?\n**A：** 客戶的食用量過高，再加上益生菌的作用\n會讓腸胃受到過度刺激，造成腹瀉不適\n\n會建議先暫時不食用，等待身體腸胃道回復正常\n再逐量增加酵素和茶包食用量\n\n如果本身屬於排便正常\n以基礎保養為目標\n食用方法如下\n每天早餐前/中:1包酵素\n下午1包茶飲(300~400CC)(避免空腹喝)\n\n如想加強代謝保養(譬如可能會吃大餐等)\n可再增加酵素一包食用\n\n益生菌和酵素食用請至少間隔30分鐘以上\n茶飲請避免和益生菌同時吃，避免影響益菌活性\n\n---\n\n### FAQ22｜康普茶 備孕、生理期可否正常食用?\n**Q：** 請問康普茶\n備孕、生理期可否正常食用?\n**A：** 基本上備孕期\n茶飲部分，可以少量飲用，以 綠茶 / 薑檸比較適合。\n不過這部分如有疑問(如個人體質等影響)，建議再諮詢醫師以便確認\n\n生理期部分，康普茶基本上都可以飲用\n薑檸款最適合，可以暖身、舒緩經痛\n熱帶水果因為較酸，如果生理期時容易腸胃不適，簡易減量使用\n飲用時避免空腹喝，一天一杯就好(水量300CC左右)，不要當水大量飲用\n\n**客服備註：** 此案例回覆時舊款仍在販售；康普茶綠茶、薑檸口味目前已停售，僅供參考，請勿再推薦這兩款口味。\n\n---\n\n### FAQ23｜酵素內是有什麼成分會導致拉肚子嗎?\n**Q：** 請問酵素內是有什麼成分會導致拉肚子嗎?\n**A：** 超纖酵素裡含有乳糖、果寡糖與多種益生菌，有些人的腸胃比較敏感，剛開始會出現腸道蠕動加快，產生軟便或拉肚子的情況。這通常是腸道在調整菌相的過程。\n\n建議食用方式：\n(1)先從一天 一包開始，之後視情況增加。\n(2)建議飯後食用，可以減少對腸胃的刺激。\n(3)可搭配溫水食用，減少和咖啡因或刺激性飲料同時食用\n\n---\n\n### FAQ24｜莓果茶喝起來有酒味是正常的嗎? *剛剛看成分，沒有相關的成分， 是有什麼…\n**Q：** 客人詢問莓果茶喝起來有酒味是正常的嗎?\n\n*剛剛看成分，沒有相關的成分，\n是有什麼成分口味相似嗎?\n還是這屬於異常現象呢?\n**A：** 如果是茶包\n我們的茶包裡沒有添加啤酒花或酒精，之所以會覺得像啤酒，主要是因為裡面的大麥、決明子、酒粕等成分，會帶出接近麥香或發酵的味道。這是正常的風味特徵，本身是不含酒精的喔\n\n如果是康普茶\n因為康普茶是茶葉 + 糖經過酵母和益生菌發酵，會產生 微氣泡感、和少量微酸風味，類似酒感的氣味。本身也是不含酒精的喔\n\n---\n\n### FAQ25｜大麥薄荷茶有黃色沉澱物是正常的嗎\n**Q：** 大麥薄荷茶有黃色沉澱物是正常的嗎\n**A：** 您好，大麥薄荷茶出現一些黃黃的沉澱物，主要是因為大麥經過焙炒後會釋放出天然的多酚與色素，或茶包中細小的植物纖維在沖泡後慢慢沉澱下來。這些都是自然現象，不影響風味與品質，可以安心飲用哦。\n\n---\n\n### FAQ26｜閃閃金閃閃銀中的成分， 是可以攜帶出國的嗎？\n**Q：** 客戶詢問閃閃金閃閃銀中的成分，\n是可以攜帶出國的嗎？\n**A：** 基本上要帶出國\n如果是少量(1-2瓶)符合個人使用範圍\n基本上應該都沒關係\n\n帶的量如果超過自用的範圍\n就可能會被視為進口\n這是要注意的部分\n\n---\n\n### FAQ27｜茶包 酵素 康普茶 閃閃金銀 素食者可食用嗎?\n**Q：** 請問一下 茶包 酵素  康普茶  閃閃金銀  素食者可食用嗎?\n**A：** 茶包\n康普茶\n閃閃金/銀\n都是素食產品\n\n酵素因為含有乳糖\n奶蛋素可食用\n但全素食者就不適合了\n\n---\n\n### FAQ28｜藤黃果洛神茶 喝完頭暈 ，一包泡900CC回沖2次，飲食正常 請問這是正…\n**Q：** 客人詢問藤黃果洛神茶 喝完頭暈 ，一包泡900CC回沖2次，飲食正常 請問這是正常的嗎?\n**A：** 藤黃果 + 洛神花 本身都有一些 影響血壓與血糖 的可能：\n\n藤黃果 (Garcinia cambogia)\n常用於輔助控制食慾。\n有些人可能會出現 血糖波動、頭暈、腸胃不適。\n\n洛神花 (Hibiscus sabdariffa)\n含有花青素與有機酸，有助降血壓。\n對於平常血壓就偏低的人，可能會出現 頭暈、虛弱\n\n一包泡 900cc 回沖 2 次 → 等於一天攝取量很大（比一般建議的 300–500cc 多很多）\n\n建議調整：\n\n先減量：建議一包泡 300–500cc，不要超過一天 600–700cc。\n餐後喝：避免空腹飲用，減少血糖與腸胃刺激問題。\n提醒：有 低血壓、血糖不穩定，或正在服藥（尤其降壓藥、降血糖藥）的人，建議 先詢問醫師 再飲用。\n\n---\n\n### FAQ29｜酵素買回家連喝四天都沒便，怎麼會這樣 客戶反饋有按照建議方式飲用 酵素初…\n**Q：** 酵素買回家連喝四天都沒便，怎麼會這樣\n客戶反饋有按照建議方式飲用\n\n酵素初期建議早晚各一包\n早上空腹，晚上睡前\n然後每日搭配飲用2000ml的水唷\n但仍無排便\n**A：** 您好～\n每個人體質不同，剛開始補充酵素時，腸道需要一點時間去適應，所以短期內還沒明顯排便是正常的唷！\n\n建議可以調整看看：\n1.早上空腹 1 包（幫助啟動代謝）\n午餐或晚餐後半小時 1 包（幫助食物分解與腸道蠕動）\n2.一天建議搭配 2000ml 水分攝取，並分次慢慢飲用，避免[喝太快、排尿多、腸內含水量不足]，可幫助酵素作用更順暢。\n3.適度運動或腹部按摩：\n可刺激腸道活動。\n4.三餐中可加入蔬菜、香蕉、奇異果、地瓜、燕麥等富含膳食纖維的食物，也可以適量攝取健康油脂（如橄欖油、酪梨），幫助腸道滑順。\n5.避免與高劑量鈣片、鐵劑、抗生素同時服用(有些會影響排便)\n\n如果原本排便週期就偏慢，也可以[暫時]加強到每天 3 包（早、中、晚各一包）**連續 2～3 天觀察看看，通常腸道會逐漸有反應，後續再回復一般保養量即可\n\n---\n\n### FAQ30｜閃閃ˋ金 閃閃銀 玫瑰纖纖飲這些需要間隔30分鐘再吃嗎?如需間隔哪種先吃…\n**Q：** 請問一下 閃閃ˋ金 閃閃銀 玫瑰纖纖飲這些需要間隔30分鐘再吃嗎?如需間隔哪種先吃?\n**A：** 建議\n飯前 30 分鐘 → 閃閃金\n飯前 10～15 分鐘 → 閃閃銀\n飯後 30 分鐘或睡前 → 玫瑰纖纖飲\n\n---\n\n### FAQ31｜接種疫苗後可以食用酵素跟茶包嗎?\n**Q：** 請問接種疫苗後可以食用酵素跟茶包嗎?\n**A：** 接種疫苗後是可以飲用我們的酵素與茶包\n\n不過因為每個人的體質不同\n\n以酵素來說\n如果接種後有發燒、倦怠、食慾差，建議等身體狀況穩定後再恢復食用（通常1～2天即可）。\n飲用時避免與退燒藥、止痛藥同時服用，間隔1～2小時較理想。\n\n以茶包來說\n讓身體專注於免疫反應，不要同時加強代謝。\n等退燒或身體不再疲倦後再喝比較穩妥。\n\n---\n\n### FAQ32｜康普茶，肝硬化可喝？\n**Q：** 康普茶，肝硬化可喝？\n**A：** 我們的康普茶粉屬於乾燥粉末型，沒有酒精成分、酸度也溫和，一般人可安心飲用\n若客戶有肝硬化等狀況，因為考量到\n(1)肝功能指數\n(2)對酸性飲品、甜味劑或茶多酚敏感\n(3)是否有服用藥物\n建議先與醫師確認後再飲用\n\n---\n\n### FAQ33｜早上空腹益生菌及膠原蛋白可以ㄧ起喝嗎？\n**Q：** 早上空腹益生菌及膠原蛋白可以ㄧ起喝嗎？\n**A：** 可以一起空腹飲用，但建議搭配 溫涼開水（避免過熱影響益生菌活性）\n\n提醒\n如果同時還有補充 鐵劑、抗生素或咖啡因飲品，要和益生菌間隔 2 小時以上，避免影響菌種存活。\n\n---\n\n### FAQ34｜酵素可以加在豆漿或咖啡喝嗎\n**Q：** 請問酵素可以加在豆漿或咖啡喝嗎\n**A：** 豆漿 + 酵素 → 可以一起喝，但溫度不要太高。\n避免太高溫破壞酵素活性與益生菌。\n\n咖啡 + 酵素 →咖啡和酵素間隔至少 30 分鐘（例如先空腹喝酵素，30 分鐘後再喝咖啡）。\n因為咖啡因會刺激腸胃，可能加強酵素的腸蠕動作用，對敏感體質的人容易造成拉肚子。\n另外咖啡偏酸性，也可能降低部分益生菌活性。\n\n---\n\n### FAQ35｜玫瑰纖纖飲有蛋白質成分嗎？\n**Q：** 請問玫瑰纖纖飲有蛋白質成分嗎？\n**A：** 玫瑰纖纖飲的主要成分是膳食纖維、植物萃取與果汁粉，屬於高纖與代謝調整飲品，不含蛋白質來源喔\n\n---\n\n### FAQ36｜飯前吃酵素及喝洛神茶後吃完飯脹脹正常嗎?\n**Q：** 客人詢問飯前吃酵素及喝洛神茶後吃完飯脹脹正常嗎?\n**A：** 飯前吃酵素、喝藤黃果洛神茶後吃完飯覺得有點脹，是正常現象喔。\n因為酵素會啟動腸胃蠕動、藤黃果與洛神也屬於酸性，\n一起空腹使用會讓胃酸分泌變多，腸胃反應較明顯。\n\n建議方式:\n酵素：可以保留早上空腹吃（或餐前 15 分鐘即可，不用太早）。\n藤黃果洛神茶：建議改為 餐後 30 分鐘再喝，讓腸胃先消化再進入代謝期。\n\n若體質容易脹氣：先減量飲用、改溫熱水沖泡（避免太冷刺激腸胃）。\n\n---\n\n### FAQ37｜如下：收到一部分的貨品(藍銅水凝霜) 這個乳霜正常嗎？看起來像是用過的 …\n**Q：** 客人反應如下：收到一部分的貨品(藍銅水凝霜)\n這個乳霜正常嗎？看起來像是用過的\n裡面少了好大一坨\n請問你們是自己分裝的嗎？\n\n使用商品會凝結的罐頭跟客人說明過\n客人依然不能接受\n**A：** 感謝您細心回饋與提供影片。\n\n想向您說明，這款水凝霜屬於高水分含量、低蠟脂結構的保濕配方，主成分中含有如 Cyclopentasiloxane、Dicaprylyl Carbonate、Trehalose 等高透亮、滑順因子，在玻璃瓶中會因溫度與保存環境差異產生「霜體收縮」或「離壁凝結」現象，看起來就像縮成一團。\n\n🔹這屬於正常的物理變化，並非使用痕跡或分裝狀況；\n🔹所有商品均經由GMP工廠自動充填機完成封裝，未經手工分裝；\n🔹每批次出貨前均經過重量檢測與穩定性測試，確保每瓶填充容量一致、以保持品質穩定。\n\n若您搖動瓶身或用小刮勺輕壓，會發現霜體完整無分層、質地仍柔滑水潤，代表產品狀態正常。\n\n我們理解您對品質的重視，也已將此回饋記錄，後續會進一步評估包材與配方的調整\n\n如您仍有疑慮，我們可以協助您更換商品，請您放心\n\n---\n\n### FAQ38｜若有再吃胃藥需間隔多久吃酵素\n**Q：** 客人詢問若有再吃胃藥需間隔多久吃酵素\n**A：** 因為大多數胃藥會降低胃酸\n而酵素需要一定的胃酸環境來消化才能順利進入腸道，\n若同時食用可能會降低酵素效果。\n\n建議間隔 1～2 小時 再使用會比較好喔～\n若您是長期服藥者，也可與醫師討論使用安排。\n\n---\n\n### FAQ39｜喝酒是否能喝酵素?\n**Q：** 客人詢問喝酒是否能喝酵素?\n**A：** 酵素不會分解酒精，但能輔助餐食消化、舒緩腸胃不適\n\n建議 喝酒後 1–2 小時再吃，\n不要跟酒一起吃，也不要空腹搭酒食用。\n\n建議\n喝酒前 不建議空腹\n喝酒中  不建議\n喝酒後 可以，建議 1–2 小時後\n翌日宿醉 可以吃，幫助腸胃舒適\n\n---\n\n### FAQ40｜酵素茶包有服用抗凝血劑可吃嗎?\n**Q：** 請問一下  酵素茶包有服用抗凝血劑可吃嗎?\n**A：** 您好～\n若正在服用抗凝血藥物（如華法林、Plavix、Eliquis…）\n酵素與部分茶飲大多可少量使用，\n但建議 與藥物間隔 1–2 小時，並注意觀察。\n\n其中 大麥薄荷茶、鳳梨酵素茶較為溫和，\n通常可以飲用；\n而 藤黃果洛神茶屬草本酸類，建議先詢問醫師。\n\n---\n\n### FAQ41｜高血脂、高血糖、心臟衰竭都有的人，詢問酵素、茶包是否可食用？\n**Q：** 高血脂、高血糖、心臟衰竭都有的人，詢問酵素、茶包是否可食用？\n**A：** 高血脂、高血糖、心臟衰竭都有的人，詢問酵素、茶包是否可食用？\n\n酵素與茶包對於高血脂、高血糖、心臟衰竭的客戶大多是可以食用的，\n但因為心臟衰竭與高血糖可能同時需控制藥物與飲水量，\n建議採 少量保養、並與醫師確認為最安全。\n\n建議方式：\n\n酵素一天 1 包，餐後食用、與藥物間隔 1–2 小時\n\n茶飲一天 1 包即可，算入每日總飲水量\n\n若有不適請停止並與醫師討論喔。\n\n---\n\n### FAQ42｜康普茶脹氣適合喝嗎?\n**Q：** 請問康普茶脹氣適合喝嗎?\n**A：** 因為康普茶含有益菌與天然氣泡，如果腸胃容易脹氣，建議先從半包開始、稀釋多水慢慢喝，餐後再飲用會比較舒服喔～若覺得脹氣變明顯就先停幾天再恢復。\n\n建議\n避免同時飲用碳酸飲料或豆漿\n飲用時水溫不要太冰，常溫水比較適合\n\n---\n\n### FAQ43｜蠶豆症，大麥薄荷茶 能喝嗎\n**Q：** 蠶豆症，大麥薄荷茶 能喝嗎\n**A：** 大麥薄荷茶的主要成分屬於溫和草本，蠶豆症體質一般可以少量飲用，不建議長期或大量。建議一天一包、餐後飲用，若有身體不適或尿液變深，請先停用並詢問醫師喔！\n\n---\n\n### FAQ44｜嬌嬌女王飲青春元素量子鎂素 怎麼吃？\n**Q：** 請問 嬌嬌女王飲青春元素量子鎂素\n怎麼吃？\n**A：** 女王飲每包 20 mL，建議每日 1 包，餐後或睡前 30 分鐘飲用最適合；\n若想加強保養，也可以早晚各 1 包。\n睡前喝吸收效果最好，有助肌膚修護與美白~\n\n---\n\n### FAQ45｜玫瑰孅孅飲有限制飲用年齡嗎？ １２歲以上？６歲以上？ 還是不限定？\n**Q：** 請問玫瑰孅孅飲有限制飲用年齡嗎？\n１２歲以上？６歲以上？\n還是不限定？\n**A：** 玫瑰孅孅飲主要為成人設計的營養補充飲，\n一般建議12歲以上再飲用會比較適合。\n若是青少年(13-17歲)體質較敏感，可先從半包開始觀察，\n6-12歲，如果有代謝消化的需要，建議改用益生菌產品\n6歲以下的小朋友則不建議飲用喔\n\n---\n\n### FAQ46｜丟丟茶算冷茶嗎？ 手腳會冰冷的適合喝嗎？\n**Q：** 客人詢問 請問丟丟茶算冷茶嗎？\n手腳會冰冷的適合喝嗎？\n**A：** 丟丟茶屬於偏涼性的代謝茶，\n如果您手腳比較容易冰冷，建議選鳳梨酵素茶會比較溫和，\n泡的時候可以用溫水或加幾片薑片一起喝，\n幫助促進代謝又不怕太寒喔\n\n---\n\n### FAQ47｜酵素吃了都沒瘦 每天喝2000C水，飮控 吃清淡食物早上兩顆蛋中午青菜海…\n**Q：** 客人反應 酵素吃了都沒瘦\n每天喝2000C水，飮控\n吃清淡食物早上兩顆蛋中午青菜海鮮晚餐雞肉十青菜我很少吃白飯\n有建議方式嗎?\n**A：** 您好～\n酵素主要是幫助 腸胃消化與代謝順暢，但不屬於直接燃燒脂肪的減重產品，所以體重是否下降，會與以下幾個因素有關：\n\n1. 代謝與酵素反應時間\n每個人的腸胃菌相與基礎代謝不同，有些人約需 1～2 週才會感受到排便與代謝的變化。\n若初期沒有明顯變化，可以先 連續食用 2～3 週 觀察。\n\n2. 飲食攝取可能過低\n您的餐食主要為蛋白質與蔬菜，幾乎沒有澱粉。\n若熱量攝取太低，反而會降低代謝速度、更難瘦。\n->建議每日可補充少量全穀澱粉（如地瓜、糙米或燕麥）幫助代謝循環。\n\n3. 飲水與酵素搭配時機\n\n酵素建議：早上空腹 1 包 + 晚餐後 1 包（間隔 30 分鐘內）\n若大量飲水(一天2000mL)，建議可分次小口飲用，不要一次喝太多，避免稀釋胃酸、降低酵素活性。\n\n4. 可嘗試的微調\n若腸胃排便正常但體重無變化 → 可增加每日輕運動 20–30 分鐘，幫助脂肪代謝。\n若仍排便不順 → 改為 早上空腹＋睡前 30 分鐘 食用，並觀察 3～5 日。\n-------------------------------------\n小提醒:\n酵素幫助的是「代謝打底」，但減重仍需配合熱量控制＋活動量提升。\n飲食太清淡反而會造成「代謝過慢」，可輕微增加碳水攝取來調整喔\n\n---\n\n### FAQ48｜丟丟茶，鳳梨跟洛神，有茶鹼嗎?再問一個， 茶鹼是天然的，非額外添加？\n**Q：** 客戶詢問丟丟茶，鳳梨跟洛神，有茶鹼嗎?再問一個，\n茶鹼是天然的，非額外添加？\n**A：** 丟丟茶本身\n依檢測報告結果\n沒有人為添加的藥用茶鹼\n\n藤黃果洛神茶、鳳梨酵素茶，其茶鹼為天然來源(紅茶)，且濃度極低；不屬於藥用茶鹼，不會有藥理副作用或醫藥交互影響。\n\n如對天然茶鹼仍有敏感，建議可在飲用時再稀釋後飲用\n(如一包可增加水量至600-700ml)\n\n---\n\n### FAQ49｜有子宮肌瘤，女王飲可以喝嗎\n**Q：** 有子宮肌瘤，女王飲可以喝嗎\n**A：** 女王飲裡含有女王蜂子粉與蜂膠，屬於天然營養成分，\n但對於有「子宮肌瘤」的族群，建議先暫停或減量觀察\n如不確定自身狀況，建議可與醫師討論後再飲用喔\n\n---\n\n### FAQ50｜水煮蛋+豆漿 中午不吃 或喝果汁 晚上會挑食物吃 蛋白質或肉或魚之類的 …\n**Q：** 水煮蛋+豆漿\n中午不吃 或喝果汁\n晚上會挑食物吃 蛋白質或肉或魚之類的\n水量都有達2000CC\n客人有買酵素+茶包 有建議的方式嗎?\n客人說他便秘很嚴重，酵素可以早上吃2包，晚上吃2包嗎?\n**A：** 您目前的飲食纖維量太低，所以腸道沒有足夠的「材料」讓蠕動順暢，即使喝大量的水也容易造成便秘。\n\n建議您把酵素調整為 早上空腹 1 包＋晚餐後 1 包（一天最多 2 包） 搭配茶飲餐後喝。\n\n另外早餐多加一份水果、午餐不要空餐、晚餐多一份蔬菜和少量健康油脂，通常 2–3 天腸道大概就會比較順了喔。\n\n---\n\n### FAQ51｜吃酵素覺得噁心 有試過 一種空腹吃 先喝水再放粉 另一種吃飽後再吃，也是…\n**Q：** 客人反映吃酵素覺得噁心\n有試過\n一種空腹吃 先喝水再放粉\n另一種吃飽後再吃，也是喝水放粉\n請問有可改善方式嗎?\n**A：** 有些對味道或胃比較敏感的客人，一開始空腹喝酵素會覺得噁心。\n\n建議可以改成：\n先把酵素用 200–300 mL 溫水充分攪散後再喝，或放在餐後喝，\n不要先喝水再倒粉，也可以混豆漿或果汁味道會更順。\n大部分客人這樣調整後就不會不舒服～\n\n---\n\n### FAQ52｜有吃保健品，有疑問是要先吃酵素還是保健品 早餐客戶都喝蛋白素\n**Q：** 客戶詢問\n有吃保健品，有疑問是要先吃酵素還是保健品 \n早餐客戶都喝蛋白素\n**A：** 如果早餐會喝蛋白素，建議可以把酵素放在前面先喝，\n酵素能先啟動腸胃、讓蛋白素的吸收更好，也比較不會脹氣。\n順序是：酵素 → 蛋白素（保健品）\n這樣身體會更舒服，吸收也比較好喔！\n\n---\n\n### FAQ53｜客人吃酵素 排便不順 每天都吃蛋白質+蔬菜 澱粉只吃義大利麵 1天2餐 …\n**Q：** 客人吃酵素 排便不順\n每天都吃蛋白質+蔬菜 澱粉只吃義大利麵 1天2餐\n酵素早晚各1 水1天喝2000cc 有建議改善方式嗎?\n**A：** 酵素能幫助分解食物、調整腸胃，\n但若纖維太少，「沒有便便產生」，就比較難排出來。\n\n您的飲食中蛋白質跟蔬菜都有吃，但「水溶性纖維」與「完整澱粉」不足\n所以腸道沒有足夠的材料製造便便，即使喝 2000cc 水、喝酵素也可能不夠。\n\n蛋白質和蔬菜比較屬於不溶性纖維\n->建議加上香蕉、地瓜、燕麥等水溶性纖維，有助於腸道順暢\n\n義大利麵屬於精緻澱粉，沒有纖維\n也無法刺激腸道蠕動\n->建議可換為糙米、藜麥、燕麥等含有水溶性纖維的主食\n-------------------------\n建議食用方式\n早餐加一份水果（奇異果 / 香蕉）或地瓜\n主食盡量不要只有義大利麵\n酵素改成：早上 1 包 + 下午 1 包\n\n再看看一周是否有改善排便喔！\n\n---\n\n### FAQ54｜纖纖飲喝完沒有增加飽足感 反而吃更多 都用150~200CC水泡 有建議…\n**Q：** 客人反應 纖纖飲喝完沒有增加飽足感  反而吃更多  都用150~200CC水泡  有建議方式嗎?\n**A：** 纖纖飲的飽足感主要來自膨脹纖維\n\n因此建議：\n1.水量增加到 400–500cc(讓成份吸收水分膨脹，增加飽足感)\n2.餐前 15–30 分鐘喝\n3.慢慢喝（5–10 分鐘）\n\n這樣纖維有時間在胃裡膨脹，就會更有飽足感，也能幫助控制食量！\n若水量太少或喝太快，反而會有餓的感覺，再請調整食用方式來檢視喔\n\n---\n\n### FAQ55｜茶包泡下去有雲絲狀是正常嗎\n**Q：** 茶包泡下去有雲絲狀是正常嗎\n**A：** 這個應該是藤黃果洛神茶吧？\n杯子裡看到的絲狀、雲霧感，是因為這款藤黃果洛神茶裡的果汁粉有做包覆處理（coating），\n遇到水時外層的澱粉會先溶開，裡面的果汁粉散出來，所以在水中會短暫呈現一絲一絲、雲霧狀的樣子，\n攪拌後就會完全散開，屬於正常現象\n若您聞起來味道有異常或看到塊狀黏膜不會散開，再麻煩拍照或錄影給我們，以便為您協助處理。\n\n---\n\n### FAQ56｜Diu+智慧型閃耀養膚粉底，混合性肌膚可用嗎?使用後會不會很容易浮粉\n**Q：** 請問Diu+智慧型閃耀養膚粉底，混合性肌膚可用嗎?使用後會不會很容易浮粉\n**A：** 混合性肌膚是可以使用的\n上妝前保持肌膚水潤(基礎保濕，乾燥部位薄擦乳液)\n再薄擦上妝，妝感會蠻服貼自然，比較不容易浮粉喔。\n\n---\n\n### FAQ57｜客戶吃閃閃金閃閃銀、酵素、玫瑰飲、丟丟茶，客戶詢問吃這些產品後，開始掉頭…\n**Q：** 客戶吃閃閃金閃閃銀、酵素、玫瑰飲、丟丟茶，客戶詢問吃這些產品後，開始掉頭髮\n是否有較妥善的回覆?\n**A：** 謝謝您跟我們反映這個狀況\n\n先跟您說明，您目前食用的 閃閃金、閃閃銀、酵素、玫瑰孅孅飲、丟丟茶，都不含藥性成分，也沒有已知會直接造成落髮的成分紀錄。\n\n不過「掉髮」本身通常不是短時間由單一因素造成，而比較常見與以下情況有關：\n\n1.近期作息改變、睡眠不足或壓力增加\n2.熱量或營養攝取降低（例如控醣、清淡飲食、減重期間）\n3.腸胃調整期、體內代謝變化較快\n4.季節交替、女性荷爾蒙變動（生理期、產後、壓力型掉髮）\n\n如果是短期掉髮增加（洗頭、梳頭時），多半屬於「暫時性生理反應」，通常在作息與營養穩定後可以慢慢恢復。\n\n=>建議您可以先：\n(1)先暫停 1～2 項產品（例如茶類或纖纖飲），觀察 1–2 週\n(2)確保 蛋白質、鐵、鋅、B群攝取充足\n(3)睡眠時間與壓力調整\n\n若掉髮情況持續 超過 2–3 週還是明顯增加，\n建議可諮詢皮膚科或醫師確認是否為壓力型、荷爾蒙或營養相關因素喔\n\n---\n\n### FAQ58｜纖纖飲有化療過可以吃嗎?\n**Q：** 纖纖飲有化療過可以吃嗎?\n**A：** 謝謝您的詢問，因為您有接受過化療的經驗，這部分我們會比較謹慎建議。\n\n孅孅飲屬於高纖維、促進代謝的產品\n裡面的成分對一般族群來說是屬於食品級原料，\n但在化療後的體質狀況下，每個人的腸胃與免疫系統恢復程度不同。\n\n會建議您先向主治醫師或營養師確認是否適合目前食用。\n尤其若仍在追蹤期、或腸胃較敏感者，更需要專業評估。\n以便您食用上的安心喔\n\n---\n\n### FAQ59｜茶包是什麼材質? 客戶反應熱泡會有塑膠微粒\n**Q：** 請問茶包是什麼材質?\n客戶反應熱泡會有塑膠微粒\n**A：** 客戶說我們的茶包有懸浮微粒\n\n關於您看到有些微懸浮物，\n\n我們使用的是 PLA 植物纖維茶包，是由玉米、甜菜等植物澱粉製成，目前也是市面上草本茶與果茶中相當常見的茶包材質，耐熱使用。\n\n茶湯中看到的懸浮微粒，多數來自茶包內的草本細粉、果汁粉或植物萃取物，在熱水中釋放，而非茶包材質本身溶解。\n攪拌或沖泡時間較長時，也會讓這種現象看起來更明顯，屬於正常的植物來源現象喔\n\n---\n\n### FAQ60｜客人來電反映吃酵素，膝蓋會痛 無法爬樓梯 本身是老人 有吃補鈣東西 這樣…\n**Q：** 客人來電反映吃酵素，膝蓋會痛  無法爬樓梯 本身是老人 有吃補鈣東西 這樣跟吃酵素有關西嗎?\n**A：** 謝您來電告知，我們很重視您的身體狀況。\n\n關於您反應的膝蓋疼痛與行走不便的情況，這類症狀通常不是酵素產品常見的反應，目前也沒有原料資料顯示酵素會直接導致關節疼痛。\n\n但因為是長輩，同時本身也有補鈣與關節相關狀況，我們會比較謹慎建議您：\n盡快向醫師或藥師諮詢，確認膝蓋疼痛的真正原因，會比較安全也安心。\n\n若醫師確認恢復穩定後，再評估是否適合繼續食用其他食品喔。\n\n---\n\n### FAQ61｜蕁麻疹可以喝diu+系列的產品嗎?\n**Q：** 蕁麻疹可以喝diu+系列的產品嗎?\n**A：** 若您本身有 蕁麻疹（過敏體質），在食用任何新的食品或保健飲品前，我們會建議特別留意。\n\nDiu+ 系列產品屬於食品／保養相關產品，並非藥品，也不含已知直接誘發蕁麻疹的成分\n但每個人的過敏來源與觸發因素不同，可能與體質、壓力、飲食或特定成分有關。\n\n為了您的安全與安心，若目前正處於 蕁麻疹發作期，建議先暫緩食用任何新的產品；\n若症狀穩定，也建議 先諮詢醫師，或少量、單一品項嘗試觀察反應，避免同時食用多種產品，以利判斷。\n\n也可進一步與醫師確認評估喔\n\n---\n\n### FAQ62｜酵素，茶包成分有藻類、裙帶類萃取嗎?酵素後面有看到紫菜 請問那個是算是藻…\n**Q：** 酵素，茶包成分有藻類、裙帶類萃取嗎?酵素後面有看到紫菜  請問那個是算是藻類嗎?\n**A：** 以產品成分標示來看，\n酵素與茶包中「沒有添加藻類或裙帶菜（海帶、褐藻類）萃取物」，\n也沒有使用常見的海藻萃取成分（如褐藻醣膠、海帶萃取等）。\n\n若您是因為對藻類、碘或海藻相關成分有顧慮，目前這兩類產品的成分中沒有使用這類的原料，可以先安心參考。\n\n不過如果您本身有特殊體質或醫師曾交代飲食限制，也建議先與醫師確認哦\n\n紫菜在分類上屬於紅藻類，但和海帶、裙帶菜那類高碘藻類不同，在酵素中僅是極少量的植物輔助原料，並非藻類補充來源。\n\n若您是因為碘攝取、甲狀腺或特殊體質考量而留意藻類，這部分影響相對非常低；\n若醫師有特別交代嚴格避免所有藻類，建議仍以醫師評估為準，會比較安心。\n\n---\n\n### FAQ63｜吃酵素和丟丟茶，2周體重從66變70公斤 飲食情況： - 早餐：鮮奶、全…\n**Q：** 吃酵素和丟丟茶，2周體重從66變70公斤\n飲食情況：\n- 早餐：鮮奶、全麥吐司、起司、水煮蛋\n- 午、晚餐：青菜、約半碗飯\n- 晚餐後：1～2小包餅乾\n**A：** 謝謝您詳細提供這兩週的飲食狀況。\n\n先跟您說明，兩週內增加 4 公斤，比較高機率是以下幾種情況共同影響：\n\n1.體內水分滯留\n2.腸胃內容物增加（纖維、食物量、排便尚未完全排出）\n3..飲食中有一些「容易被忽略的熱量來源」\n\n酵素與丟丟茶本身不會產生熱量，也沒有已知會直接造成體重增加的成分，部分人在調整飲食與代謝的前期，體重確實可能會有短暫波動\n-------------------------\n飲食方面調整的建議\n【早餐調整（很重要）】\n目前早餐內容較豐盛，建議「減一樣即可」：\n建議二選一：\n全麥吐司改成1片\n或\n減少起司片\n（鮮奶＋兩顆蛋）可以保留\n熱量立刻減少，且不影響營養。\n\n【晚餐後小餅乾】\n即使是小包餅乾：\n一包約 80–120 大卡\n兩包幾乎等於半碗飯\n\n建議：\n先停掉晚餐後餅乾\n若有飢餓感，可改成：\n\n=>半顆水煮蛋\n或一點水果（如半顆蘋果）\n\n【正餐結構小調整】\n午、晚餐的米飯半碗 OK\n蔬菜量不需再增加\n建議每餐至少有一份蛋白質(蛋、豆腐、魚、肉）\n=>蔬菜多，但「肌肉量支撐代謝的蛋白質」不算多\n反而會讓身體因為節能、囤積了水分和脂肪。\n\n酵素與茶包吃法調整：\n酵素維持一天 1–2 包即可\n茶包飲放在白天或午餐後喝\n晚上不要喝代謝型茶，避免水分滯留與睡眠影響\n------------------------------------------\n目前的體重變化比較像是短期水分與飲食結構影響，稍微調整早餐與晚餐後的小點心，搭配原本的吃法，再觀察1～2週內的變化喔。\n\n---\n\n### FAQ64｜客戶喝大麥薄荷茶，會胃痛，有什麼可能的原因嗎?\n**Q：** 客戶喝大麥薄荷茶，會胃痛，有什麼可能的原因嗎?\n**A：** 大麥薄荷茶中含有薄荷與大麥成分，對部分腸胃較敏感或有胃酸、胃食道逆流體質的人，有可能出現胃部不適或胃痛的情況，這較偏向屬體質反應\n\n若仍想飲用大麥薄荷茶：\n=>建議\n1.改成餐後喝\n2.水量增加(降低濃度)\n3.避免空腹\n\n或建議可改飲其他兩項茶款喔\n\n---\n\n### FAQ65｜有大腸潰瘍7月才開過刀，目前有些虛胖，有點水腫之前吃過甲狀腺藥目前已停藥…\n**Q：** 請問一下 有大腸潰瘍7月才開過刀，目前有些虛胖，有點水腫之前吃過甲狀腺藥目前已停藥1年多\n請問適合吃酵素或茶包之類的嗎\n**A：** 因為您7月才做過大腸潰瘍手術，腸道目前還屬於恢復期，加上您提到有虛胖與水腫的狀況，建議先不要使用代謝型茶包或酵素粉，避免對腸黏膜造成刺激。\n\n在體質恢復期階段，會建議您先以身體安全為優先。\n\n等醫師在回診時確認：\n=>腸壁已完全癒合\n=>沒有腹痛、腹瀉、排便不穩\n\n等醫師確認腸道完全恢復後，再評估是否能使用代謝型產品比較適合喔。\n\n---\n\n### FAQ66｜藤黃果洛神茶有酒的成分?\n**Q：** 藤黃果洛神茶有酒的成分?\n**A：** 丟丟妹藤黃果洛神茶不含酒精，也不是發酵型茶飲。\n成分中的葡萄酒粕與大吟釀酒粕屬於釀造後的植物性副產物原料，保留的是營養與風味，不含酒精。\n因洛神與酒粕的天然香氣，部分人會聯想到紅酒或氣泡酒的感覺，屬於正常的風味表現，請放心飲用。\n\n---\n\n### FAQ67｜客人08-20 訂購酵素組反映沒效 第一周早上空腹一包晚上睡前一包，第二…\n**Q：** 客人08-20 訂購酵素組反映沒效\n第一周早上空腹一包晚上睡前一包，第二周一天一包\n一天約喝3小瓶礦泉水\n一開始有瘦，但後面沒瘦就不吃了  \n商品酵素剩約9盒 茶包4小包\n\n平時早上喝保力達，中午吃飯+菜，但未告知多少量，晚餐跟中餐一樣量 睡前喝高粱\n已有告知客人商品不含藥物成分 需靠飲食改善\n\n有建議方式嗎?\n**A：** 感謝您的使用回饋，第一週有下降代表腸道代謝是有反應的，後面停滯多半跟日常飲食與作息比較有關。\n\n依照您提供的資訊，以下幾點可能會影響效果：\n\n1. 睡前喝高粱=>會讓身體優先代謝酒精，而不是脂肪，因此會讓減脂停住。\n2. 保力達含糖量較高，容易造成熱量超過，也會讓體重停滯。\n3. 水量略少，建議一天至少 2000～2500ml，有助於代謝。\n4. 中晚餐的飯量如果稍多，也會影響整體進度。\n\n以下建議您可以參考看看~\n1.晚上先不要喝烈酒\n2.早餐改喝水，保力達改成餐後或不喝\n3.中晚餐的飯量減到半碗\n4.水量調整到一天 2000～2500ml\n5.酵素早晚各 1 包（餐前吃更適宜）\n6.茶飲放在早上或下午喝，晚上不要喝代謝型茶\n\n酵素本身不含任何藥物，也不會強迫瘦下來\n需要搭配身體代謝的習慣調整才比較容易持續作用。\n調整後再觀察 7～10 天來觀察看看喔\n\n---\n\n### FAQ68｜喝酵素茶包康普茶到拉肚子\n**Q：** 喝酵素茶包康普茶到拉肚子\n**A：** 有時候客戶吃的狀況或方式不明\n加上個人體質關係\n如果一直拉肚子，會建議就先不要再吃比較好\n\n如果可以，也建議退貨的好\n\n---\n\n### FAQ69｜元氣能量球 4歲和11歲的小孩可以吃嗎？\n**Q：** 元氣能量球 4歲和11歲的小孩可以吃嗎？\n**A：** 食品6歲以上就可以吃了~但因含有牛樟芝菌絲體，建議諮詢醫生或營養師喔\n\n---\n\n### FAQ70｜客人服用酵素和茶，體重上升，有比較婉轉解釋？有告知飲食控制\n**Q：** 客人服用酵素和茶，體重上升，有比較婉轉解釋？有告知飲食控制\n**A：** 有些客人在剛開始喝酵素或茶飲的前 1～2 週，確實會出現體重小幅上升的情況，這通常不是脂肪增加，而是身體在調整期的反應。\n\n酵素與茶飲會讓腸道開始活動、代謝變好\n->原本累積在腸道內的食物與水分暫時增加\n->體重機會先反映出來，但腰圍與體脂通常不會同步增加\n\n剛開始補充纖維、酵素、植物萃取\n->身體會暫時留住較多水分來適應\n->通常1–2週內會改善\n\n即使吃得清淡，但如果：\n1.澱粉集中在某一餐\n2.飲料、餅乾、酒精仍有攝取\n3.水量不足\n都可能影響體重數字的變化\n=>會建議搭配飲食與水量一起調整，效果會比較穩定\n\n建議目前可以先\n(1)酵素維持每天 1–2 包，不要急著加量\n(2)茶飲泡淡一點（800–1000 ml）\n(3)水量一天至少 2000 ml\n(4)晚上避免餅乾、含糖飲料或酒精\n\n這樣身體比較不會卡在調整期喔\n\n---\n\n### FAQ71｜丟丟茶對於火氣大有沒有幫助?\n**Q：** 客人詢問丟丟茶對於火氣大有沒有幫助?\n**A：** 丟丟茶配方裡，主要是以 草本植物與植物萃取為主\n對於「火氣大」是有幫助的，但屬於溫和調整型，不是藥物。\n\n食用建議\n火氣大時：\n建議 1 包 + 600–800ml的水\n避免泡太濃\n\n請勿同時搭配：\n1.酒精\n2.太油、太辣食物\n\n★如果是\n長期嚴重火氣\n嘴破反覆發炎\n伴隨胃痛、腹瀉\n建議仍要評估飲食與生活作息，以及諮詢醫師\n\n---\n\n### FAQ72｜DIU系列商品 如固定都有在補鐵劑跟鈣這類型的要分開嗎？因為這是飯後吃…\n**Q：** 請問一下，DIU系列商品\n如固定都有在補鐵劑跟鈣這類型的要分開嗎？因為這是飯後吃，這兩個一個是中午飯後，一個是晚上飯後\n那這樣會不會影響吸收\n**A：** 建議鐵劑跟鈣本來就分開吃比較好，像您中午飯後吃鐵、晚上飯後吃鈣，這樣是很好的安排。\nDIU 系列商品不會影響吸收，只要不要和鐵、鈣同時一起吃就可以。\n\n小提醒\n若含有 膳食纖維或多酚\n建議與鐵劑間隔 1 小時以上再食用喔\n\n---\n\n### FAQ73｜水凝霜沒裝滿感覺裡面有水氣，內容物疑似變質\n**Q：** 客人反應水凝霜沒裝滿感覺裡面有水氣，內容物疑似變質\n**A：** 先跟您說明一下這款水凝霜的產品特性，讓您比較安心了解目前看到的狀況\n\n這款水凝霜屬於高含水的凝膠型配方，本身含有玻尿酸、保濕醣類與凝膠結構成分，在靜置或經過運送、溫差變化後，內料有可能會與玻璃瓶內壁微脫離，\n\n當您晃動瓶身時，若看到內料在瓶內整團轉動，這是凝膠型產品的物理現象，並不是變質或品質異常。\n\n另外，因為是高含水凝膠配方，表面有時會看起來像有水氣，這屬於凝膠在溫差下的自然反應，並非進水或壞掉；而產品是依內容物重量填充，因此在產品靜置後，外觀看起來可能會有些許空隙，這屬於包裝與凝膠質地的正常呈現方式。\n\n由於配方中含有高比例保濕成分與凝膠結構，並不會像乳霜類產品固定貼附在瓶壁上，看起來可能會與一般霜狀產品不同，但實際使用時質地與效果不會受到影響。\n\n再請您放心使用喔\n\n---\n\n### FAQ74｜康普茶綠茶口味，沒有氣泡正常嗎？前幾天喝的薑檸都有氣泡！\n**Q：** 請問康普茶綠茶口味，沒有氣泡正常嗎？前幾天喝的薑檸都有氣泡！\n**A：** 康普茶本身設計上會帶有些微氣泡感，但氣泡的明顯程度會受到沖泡水量與口味配方影響。\n\n如果水量泡得比較多，氣泡感會相對被稀釋，看起來或喝起來就會比較不明顯；建議依照建議水量沖泡，氣泡感會比較容易感受到。\n\n另外，不同口味因為原料特性不同，氣泡感本來就會有差異，像薑檸口味通常比較明顯，綠茶口味則偏清爽，氣泡感較輕，這都屬於正常情況，還請安心飲用喔\n\n**客服備註：** 此案例回覆時舊款仍在販售；康普茶綠茶、薑檸口味目前已停售，僅供參考，請勿再推薦這兩款口味。\n\n---\n\n### FAQ75｜DIU+保養品客戶雷射後可以使用嗎?\n**Q：** 請問DIU+保養品客戶雷射後可以使用嗎?\n**A：** Diu+系列的保養品\n不含以下成分\n果酸 / 酵素\n酸類去角質\n高濃度刺激性成分\n\n雷射術後的皮膚較脆弱，初期（前 24–72 小時）建議先以醫師術後照護為主，不要使用任何保養品。\n若醫師評估皮膚已開始癒合、沒有開放性傷口或過度敏感時，Diu+系列商品是溫和保濕與修護型配方，可以先從局部測試後再開始使用喔\n\n---\n\n### FAQ76｜藍銅養膚水客戶反應聞起來臭臭的有點像桂圓的味道\n**Q：** 請問藍銅養膚水客戶反應聞起來臭臭的有點像桂圓的味道\n**A：** 因為成分裡含有肉桂樹皮萃取、靈芝萃取與銅胜肽，這些原料本身就會帶有草本或辛香氣味，所以有些人會比較明顯聞到像肉桂或草本的味道，屬於正常現象喔\n\n---\n\n### FAQ77｜產後可以喝新版纖纖飲嗎？\n**Q：** 產後可以喝新版纖纖飲嗎？\n**A：** 玫瑰孅孅飲升級版在產後是可以評估飲用的，但需要看是否有哺乳。如果目前沒有哺乳，產後滿一段時間、身體狀況穩定後，可以從少量開始嘗試；如果正在哺乳，因配方中含有多種植物萃取，為保守起見，會建議等停止哺乳後再飲用。\n\n若產後仍有體虛、腸胃不穩、貧血或正在服用藥物，建議先與醫師確認再使用。\n\n---\n\n### FAQ78｜康普茶，酵素，孅孅飲，這3種可以加在一起泡嗎？\n**Q：** 客人問：康普茶，酵素，孅孅飲，這3種可以加在一起泡嗎？\n**A：** 康普茶、酵素和孅孅飲不建議加在一起泡，因為三種對腸胃的作用不同，一起喝比較容易不舒服，也可能影響效果。\n\n建議分開喝、錯開時間，像酵素早上吃，孅孅飲餐後喝，康普茶下午或飯後單獨喝，腸胃會比較好適應。\n\n---\n\n### FAQ79｜康普茶可以加酵素一起吃飯前，飯後在喝孅孅飲嗎？\n**Q：** 請問康普茶可以加酵素一起吃飯前，飯後在喝孅孅飲嗎？\n**A：** 不建議把康普茶跟酵素一起在飯前喝，因為康普茶偏酸、又有氣泡感，搭配酵素空腹喝比較容易刺激胃，造成胃部不適，也會影響酵素的作用。\n\n建議酵素飯前單獨吃，孅孅飲餐後再喝，康普茶則安排在下午或飯後一段時間單獨喝，腸胃會比較舒服，效果也比較穩定。\n\n---\n\n### FAQ80｜纖纖飲飯前半小時喝最好不是嗎？\n**Q：** 纖纖飲飯前半小時喝最好不是嗎？\n**A：** 孅孅飲確實很多人會選擇飯前半小時喝，特別是想增加飽足感的時候。\n不過如果本身腸胃比較敏感，或是同時有在吃酵素，就會比較建議改成飯後喝，腸胃會更舒服。\n兩種方式都可以，主要看自己的腸胃反應調整。\n\n---\n\n### FAQ81｜纖纖飲,丟丟茶,酵素內有活血的成分嗎?\n**Q：** 請問纖纖飲,丟丟茶,酵素內有活血的成分嗎?\n**A：** 三款產品主要是以促進消化、代謝與腸道功能為主，並沒有加入傳統醫學上認定的活血促進循環的成分。\n有些植物萃取可能讓人覺得比較暖或輕微舒暢，但它們不是正式的活血藥材，不會直接促進血液循環喔\n\n---\n\n### FAQ82｜長期上大夜班或小夜的如何使用產品？因為作息睡覺時間跟平常不一樣，我有購買…\n**Q：** 客人問：請問長期上大夜班或小夜的如何使用產品？因為作息睡覺時間跟平常不一樣，我有購買丟丟茶、酵素粉、纖纖飲…這三樣什麼時間使用最適合？謝謝….因為除了纖纖飲剛收到還沒開始使用，其他兩種產品我已經使用快三個月了，到現在不管體重、小腹還是外觀體型都沒改變，想說是否我使用的時間錯誤？我知道產品不是藥需要時間，但如果是因為自己使用的時間錯誤導致沒有效果就很可惜，所以想詢問上夜班該如何服用產品呢？？\n**A：** 夜班族的作息跟一般人不同，產品使用時間要以「醒來與進食的節奏」來調整，而不是看時鐘。\n您目前沒有明顯變化，很可能不是產品問題，而是使用時段沒有對到身體的代謝節律。\n\n一、酵素粉（調整腸道、幫助消化）\n最適合時間\n->「剛起床、還沒吃東西之前」\n\n二、丟丟茶（代謝、循環、排出）\n最適合時間\n->「清醒活動時間最長的時段」\n\n三、纖纖飲\n->喝在「一天吃最多、最固定的那一餐之前\n\n以下提供食用的建議給您參考\n\n夜班族建議這樣用：\n(1)起床後（22:00～23:00）\n→ 酵素 1 包（空腹）\n(2)上班期間或晚餐後\n→ 丟丟茶 1 包（慢慢喝）\n(3)晚餐前 20～30 分鐘\n→ 纖纖飲 1 包\n不需要加量、不需要混在一起食用喔\n\n---\n\n### FAQ83｜客人有購買酵素茶包 康普茶 反映喝了之後月經一直來 請問有遇過相關問題嗎…\n**Q：** 客人有購買酵素茶包 康普茶 反映喝了之後月經一直來 請問有遇過相關問題嗎?\n**A：** 目前產品成分中沒有荷爾蒙或雌激素，屬於一般食品或保健型配方，理論上不會直接影響月經週期。不過每個人體質不同，\n不過每個人體質不同，若近期有：\n作息改變\n壓力增加\n飲食調整\n保健食品更換\n體重快速變化\n\n都有可能影響荷爾蒙平衡與經期狀況。\n若出現經期異常，建議先暫停產品 3～7 天觀察，若狀況持續，會建議諮詢婦產科醫師確認較安心喔\n\n---\n\n### FAQ84｜喝丟丟茶一直跑廁所是正常嗎，肚子還會一些攪痛正常嗎 我用熱水泡然後加冷水…\n**Q：** 喝丟丟茶一直跑廁所是正常嗎，肚子還會一些攪痛正常嗎\n我用熱水泡然後加冷水到700Cc\n早上上班開始喝，喝完在回沖700Cc\n**A：** 初期排便次數增加或腸道蠕動感，部分體質會出現，是代謝與腸道調整的反應。建議一包茶一次泡800～1000cc，一天慢慢喝完即可，不建議回沖累積過多水量，這樣腸胃會比較穩定。\n\n---\n\n### FAQ85｜粉底液底部黑黑正常嗎\n**Q：** 客人反映粉底液底部黑黑正常嗎\n**A：** 您所看到的粉底液瓶底黑黑的小點並不是髒東西或產品變質，是因為壓頭裡的吸管底部與瓶底貼近時擠壓造成的痕跡。\n產品品質與使用效果都正常，請安心使用喔\n\n---\n\n### FAQ86｜康普茶泡完馬上喝，為什麼底下還有殘留像糖粉的東西？\n**Q：** 康普茶泡完馬上喝，為什麼底下還有殘留像糖粉的東西？\n**A：** 您好～康普茶沖泡後杯底若看到像糖粉或細微沉澱，通常與配方成分及水溫溶解度有關喔 😊\n產品中含有膳食纖維、糖醇類與茶粉等原料，這些成分在冷水中溶解速度較慢，沖泡後短時間內可能會有些微沉澱或懸浮，屬於正常現象，攪拌後即可均勻飲用。\n建議可先用少量溫水沖開，再補冷水至適合的水量，或飲用前稍微攪拌，會更均勻喔\n\n---\n\n### FAQ87｜Diu+ Tea丟丟茶，三款有含兒茶素嗎?\n**Q：** Diu+ Tea丟丟茶，三款有含兒茶素嗎?\n**A：** 丟丟茶中若含茶葉（如紅茶），本身就會有天然的兒茶素成分；\n像 洛神茶、鳳梨酵素茶 因含紅茶，會有少量天然兒茶素，\n而 大麥薄荷茶 為草本配方，則不含兒茶素喔。\n\n---\n\n### FAQ88｜茶包色素那麼種對人體不會有危害嗎?\n**Q：** 客戶詢問茶包色素那麼種對人體不會有危害嗎?\n**A：** 您好，\n\n我們產品沒有添加人工化學色素，部分口味會含有天然植物來源的色澤與風味成分（如茶葉、多酚、植物萃取物等），主要是來自原料本身。\n\n依照片判斷，杯蓋矽膠圈與吸管顏色變深，較可能是茶中的天然植物色素與多酚類（例如茶葉中的單寧、多酚成分）附著在材質表面所造成。\n\n像大麥、紅茶或草本植物在熱水沖泡後，會釋放天然色素與微量油脂，這些成分較容易附著在 矽膠、塑膠或吸管材質上。\n\n若：\n使用熱水沖泡\n長時間浸泡或悶著\n杯具材質較軟（如矽膠）\n都可能讓顏色看起來較深。\n\n這屬於材質染色現象，並非產品變質或有害物質，對飲用安全沒有影響，請放心使用。\n\n若希望減少染色情況\n建議飲用方式如下：\n\n1.沖泡後盡量在適當時間內飲用，避免長時間悶著\n2.可優先使用玻璃或陶瓷杯具\n以上提供您參考\n\n---\n\n### FAQ89｜客戶喝藤黃果洛神茶包有很重的藥味\n**Q：** 客戶喝藤黃果洛神茶包有很重的藥味\n**A：** 您好 😊\n不同口味的茶包因配方中的植物原料不同，風味也會有差異。\n\n洛神口味本身含有 洛神、仙楂、紅茶與草本萃取成分，天然植物在熱水沖泡後會釋放較明顯的酸香與草本氣息，有些人會感覺像藥味或味道較重，這屬於原料本身的自然風味\n\n另外風味也可能受到以下因素影響：\n\n水量較少 → 味道會更濃\n浸泡時間較久 → 草本味會更明顯\n水溫較高 → 釋放成分較多\n\n建議可以：\n(1)增加水量\n(2)縮短浸泡時間（約3–5分鐘）\n(3)調整到自己習慣的濃度\n\n以上提供您參考\n\n---\n\n### FAQ90｜客戶喝藤黃果洛神茶包有酒味感覺是發酵的那種味道、我已經拆兩盒了，有的會有…\n**Q：** 客戶喝藤黃果洛神茶包有酒味感覺是發酵的那種味道、我已經拆兩盒了，有的會有的不會不知道是正常嗎？怎麼會這樣？\n**A：** 您好\n藤黃果洛神茶屬於 多種植物原料調配的草本茶飲，其中包含洛神、紅茶及植物來源萃取成分。天然植物原料在製程與保存過程中，本身就可能帶有 類似發酵、果酸或微微熟成的氣味感受，有些批次或單包在沖泡後，氣味表現會稍微明顯，因此會讓部分消費者感覺像「酒香」或發酵味。\n\n這種情況通常與以下因素有關：\n✔ 植物原料天然批次差異\n✔ 個別茶包中原料分布比例不同\n✔ 沖泡水溫或悶泡時間不同\n\n因此才會出現 同一盒內，有的味道較明顯、有的較不明顯 的情形，這在天然草本茶中是可能發生的現象喔\n\n---\n\n### FAQ91｜長期打醫美的客人詢問藍銅系列可以當每日保養品嗎?\n**Q：** 長期打醫美的客人詢問藍銅系列可以當每日保養品嗎?\n**A：** 您好\nDIU 藍銅系列是可以作為每日基礎保養使用的，尤其對於長期有在進行醫美療程的肌膚，其實是相對合適的保養類型。\n\n但請注意\n若是「剛做完醫美療程」：\n\n🔹 建議避開 術後立即（約3～5天內）傷口未穩定期\n🔹 等肌膚無明顯泛紅、滲液或刺痛後再恢復使用會較理想\n\n以上供您參考\n\n---\n\n### FAQ92｜泡纖纖飲都會粉粉的嗎？ 喝起來本來就還是會有粉感？還是水不夠溫去溶解呢？…\n**Q：** 泡纖纖飲都會粉粉的嗎？\n喝起來本來就還是會有粉感？還是水不夠溫去溶解呢？(即便溫還是不太好溶的感覺😅)\n**A：** 您好 😊\n纖纖飲沖泡後如果覺得有一點粉粉的口感，其實是產品本身的正常狀態喔\n因為纖纖飲裡面含有 高比例膳食纖維（如洋車前子殼、植物纖維等），\n\n他的成分特性是：\n\n👉 會吸水膨脹\n👉 形成纖維狀結構\n👉 不會像糖或奶粉完全溶解\n\n所以喝起來會有粉粉的纖維口感，這是產生飽足感與幫助順暢的重要來源。\n\n建議食用方式如下\n1.溫水約40～50°C 沖泡\n2.先加水 → 再倒粉\n3.搖勻後靜置約30秒再喝\n4.水量控制在200cc左右口感相對比較好\n\n以上供您參考\n\n---\n\n### FAQ93｜養膚水、水凝霜有美白的成份嗎?\n**Q：** 客人詢問養膚水、水凝霜有美白的成份嗎?\n**A：** 您好\n\n養膚水與水凝霜幫助肌膚提亮、改善暗沉的養膚型成分\n主要為「溫和養膚型」而非刺激型美白：\n\n1.藍銅胜肽（Copper Tripeptide-1）\n→ 協助肌膚修護與更新，使膚色看起來較均勻透亮\n2. 芭樂果萃取\n→ 抗氧化，改善暗沉與疲勞膚色\n3. 番木瓜萃取\n→ 溫和調理老廢角質，使肌膚較明亮\n4. 草莓虎耳草萃取\n→ 常見亮膚植萃，幫助提升肌膚光澤感\n\n沒有添加容易造成光敏或反黑的美白成分\n\n---\n\n### FAQ94｜酵素吃了沒效果，去年10月第一次跟阿佑買約6000多，後續又跟丟妹買12…\n**Q：** 客人反饋 酵素吃了沒效果，去年10月第一次跟阿佑買約6000多，後續又跟丟妹買12354元，每天都持續吃，但覺得一點用都沒有\n平常飲食有控制，每天飲水量都有達2000CC，但都覺得沒有實際減重效果\n早餐吃青菜或起司饅頭+咖啡，中午少量，晚餐有時不吃 \n想詢問是否方式錯誤\n**A：** 您好\n酵素本身主要的作用是：\n\n✔ 協助消化\n✔ 幫助腸道順暢\n✔ 促進代謝環境\n\n不是作為瘦身藥品的作用喔\n如果飲食結構與代謝狀況沒有改變，體重較不一定明顯下降。\n\n酵素主要幫助腸道與代謝環境，如果吃得太少反而會讓身體代謝下降，建議先把蛋白質與三餐結構調整好，再搭配酵素會比較有感。\n\n「不是您方式錯誤，而是身體可能已經進入低代謝狀態。」\n這時候靠吃更少，只會更卡。\n\n從您目前飲食來看\n目前的吃法：\n早餐：青菜或起司饅頭＋咖啡\n中午：少量\n晚餐：有時不吃\n\n這種模式其實很容易出現：\n\n因為吃太少或跳過一餐，\n身體會認為進入飢餓狀態，\n反而更容易囤積脂肪。\n\n給您建議的調整方式如下（比單純加量更重要）\n\n✔ 早餐增加蛋白質（蛋、豆漿、雞胸肉）\n✔ 晚餐不要完全不吃，可少量蛋白質＋蔬菜\n✔ 酵素建議：\n早上空腹1包\n晚餐前或睡前1包\n✔ 規律三餐比少吃更重要\n\n以上提供您參考喔\n\n---\n\n### FAQ95｜客戶食用了咕嚕咕嚕超鮮酵素三個禮拜 這三個禮拜酵素都是一天兩包，水份都是…\n**Q：** 客戶食用了咕嚕咕嚕超鮮酵素三個禮拜\n這三個禮拜酵素都是一天兩包，水份都是2000ml以上\n排便正常，飲食均衡。晚餐都不吃澱粉類、會在19:00前食用完畢\n想詢問為什麼體重反增不減？\n**A：** 酵素產品主要的作用是 幫助消化與調整腸道環境，讓身體代謝與排便更順暢，但它本身並不是直接燃燒脂肪的產品，因此體重的變化有時不會立即反映在短時間內。\n\n您提到排便正常、飲食均衡，其實代表腸道狀況已經在調整中。不過在開始調整飲食或補充相關產品的前幾週，有些人會出現 體重暫時波動或略微上升，常見原因包括：\n\n身體水分與腸道內容物的變化\n\n膳食纖維攝取增加造成暫時性的重量增加\n\n代謝調整期，體脂與體重變化不同步\n\n另外，晚餐完全不吃澱粉，有時也可能讓身體進入較節能的代謝狀態，反而讓體重變化不明顯。部分營養師也會建議 少量均衡攝取澱粉與蛋白質，讓身體維持正常代謝。\n\n建議可以再持續觀察一段時間，同時搭配：\n\n規律作息與適度運動\n三餐均衡（蛋白質、蔬菜與少量澱粉）\n持續維持足夠水分\n\n有些人會先感受到 排便順暢或體態改變，體重的變化則需要較長時間才會慢慢出現喔\n\n---\n\n### FAQ96｜客人想詢問甲狀腺亢進是否能使用玫瑰纖纖飲\n**Q：** 客人想詢問甲狀腺亢進是否能使用玫瑰纖纖飲\n**A：** 您好 \n若有甲狀腺亢進的狀況，在補充任何保健食品前，建議先與醫師確認會比較安心。\n\n玫瑰纖纖飲主要成分為 膳食纖維(如洋車前子殼)、植物萃取物與綜合酵素等，產品本身並未添加甲狀腺相關荷爾蒙或刺激甲狀腺的成分。\n不過因每個人的身體狀況與用藥情形不同，如果目前：\n\n1.正在服用甲狀腺藥物\n2.甲狀腺功能仍在調整中\n\n建議先詢問醫師是否適合補充，以確保不影響個人的治療與身體狀況。\n\n若醫師評估可以使用，也建議從少量開始觀察身體反應，並與藥物間隔一段時間再食用。\n\n---\n\n### FAQ97｜diu康普茶全素可以喝嗎\n**Q：** diu康普茶全素可以喝嗎\n**A：** 康普茶是全素可飲用的。\n產品配方主要為茶粉、植物來源膳食纖維與植物萃取等成分，未添加任何動物性原料，因此 素食者（全素/純素）也可以安心飲用。\n\n---\n\n### FAQ98｜客人酵素和茶已經喝約 三天，會一直拉軟便 是正常的嗎\n**Q：** 請問客人酵素和茶已經喝約 三天，會一直拉軟便 是正常的嗎\n**A：** 您好\n有些人剛開始食用 酵素或茶包的前幾天，因為腸道開始調整，可能會出現排便次數增加或大便變軟的情況，這在初期是有機會發生的。\n\n酵素與茶中的植物萃取與膳食纖維成分，會幫助腸道蠕動與排便順暢，因此有些人前幾天會感覺排便比較頻繁或偏軟，通常身體適應後會慢慢恢復正常。\n\n如果覺得排便次數太多或不太舒服，可以先調整使用方式，\n\n例如：\n1.酵素先減量\n2.茶包水量增加一些或隔天飲用\n\n再觀察一下喔\n\n---\n\n### FAQ99｜康普茶澎起來裡面硬硬的正常嗎?\n**Q：** 請問康普茶澎起來裡面硬硬的正常嗎?\n**A：** 您好 \n康普茶是粉末型飲品，有時在運送或保存過程中，因為 粉末顆粒聚集或受壓，摸起來可能會有 結塊或較硬的感覺，這種情況偶爾是可能發生的。\n\n外包裝沒有破損、沒有漏氣、沒有異常味道或變色，通常不會影響產品本身的飲用安全與品質。沖泡時稍微攪拌或搖勻，一般都可以正常溶解喔\n\n---\n\n### FAQ100｜吃咕嚕以後都拉在身上跟床上，整個廁所都是\n**Q：** 客反映吃咕嚕以後都拉在身上跟床上，整個廁所都是\n**A：** 您好\n因為酵素產品中含有植物酵素與膳食纖維成分，有些人在剛開始食用或體質較敏感時，腸道蠕動會明顯增加，較容易出現排便次數增加或腹瀉的情況。\n\n會建議您：\n\n1.暫停食用酵素\n2.多補充水分與電解質\n\n觀察腸胃是否恢復正常喔\n\n---\n\n### FAQ101｜丟丟茶的成分 癌症的病患，也可以正常食用嗎?\n**Q：** 請問丟丟茶的成分\n癌症的病患，也可以正常食用嗎?\n**A：** 您好\n丟丟茶主要成分為 茶葉與植物來源萃取物，例如大麥、紅茶、洛神、草本植物萃取等，產品本身 沒有添加藥物或治療型成分。\n\n不過若是癌症患者或正在接受治療(如化療、放療、標靶治療等)，因每個人的身體狀況與治療方式不同，建議在食用任何保健食品或草本產品前，先與主治醫師確認是否適合，會是比較安全的方式。\n\n主要原因是：\n\n部分草本成分可能與治療藥物代謝相關\n治療期間身體狀況較敏感，需要個別評估\n\n如果醫師評估可以飲用，建議 先少量嘗試並觀察身體狀況，再依個人情況調整喔\n\n---\n\n### FAQ102｜酵素、纖纖飲、苦瓜胜肽、紅潤膠囊 全部加起來要怎麼吃 平常空腹有在吃益生…\n**Q：** 酵素、纖纖飲、苦瓜胜肽、紅潤膠囊\n全部加起來要怎麼吃\n\n平常空腹有在吃益生菌膠原蛋白bc 可以一起吃還是需要差多久時間？\n**A：** 若同時有食用 酵素、纖纖飲、苦瓜胜肽、紅潤膠囊，以及平常有補充益生菌、膠原蛋白、B群，建議可以依照下列方式分開食用，吸收會比較好，也比較不會造成腸胃負擔。\n\n建議可食用方式:\n空腹：益生菌 → 酵素\n早餐後：紅潤膠囊＋B群\n餐前：纖纖飲\n餐後：苦瓜胜肽\n晚上：酵素\n\n這樣分開食用即可，不需要間隔很久。\n\n★需要特別注意\n1.益生菌與酵素空腹吃即可，不一定要間隔很久，約10～20分鐘\n2.孅孅飲因含有膳食纖維，建議餐前30分鐘喝效果比較好\n3.苦瓜胜肽建議會隨餐或飯後食用比較不刺激胃\n\n---\n\n### FAQ103｜大激賞納豆要怎麼吃法呢?\n**Q：** 請問大激賞納豆要怎麼吃法呢?\n**A：** 大激賞納豆建議 每天1顆，空腹或睡前吃吸收較好。\n40歲以上想加強保養可以 一天2顆（早晚各1顆），搭配開水即可喔。\n\n另外提醒：\n1.建議搭配溫水或常溫水食用\n2.避免與過熱飲品一起吃\n3.若有正在服用抗凝血藥物或特殊疾病，建議先諮詢醫師後再食用。\n\n---\n\n### FAQ104｜昨天早上空腹跟睡前各一包酵素 外加丟丟茶一包喝一天水量大約1000cC …\n**Q：** 客人詢問\n請問 昨天早上空腹跟睡前各一包酵素 外加丟丟茶一包喝一天水量大約1000cC\n今天早上空腹也一包酵素\n然後就開始拉肚子 \n請問這正常嗎？😅\n**A：** 有些人在剛開始食用酵素或搭配茶飲時，腸胃蠕動會變得比較活躍，可能會排便次數增加或較軟便的情況，這通常是身體在調整腸道環境的過程，部分人會有類似反應。\n\n不過如果出現明顯拉肚子或不太舒服，建議可以先 把酵素改成一天一包即可，讓身體慢慢適應，同時茶包也可以先 減量或隔天飲用，觀察腸胃狀況。\n\n另外建議 水量可以增加到約1500～2000cc，幫助腸道循環會比較順。\n\n---\n\n### FAQ105｜康普茶是不是有糖份？適合糖尿病的喝嗎？如果要去肚子的油脂是不是喝丟丟茶…\n**Q：** 請問：康普茶是不是有糖份？適合糖尿病的喝嗎？如果要去肚子的油脂是不是喝丟丟茶比較適合呢？因為有吃三高的藥，所以想確認，以便下單，謝謝\n**A：** 您好～康普茶並非無糖產品。若有糖尿病或正在服用三高相關藥物，由於每個人的身體狀況、飲食控制及用藥情形都不同，建議先與主治醫師確認後再補充會比較安心；若醫師評估可以飲用，也建議與藥物間隔約2小時，並先從少量、飯後飲用開始觀察。\n\n如果是想針對腹部油脂做日常體態管理，丟丟茶（藤黃果茶系列）會是比較合適的選擇；不過丟丟茶同樣建議先與醫師確認後再補充喔。\n\n---\n\n### FAQ106｜114年11/20開始喝丟妹的酵素跟丟丟茶 抽血報告顯示肝功能飆到153…\n**Q：** 客表示114年11/20開始喝丟妹的酵素跟丟丟茶\n抽血報告顯示肝功能飆到153 請問是否正常\n**A：** 一般來說，酵素與茶飲屬於食品，並不是以影響肝功能為主要作用的產品，但每個人的體質、代謝狀況不同，加上同時可能有：\n\n飲食習慣\n熬夜壓力\n原有的身體狀況(如脂肪肝、B/C肝等）\n藥物使用\n都有可能影響肝指數變化。\n\n建議您：\n\n先暫緩目前飲用\n依照醫師建議追蹤肝功能指數\n提供醫師目前食用的產品資訊，讓醫師一起評估會更安全\n\n---\n\n### FAQ107｜酵素 有子宮肌瘤的人可以吃嗎？\n**Q：** 客人問：請問酵素 有子宮肌瘤的人可以吃嗎？\n**A：** 您好～有子宮肌瘤的話，酵素一般是屬於食品類，通常是可以食用的，但還是要看產品成分與個人體質。\n\n我們的酵素主要是以植物發酵、酵素與益生菌相關成分為主，並不是荷爾蒙類產品，不會直接影響女性荷爾蒙。\n\n另外建議您：\n1.若肌瘤較大或醫師告知持續追蹤\n2.或本身對保健品較敏感\n\n可以先少量開始（例如一天半包或一包）觀察身體狀況。\n如果有搭配其他婦科藥物或療程，也建議先詢問醫師會更安心喔。\n\n---\n\n### FAQ108｜黑棗精吃了3-4天無感，你們說對便祕的人很有效，能給解答嗎\n**Q：** 黑棗精吃了3-4天無感，你們說對便祕的人很有效，能給解答嗎\n**A：** 您好～\n\n黑棗精的作用屬於「溫和調整型順暢」，\n和一般刺激型產品（像瀉藥類）不同，\n它是透過膳食纖維＋天然山梨糖醇（Sorbitol）**，\n慢慢幫助腸道恢復正常蠕動。\n\n因為每個人的體質與飲食狀況不同，特別是：\n\n1.長期便秘\n2.腸道蠕動較慢\n3.水分攝取不足\n\n這些情況以可能需要幾天到1～2週的調整期\n\n建議您可以這樣調整\n(1)水量增加（很關鍵）\n→ 建議每天至少 2000～3000cc\n黑棗精的順暢原理其實是「纖維＋水分一起作用」，\n纖維需要吸收水分才能幫助軟化排便，\n同時黑棗中的天然山梨糖醇也會把水帶進腸道。\n\n->如果水量不足，效果就會比較不明顯\n\n(2) 食用時間\n→ 睡前或空腹效果通常較明顯\n(3)持續補充幾天觀察\n→ 讓腸道慢慢建立規律\n\n再請您調整看看\n\n---\n\n### FAQ109｜酵素粉有時候飯後吃都會反胃然後胃會不舒服，是什麼原因呢？\n**Q：** 客人詢問：\n酵素粉有時候飯後吃都會反胃然後胃會不舒服，是什麼原因呢？\n**A：** 有可能是當餐吃的比較油或空腹時間太長\n腸胃蠕動過快\n\n可以請客人在飲用後，多喝水\n\n如果客人是粉狀直接吃，\n請客戶改為泡水喝，不要粉狀直接吃\n如果是習慣直接粉狀吃，先改成半包，在循序漸進增量\n\n飲用酵素後，請務必多喝水喔\n\n---\n\n### FAQ110｜酵素兩包顏色不同,.味道也不同\n**Q：** 客戶詢問酵素兩包顏色不同,.味道也不同\n**A：** 您好～這個情況是正常的喔，可以放心\n\n我們產品沒有做過度人工調色或調味，所以會保留原料本身的自然差異\n\n再加上酵素產品本身是由多種植物原料發酵而成，因為原料來源（如水果、蔬菜、發酵時間等）會有天然差異，所以不同包之間，可能會出現：\n顏色略有深淺差異（偏白或偏黃）\n味道有些微不同\n\n這些都屬於天然發酵產品的正常現象，並不影響品質與效果喔\n\n若是莓果口味，因含天然果汁粉與花青素，遇到不同水溫、水質或放置時間，顏色也會有深淺差異，屬於正常現象。\n\n---\n\n### FAQ111｜喝康普茶會不會長痘痘？\n**Q：** 客人詢問喝康普茶會不會長痘痘？\n**A：** 您好，康普茶主要是由茶與發酵產生的有機酸與益菌組成，一般來說不屬於容易影響皮膚狀況的食品。長痘痘較多與整體作息、飲食習慣與體質有關。如果有疑慮，建議可以先少量飲用並觀察身體反應喔\n\n---\n\n### FAQ112｜苦瓜胜肽菌絲膠囊可以跟纖纖飲一起吃嗎?\n**Q：** 請問苦瓜胜肽菌絲膠囊可以跟纖纖飲一起吃嗎?\n**A：** 兩個產品是可以一起食用的。不過為了避免纖維影響吸收速度，好讓各自效果更穩定，一般建議可以錯開約30分鐘食用，效果會更穩定。\n提醒一下：如果本身有血糖相關問題或正在用藥，建議先評估或調整用量會比較安心。\n\n---\n\n### FAQ113｜飽包的袋子，有耐熱度嗎?\n**Q：** 請問飽包的袋子，有耐熱度嗎?\n**A：** 90度以下\n\n---\n\n### FAQ114｜社群客人詢問咖啡成份有 不好意思 再請問一下 裡面有糖份嗎？例如：糖、奶…\n**Q：** 社群客人詢問咖啡成份有\n不好意思 再請問一下 \n裡面有糖份嗎？例如：糖、奶精等⋯⋯？\n**A：** 您好\nClean Coffee配方中沒有額外添加人工製造的砂糖或奶精\n本身含有的微量糖份，源於咖啡豆在烘焙過程中，會釋放天然的碳水化合物，是原料中的天然成分。\n\n---\n\n### FAQ115｜喝酵素尿液變粉紅色 之前沒有遇過客戶反應過， 請問是體質嗎?還是跟成分有…\n**Q：** 客戶反應喝酵素尿液變粉紅色\n之前沒有遇過客戶反應過，\n請問是體質嗎?還是跟成分有關?\n**A：** 您好\n一般來說，酵素本身不太會直接造成尿液變粉紅色，\n但如果是像莓果類成分（如蔓越莓、藍莓等），有時候天然色素（花青素）代謝後，可能讓尿液顏色稍微偏紅，這種情況通常是暫時的，且與個人體質、代謝速度有關\n建議您可以多補充水分，觀察1～2天看看。\n\n---\n\n### FAQ116｜社群客人： 酵素、丟丟茶、康普茶、孅孅飲 我都有 第一星期開始 酵素早晚…\n**Q：** 社群客人：\n酵素、丟丟茶、康普茶、孅孅飲\n我都有\n第一星期開始\n酵素早晚飯前吃\n中午飯前康普茶\n丟丟茶整天喝\n孅孅飲睡前喝\n第二星期開始到現在\n酵素早飯前吃\n中午飯前康普茶\n丟丟茶整天喝\n孅孅飲睡前喝\n除了排便順暢（原本就沒有便秘）\n排尿次數變多（水喝多）\n吃到現在也有5-6個月持續這模式吃，但～～\n體脂肪也沒降反而高\n抽血檢查三高的數值也沒降\n飲食也沒有吃太油，也有增加蛋白質攝取\n開始吃到懷疑人生\n原本61kg➡️64kg\n產品還買一堆……\n\n有沒有比較專業解釋？\n**A：** 您好\n有關您提出的部分，以下為您整理說明\n\n(一)為什麼會沒瘦、甚至變重？\n\n您目前的搭配（酵素、康普茶、丟丟茶、孅孅飲）\n主要作用在：\n\n消化道調整、排便順暢、菌相平衡\n\n所以會出現：\n✔ 排便順暢\n✔ 排尿次數增加\n代表「腸道與代謝是有被啟動的」\n\n但另外有幾個常見影響因素\n\n(1) 腸道環境改善後，吸收效率提升\n(2) 有增加蛋白質攝取\n\n->變成「吃得比較健康，但整體攝取量提高」\n->體重就可能出現上升的情況\n\n(二)建議稍微調整食用方式\n\n早上（起床後）\n✔ 酵素（維持）\n\n中午飯前\n✔ 康普茶（維持，建議1包即可）\n\n白天\n✔ 丟丟茶（建議控制在1～2包內）\n\n👉 晚上（睡前）\n孅孅飲（維持）\n\n(三)額外提醒（這幾點會是關鍵）\n\n(1) 澱粉量可稍微減少約20～30%\n這一步對體脂影響會比較明顯\n\n(2) 蛋白質維持即可，不需額外增加\n重點在整體攝取量的平衡\n\n(3) 搭配適量運動\n有助於代謝與脂肪利用\n\n(4) 若攝取過低或不均衡\n身體可能進入「保護機制」，反而容易囤積能量\n\n(5) 壓力與作息也會影響荷爾蒙與代謝\n適度放鬆、睡眠穩定也很重要\n\n(四)目前是「腸道調整已有感」\n再搭配攝取量與生活習慣的微調\n通常後續體態才會開始有變化\n\n---\n\n### FAQ117｜我有收到奈米粉了，請問如果晝夜顛倒白天睡覺的話塗奈米粉還要塗防曬睡覺嗎？…\n**Q：** 客人問：我有收到奈米粉了，請問如果晝夜顛倒白天睡覺的話塗奈米粉還要塗防曬睡覺嗎？窗簾透進來的紫外線會不會也有影響？\n**A：** 您好\n奈米粉本身是保養用途\n不是防曬產品\n\n只要不是直接曬到太陽，室內睡覺基本上不用特別擦防曬，可以放心使用奈米粉做保養\n\n額外提醒：\n如果\n(1)窗簾很薄（透光很強）\n(2)或陽光會直接照到臉\n\n可以考慮：\n->拉遮光窗簾\n或\n->薄擦一層防曬\n\n以上提供您參考喔\n\n---\n\n### FAQ118｜丟飽包蛋白質有多少？/包\n**Q：** 請問丟飽包蛋白質有多少？/包\n**A：** 每包有20g的蛋白質含量\n\n---\n\n### FAQ119｜康普茶有說有加濃版 可以泡1000CC，但包裝上還是200cc 請問是水…\n**Q：** 請問一下 康普茶有說有加濃版  可以泡1000CC，但包裝上還是200cc\n請問是水量都可嗎?\n**A：** 包裝上建議 200cc 是標準濃度\n主要是讓風味與效果達到最佳平衡\n\n也可以依個人喜好加水到 500～1000cc 飲用喔\n\n---\n\n### FAQ120｜吃酵素一個月 越吃越胖 他想知道他是不是吃錯60->62.5kg\n**Q：** 客反映吃酵素一個月\n越吃越胖\n他想知道他是不是吃錯60->62.5kg\n**A：** 您好～\n有幾個常見原因提供您參考：\n\n①腸道變好 → 吸收變好\n->酵素＋茶類會先調整腸道\n->吸收效率提升\n變成：\n吃一樣的東西 → 身體吸收更多\n\n②水量增加＋代謝啟動\n\n一天2000cc水量＋茶飲\n身體在調整期\n\n可能會有：\n->水分滯留\n->體重短期上升\n\n③ 飲食「看起來健康，但總量偏多」\n\n您目前：\n\n早餐：酵素＋穀物\n中晚餐正常吃\n\n很容易出現：\n「吃得健康，但熱量其實變多」\n\n您目前比較像是「身體正在調整＋吸收變好」的過程\n\n以下調整的方向給您參考\n調整1：早餐內容\n建議：\n保留酵素\n穀物量稍微減少 或改高蛋白內容\n\n調整2：晚餐\n可以稍微控制：\n->澱粉減量\n->避免油炸（您目前OK~）\n\n調整3：觀察週期\n因為：\n前期在「調整腸道」\n才會逐漸進入「型態變化」\n再請您建議觀察 2～4週喔\n\n---\n\n### FAQ121｜那請問如果外出是要先塗奈米粉還是防曬？\n**Q：** 那請問如果外出是要先塗奈米粉還是防曬？\n**A：** 先奈米粉保養，等吸收後再擦防曬，這樣保養跟防護都能兼顧，效果會更好\n\n---\n\n### FAQ122｜吃安眠藥可以喝康普茶嗎？\n**Q：** 客人詢問吃安眠藥可以喝康普茶嗎？\n**A：** 您好\n康普茶含有有機酸＋益生菌\n可能影響藥物吸收速度(雖然不一定，但建議避開)\n可以喝康普茶，但請與安眠藥間隔至少 1～2 小時\n比較建議白天喝，晚上就避開睡前時段會比較穩定～\n\n---\n\n### FAQ123｜量子鎂素能量保濕噴霧客戶反映有沉澱物是正常的嗎?\n**Q：** 請問量子鎂素能量保濕噴霧客戶反映有沉澱物是正常的嗎?\n**A：** 因為產品本身的鎂濃度較高\n此為高濃度的鎂原料的成份，請放心使用\n\n---\n\n### FAQ124｜晚上吃飽吃苦瓜胜肽半夜都會脹氣 可以改什麼時候吃?\n**Q：** 客人詢問 晚上吃飽吃苦瓜胜肽半夜都會脹氣 可以改什麼時候吃?\n**A：** 您好～這個狀況是有可能發生的喔😊\n因為苦瓜胜肽菌絲膠囊裡面含有膳食纖維、菌絲體與代謝相關成分，有些人如果在「晚上吃飽後服用」，腸胃還在消化，\n比較容易出現脹氣或腸胃蠕動增加的情況。\n\n建議您可以調整在白天（早餐後或中餐前）食用\n這樣通常會比較舒服，也比較不影響睡眠\n\n---\n\n### FAQ125｜喝康普茶在吃降血壓藥可以嗎\n**Q：** 喝康普茶在吃降血壓藥可以嗎\n**A：** 您好 😊\n康普茶是可以飲用的，但建議與血壓藥間隔 1～2 小時服用，避免影響藥物吸收效果，會比較安心！\n\n---\n\n### FAQ126｜之前用姐姐的帳號訂購 現在越吃越胖 想了解是甚麼因\n**Q：** 客反映之前用姐姐的帳號訂購\n現在越吃越胖 想了解是甚麼因\n**A：** 您好～先跟您說明一下目前狀況，其實這樣的情形在初期是有可能發生的\n\n從您目前的吃法來看\n您有在補充：\n酵素/孅孅飲/茶飲\n這些會幫助腸道環境改善、吸收率提升\n->原本吸收不好的 → 現在吸收變好\n->有些人短期體重反而會上升\n\n建議調整方式\n\n(1)酵素改為\n早上空腹1包\n晚餐前30分鐘1包\n\n幫助控制食量\n\n孅孅飲\n中餐前15~30分喝\n\n丟丟茶維持即可\n\n(2)早餐\n建議可以加入少量優質澱粉（例如半顆地瓜或少量燕麥），讓身體有穩定能量來源，避免代謝過慢反而囤積。\n\n中餐稍微調整\n建議：\n\n飯減半\n少油（不要炸）\n增加蛋白質（雞肉、魚）\n\n再觀察2～4週就會開始比較有感喔\n\n---\n\n### FAQ127｜喝完酵素（優格、莓果、鳳梨口味）嘴巴或喉嚨會有微苦味，是正常的嗎？直接口…\n**Q：** 喝完酵素（優格、莓果、鳳梨口味）嘴巴或喉嚨會有微苦味，是正常的嗎？直接口服跟泡水喝都會。\n**A：** 您好\n酵素裡的分解酵素與果粉，在口中會有自然的「後苦味」，特別是蛋白分解酵素本來就帶苦，剛喝完時喉嚨會覺得苦是正常的\n\n如果不喜歡苦的後味，建議可以改用：\n1.增加水量150～200ml 水沖泡\n2.加在溫水喝（不超過40°C）\n3.搭配優格/豆漿\n\n這樣喉嚨的苦味會減少比較多喔\n\n---\n\n### FAQ128｜石墨烯 遠紅外線腳踝套洗的時候染色\n**Q：** 客人反應石墨烯 遠紅外線腳踝套洗的時候染色\n**A：** 石墨烯遠紅外線系列商品本身含有石墨烯材質，因其為深色特性，在清洗時若遇到浸泡或高溫，可能會有些微掉色或水色偏黑的情況，這是正常現象喔。\n\n建議的清洗方式如下：\n\n以清水手洗，輕輕搓洗、沖洗即可即可\n清洗後放置陰涼處自然晾乾\n\n另外，此類商品材質為機能性布料（非棉質），本身不易吸附髒污，一般不需要使用清潔劑；若有需要，建議少量使用即可。\n\n這樣的清洗方式也可以幫助維持商品的機能效果與使用壽命\n\n提醒﹕\n不可浸泡（避免染色、功能流失）\n不可使用洗衣機清洗\n不可使用柔軟精\n避免高溫（熱水、烘乾）\n\n---\n\n### FAQ129｜喝康普茶會利尿消水腫嗎?\n**Q：** 喝康普茶會利尿消水腫嗎?\n**A：** 康普茶本身因為含有茶類成分，會有一點點利尿效果，加上腸道順暢後，有些人會感覺比較不水腫、不脹氣。\n不過它不是專門的消水腫產品，效果會比較偏日常調整體質的方向喔\n\n---\n\n### FAQ130｜康普茶熱帶水果氣泡多，薑檸就沒有，是正常的嗎\n**Q：** 康普茶熱帶水果氣泡多，薑檸就沒有，是正常的嗎\n**A：** 您好～\n感謝您的回饋！關於您說到熱帶水果有氣泡、但薑檸口味氣泡感很少，這個情況其實是正常的喔\n\n康普茶的氣泡感會受到幾個因素影響：\n① 口味配方不同\n不同口味的原料特性本來就不一樣，有些口味天然氣泡感比較明顯，有些則偏清爽、氣泡感較輕，這是正常的口味差異。\n② 沖泡水量影響\n如果水量加得比較多，氣泡感就會被稀釋，看起來或喝起來會比較不明顯；建議依照建議水量約 200ml 沖泡，氣泡感會比較容易感受到喔。\n③ 沖泡水溫\n升級版康普茶建議水溫不超過 50℃，如果用冰水沖泡記得多攪拌，也可以讓氣泡感更均勻。\n\n至於效果感受不一樣的部分，每個人體質、飲食與作息不同，感受時間和明顯程度會有差異，這也是正常現象，建議持續飲用一段時間觀察整體反應喔\n\n**客服備註：** 此案例回覆時舊款仍在販售；康普茶綠茶、薑檸口味目前已停售，僅供參考，請勿再推薦這兩款口味。\n\n---\n\n### FAQ131｜有一包酵素喝起來臭臭的，顏色很黃 是正常的嗎?\n**Q：** 客反映有一包酵素喝起來臭臭的，顏色很黃\n是正常的嗎?\n**A：** 您好～這邊幫您說明一下\n\n酵素產品因含天然原料與發酵成分，顏色可能會因批次或保存狀況出現些微差異（如偏深或偏黃），這屬正常情況。\n\n但若出現明顯異味（如臭味）、顏色異常或口感異常，則不建議繼續食用。\n\n再請聯繫人進行更換\n\n---\n\n### FAQ132｜纖纖飲把它攪拌之後很希都沒有像之前會很濃稠\n**Q：** 客詢問纖纖飲把它攪拌之後很希都沒有像之前會很濃稠\n**A：** 孅孅飲在沖泡後的濃稠度，可能會因沖泡方式與原料特性出現差異，屬正常情況。\n\n常見原因如下：\n1. 水量或水溫較高，會讓口感偏稀\n2. 攪拌後立即飲用，纖維尚未完全吸水膨脹\n3. 膳食纖維為天然原料，不同批次吸水性可能略有差異\n\n提供給您參考：\n1. 水量控制在200～300cc\n2. 攪拌後靜置1～2分鐘再飲用\n3. 可依個人口感調整水量\n\n再請確認喔~\n\n您好～感謝您詳細的說明\n看您描述的使用方式（150cc、靜置5分鐘以上），其實已經是很標準的沖泡方式了\n這邊也理解您說的重點：\n這次的濃稠度確實和之前不一樣，甚至有沉澱的狀況\n這個部分我們幫您說明一下可能原因\n=>\n因為孅孅飲的主要成分是天然膳食纖維，不同批次在「吸水膨脹的速度與型態」上，確實可能會有些微差異：\n✔ 快速整體凝膠化（看起來直接變濃）\n✔ 先部分沉澱，再攪拌後才變濃\n👉 這兩種其實都是正常的物理現象，不影響成分與效果\n\n不過依您描述「沒有像之前那麼濃」，會比較建議您可以這樣調整試看看：\n✔ 攪拌後「再多攪一次」讓底部纖維均勻分散\n✔ 不要放太久（5分鐘以上有時反而會分層）\n✔ 可以稍微減少水量（例如100～120cc）測試濃度\n\n如果您嘗試後還是覺得口感明顯和之前差很多，再請與我們連繫協助處理更換事宜\n\n---\n\n### FAQ133｜以前有做過化療，有血管瘤可以喝酵素加玫瑰纖纖飲嗎\n**Q：** 客詢問以前有做過化療，有血管瘤可以喝酵素加玫瑰纖纖飲嗎\n**A：** 您好～這邊先跟您說明一下\n因為您提到曾做過化療，且有血管瘤的狀況，這類屬於較需要留意的體質，\n在保健食品的使用上會建 議稍微保守一些。\n目前像酵素與玫瑰孅孅飲，主要是做腸道調整、代謝與營養補充，\n一般健康族群是可以使用的，但：\n👉 若有腫瘤相關病史或血管異常狀況\n👉 或仍在追蹤／用藥中\n會建議您先諮詢您的主治醫師，確認目前身體狀況是否適合使用，再做搭配會比較安心\n\n---\n\n### FAQ134｜吃了酵素沒用還是便秘\n**Q：** 客反映吃了酵素沒用還是便秘\n**A：** 您好～這邊幫您說明一下\n食用酵素後仍有便秘情況，通常與水分與纖維攝取有關\n酵素主要是幫助消化與代謝調整，\n若缺乏水分與纖維，排便效果會比較不明顯。\n\n常見原因：\n1. 水分不足，導致糞便偏硬\n2. 腸道蠕動較慢，需要時間調整\n3. 膳食纖維攝取不足，排便量不足\n\n建議您：\n1. 每日水量至少2000cc以上\n2. 維持早上空腹食用酵素\n3. 可搭配孅孅飲補充膳食纖維\n4. 持續觀察3～5天\n\n提供給您參考喔\n\n---\n\n### FAQ135｜康普茶6歲可以喝嗎??謝謝\n**Q：** 請問康普茶6歲可以喝嗎??謝謝\n**A：** 您好～這邊幫您說明一下😊\n\n康普茶為發酵飲品，含有機酸與活性成分，一般不建議幼兒食用。\n\n6歲屬於孩童族群，腸胃與代謝系統尚在發育中，建議以正常飲食為主，不建議自行食用此類產品。\n\n若有特殊需求，建議先諮詢醫師再評估。\n\n---\n\n### FAQ136｜丟丟茶裡面有藤黃果成分，藤黃果產地是哪裡？\n**Q：** 丟丟茶裡面有藤黃果成分，藤黃果產地是哪裡？\n**A：** 印度\n\n---\n\n### FAQ137｜客人有詢問咖啡是否冰水跟熱水都可以沖泡嗎?\n**Q：** 客人有詢問咖啡是否冰水跟熱水都可以沖泡嗎?\n**A：** 您好～這邊幫您說明一下😊\n\nClean Coffee 冰水與熱水都可以沖泡\n\n因為 Clean Coffee 屬於較濃縮型的咖啡配方，\n若使用熱水沖泡，通常攪拌一下就會比較快溶解。\n\n如果是使用冰水或水溫較低時，\n因為溫度關係，會需要稍微多攪拌一下，\n尤其太冰時，部分成分會比較慢化開\n\n小建議：\n✔ 可先用少量溫水攪拌後，再加入冰塊或冷水\n✔ 或常溫水先攪拌均勻，口感會更順\n\n提供給您參考～\n\n---\n\n### FAQ138｜大麥薄荷 裡面有甚麼成分 是會導致丟茶放到下午會變酸嗎 客人表示 泡的每…\n**Q：** 請問大麥薄荷 裡面有甚麼成分\n是會導致丟茶放到下午會變酸嗎\n客人表示 泡的每包都是會變酸\n**A：** 您好～這邊為您說明一下\n\n大麥薄荷茶本身含有茶類、植物萃取與酸性調味成分，\n若沖泡後放置較久（尤其到下午），\n風味確實有可能會慢慢偏酸，這屬於較常見的情況。\n\n主要原因可能來自：\n\n✔ 檸檬酸、蘋果酸等酸性成分\n✔ 植物萃取與茶類久放後的風味變化\n✔ 水溫、環境溫度與放置時間影響\n\n另外如果是：\n長時間常溫放置\n天氣較熱\n使用悶泡瓶或水壺\n\n也較容易讓酸味感受更明顯。\n\n建議方式：\n->泡好後盡量於數小時內飲用完畢\n->若需放比較久，可冷藏保存\n->避免長時間高溫悶放\n\n以上提供您參考喔\n\n---\n\n### FAQ139｜新舊版的丟丟茶有沒有差別\n**Q：** 新舊版的丟丟茶有沒有差別\n**A：** 新版主要是把整體配方往「藤黃果體態管理系列」做升級\n三款都以\n藤黃果\n專利毛喉鞘蕊花\n四棱白粉藤\n柑橘萃取物\n仙人掌萃取物\n玉米鬚萃取物作為主要機能搭配\n再搭配新口味最為區分\n\n以上提供您參考喔\n\n---\n\n### FAQ140｜咖啡中的白腎豆成分，蠶豆症可以喝嗎？\n**Q：** 咖啡中的白腎豆成分，蠶豆症可以喝嗎？\n**A：** 可以喝，沒有影響\n\n---\n\n### FAQ141｜咖啡完全沒有咖啡味\n**Q：** 客戶反映咖啡完全沒有咖啡味\n**A：** 關於 Clean Coffee 咖啡味道的情況，這邊幫您說明一下：\n\n可能原因\n(1)Clean Coffee 屬於濃縮萃取配方，咖啡香氣較內斂，不像一般沖泡咖啡那樣濃烈\n(2)沖泡水量若超過建議量，香氣會更淡\n(3)使用冰水或溫度較低的水沖泡，咖啡氣味釋放會較弱\n\n->建議調整方式\n(1)水量控制在150-180cc以內，不要加太多水\n(2)用熱水或溫水沖泡，咖啡香氣會更明顯\n(3)可先用少量熱水溶解後再加冰塊，香氣與口感會更好\n\n補充說明：\nClean Coffee 的設計重點在於體態功能成分，咖啡風味為輔，若習慣濃郁咖啡香的朋友，口感上可能會有落差\n\n---\n\n### FAQ142｜客人想詢問大激賞納豆Q10膠囊30顆如何食用呢? 能搭配孅孅凍酵素果凍和…\n**Q：** 客人想詢問大激賞納豆Q10膠囊30顆如何食用呢?\n能搭配孅孅凍酵素果凍和Diu+ 咕魯咕魯超纖酵素一起吃嗎\n**A：** 大激賞納豆Q10膠囊建議食用方式：\n\n✔ 每日2粒\n✔ 可早晚各1粒\n✔ 空腹或睡前搭配溫水食用較佳\n\n至於搭配孅孅凍、Diu+ 咕嚕咕嚕超纖酵素一起食用是可以的喔\n\n建議搭配方式：\n\n早上空腹：酵素\n午餐或晚餐時（當餐食用）：孅孅凍\n晚上或睡前：納豆Q10\n\n這樣時間稍微錯開，使用上會比較穩定。\n\n另外提醒一下：\n若有服用抗凝血藥物、懷孕／哺乳期間，或特殊疾病狀況，建議先諮詢醫師再食用喔～\n\n提供給您參考\n\n---\n\n### FAQ143｜葡萄糖胺步步順膠囊-30顆*1瓶 福哥客人 問每次ㄧ粒是要「何時」吃？\n**Q：** 葡萄糖胺步步順膠囊-30顆*1瓶\n福哥客人 問每次ㄧ粒是要「何時」吃？\n**A：** 您好～這邊幫您說明一下\n\n葡萄糖胺步步順膠囊目前建議食用方式為每次1粒。\n\n一般來說，葡萄糖胺類產品會建議於餐後食用，較溫和也較不易造成腸胃不適。\n\n若腸胃較敏感，也可固定每天同一時間餐後補充，較方便建立規律習慣。\n\n提供給您參考喔\n\n---\n\n### FAQ144｜橙長鈣有西藥味 請問是否正常?\n**Q：** 客反映橙長鈣有西藥味\n請問是否正常?\n**A：** 您好～這邊幫您確認一下\n\n橙長鈣因含有海藻鈣、海洋深層水濃縮粉、維生素D3、CPP酪蛋白磷酸胜肽等成分，本身會帶有一些礦物質或營養原料的天然氣味，因此不同批次在風味感受上，可能會有些微差異。\n\n有些人會感覺較像礦物味、奶味或較特殊的營養味道，感受也會因個人口味敏感度不同而不同。\n\n以上提供您參考喔\n\n---\n\n### FAQ145｜明守對策，效果是什麼跟吃法，謝謝\n**Q：** 明守對策，效果是什麼跟吃法，謝謝\n**A：** Diu+ 明守對策屬於日夜雙效晶亮保養配方。\n\n☀️ 白天（日劑）：\n含葉黃素、DHA藻油、南薑萃取、鋅與B群等成分，幫助日常晶亮防護與長時間使用3C族群補充。\n\n🌙 晚上（夜劑）：\n含山桑子、透明質酸鈉、葉黃素等成分，做夜間修護與舒適補充。\n\n建議吃法：\n\n✔ 日劑每日1顆\n✔ 夜劑每日1顆\n✔ 餐後搭配開水食用\n\n持續補充效果會較明顯喔😊\n\n---\n\n### FAQ146｜酵素可以泡飲料喝嗎？\n**Q：** 請問酵素可以泡飲料喝嗎？\n**A：** 酵素是可以搭配飲料一起飲用的喔～\n不過會建議：\n✔ 搭配常溫水或冷水較佳\n✔ 避免高溫熱飲（避免影響酵素活性）\n✔ 避免搭配酒精飲品\n若想搭配其他飲品， 也建議選擇：\n👉 無糖或低糖飲品\n👉 成分單純的飲料\n這樣比較不容易影響原本的飲用效果\n\n---\n\n### FAQ147｜膠原蛋白粉是早上空腹和咖啡一起泡、膠原蛋白一次是一包量嗎？\n**Q：** 請問一下膠原蛋白粉是早上空腹和咖啡一起泡、膠原蛋白一次是一包量嗎？\n**A：** 您好～這邊幫您說明一下😊\n膠原蛋白一次建議就是1包的量喔～\n食用時間部分：\n✔ 早上空腹可以\n✔ 搭配咖啡一起飲用也可以\n不過因為咖啡因可能會影響部分營養吸收， 若想讓膠原蛋白補充更完整，\n👉 會更建議：\n與咖啡間隔30分鐘左右 或\n搭配常溫水飲用\n有些人也會選擇： ✔ 晚上睡前 ✔ 飯後\n持續補充會比較有感😊\n提供給您參考喔～\n\n---\n\n### FAQ148｜～我有買丟妹的咖啡😊 那丟妹的咖啡可以加他牌的膠原蛋白喇喇ㄟ一起喝嗎？ …\n**Q：** 請問一下～我有買丟妹的咖啡😊 那丟妹的咖啡可以加他牌的膠原蛋白喇喇ㄟ一起喝嗎？ 謝謝\n**A：** 您提到的丟妹的咖啡（Clean Coffee）跟他牌膠原蛋白，從成分上來看，一起喝是沒有安全上的衝突喔！👍\n\n不過呢～為了讓您能完整品嚐Clean Coffee的香醇風味，並讓兩種產品都能發揮最好的效果，我們會更建議分開飲用喔！✨\n\n🧩 建議搭配方式\n✔ Clean Coffee：建議在早餐前或運動前單獨飲用，享受它最純粹的香醇喔！☕\n✔ 膠原蛋白：如果您正在尋找高品質的膠原蛋白，我們家的Diu+ 膠妍粉也是不錯的選擇喔！膠妍粉為水蜜桃莓果風味，沖泡後帶有淡淡的顏色與酸甜果香，直接以常溫水沖泡飲用即可💖\n\n⚠️ 注意事項\n✔ 如果您還是想搭配他牌膠原蛋白，還是請您留意他牌膠原蛋白的成分，確認沒有過敏原喔！✅\n✔ 產品之間建議間隔 30 分鐘以上，讓身體有時間吸收喔！\n\n💡 補充說明\n👉 搭配足夠水分補充，會更有助於代謝喔！💧\n👉 若有疾病、服藥、懷孕或哺乳，請先諮詢醫師喔！\n\n---\n\n### FAQ149｜買康普茶說水腫 有解釋可說明？\n**Q：** 買康普茶說水腫  有解釋可說明？\n**A：** 這邊了解您在飲用康普茶後，有感受到水腫和肚子變大的情況，也提到之前喝丟茶時有類似的狀況，讓您感到不適，真的很抱歉讓您有這樣的體驗😔。\n\n康普茶含有豐富的益生菌和益菌生，這些成分在幫助調整腸道菌相時，部分人可能會在初期出現一些適應期反應，例如輕微的脹氣、排氣增加，甚至感覺肚子有些變大。這通常是腸道正在努力適應新菌群的過程喔！\n\n至於您提到的「水腫」感受，有時候也可能與腸道脹氣的感覺混淆，或是體質對某些成分較為敏感的反應。\n\n⚠️ 重要提醒\n✔ 建議您先暫停飲用康普茶，觀察身體狀況。\n✔ 若不適感持續或加劇，特別是水腫或肚子變大的情況沒有改善，請務必尋求專業醫師的評估與建議，確認是否有其他潛在原因。\n✔ 如果之後想再次嘗試，可以從少量（例如建議用量的一半或更少）開始，並搭配足夠的水分，讓身體慢慢適應，看看反應如何。\n\n關於您提出退貨的需求，我們會請廠商後續與您聯繫，協助處理相關事宜。\n\n💡 補充說明\n👉 每個人體質、飲食與作息不同，對產品的感受和適應期也會有差異喔。\n👉 若有疾病史或正在服藥中，在食用任何保健食品前，都建議先諮詢醫藥專業人士的意見，會更安心。\n\n---\n\n### FAQ150｜有再吃血糖的藥 可以吃 Diu+大餐防守對策嗎? （閃金銀升級版）\n**Q：** 請問有再吃血糖的藥 \n可以吃 Diu+大餐防守對策嗎?\n（閃金銀升級版）\n**A：** 您好～這邊先跟您說明一下😊\n大餐防守對策（閃金銀升級版）主要是幫助油脂代謝與澱粉控制，一般健康族群是可以使用的，但：\n👉 若您目前正在服用血糖相關藥物\n👉 或有糖尿病等慢性病史\n會建議您先諮詢主治醫師，確認目前用藥狀況是否適合搭配食用，再做決定會比較安心\n\n---\n\n### FAQ151｜電解水可以和蜂蜜一起喝嗎\n**Q：** 電解水可以和蜂蜜一起喝嗎\n**A：** 您好～這邊幫您說明一下\n\n樹飛雪勁量快充電解水是可以搭配蜂蜜一起喝的，成分上沒有衝突喔！\n👉 不過有幾點小建議：\n✔ 蜂蜜本身含有天然糖分，加入後整體甜度與糖分會增加，體重控制中的朋友可以酌量\n✔ 建議用常溫水或溫水沖泡，避免高溫破壞蜂蜜的天然酵素\n✔ 每日補充電解水不超過4份，加蜂蜜也是一樣的建議用量\n💡 補充說明\n👉 電解水本身已含有葡萄糖與電解質，加蜂蜜後糖分較高，建議運動後補充較適合，日常飲用可考慮不加或少加😊\n\n---\n\n### FAQ152｜蠶豆症喝酵素有問題嗎\n**Q：** 蠶豆症喝酵素有問題嗎\n**A：** 您好～感謝您告知😊\n了解您有蠶豆症的狀況，這邊需要特別提醒您：\n⚠️ 建議先暫停食用酵素\n蠶豆症（G6PD缺乏症）對部分氧化性成分較敏感\n酵素產品以天然發酵成分為主，原則上並沒有引發的成分，\n有些人體質較敏感，短時間攝取較多時，可能會有暫時性的膚況波動。\n\n建議您：\n\n✔ 先減量使用\n✔ 多補充水分\n✔ 觀察近期作息與飲食狀況\n\n💡 關於用量\n👉 酵素建議每日1～2包，您目前一天4包已超過建議用量，這也可能是造成皮膚反應的原因之一\n🙏 若症狀緩解後仍想繼續補充，建議先諮詢醫師確認適合的用量後再食用\n\n---\n\n### FAQ153｜康普茶.孅孅飲.鳳梨酵素.clean coffee.鳳梨酵素茶.孅孅凍怎…\n**Q：** 康普茶.孅孅飲.鳳梨酵素.clean coffee.鳳梨酵素茶.孅孅凍怎麼吃\n**A：** 您好～這邊幫您整理一下這幾款的搭配方式😊\n您手邊這組搭配屬於： 👉「順暢＋代謝＋體態管理」的完整組合。\n🧩 建議搭配方式：\n☀️ 起床空腹 ✔ 咕嚕咕嚕超纖酵素 1包\n幫助順暢與日常代謝調整。\n—\n🍳 早餐後 ✔ Clean Coffee 1包\n可作為日常咖啡替代，白天飲用較適合。\n—\n🕛 午餐前30分鐘 ✔ 玫瑰孅孅飲 1包\n補充膳食纖維與增加飽足感。\n—\n🍵 下午茶時間 ✔ 康普茶（熱帶水果）1包\n可取代含糖飲料，搭配日常代謝調整。\n—\n🍽 晚餐時 ✔ 孅孅凍 1包（當餐食用）\n搭配當餐，最適合吃比較多或外食的那一餐。\n—\n🍵 晚餐後 ✔ 鳳梨酵素茶 1包\n幫助餐後消化與順暢調整。\n—\n💡 小提醒：\n✔ 產品之間建議間隔30分鐘以上\n✔ 一天水量建議2000cc以上\n✔ 初次食用建議從建議量開始，依個人體質調整\n⚠️ 若有疾病、服藥中、孕婦或特殊體質，建議先諮詢醫師後再食用。\n提供給您參考😊\n\n---\n\n### FAQ154｜丟丟茶-水蜜桃 請問媽媽喝了胃不舒服 有解決方法嗎？\n**Q：** 丟丟茶-水蜜桃\n請問媽媽喝了胃不舒服\n有解決方法嗎？\n**A：** 您好～這邊幫您說明一下😊\n\n藤黃果水蜜桃茶因含有藤黃果、康普茶粉與部分植物萃取成分，\n若本身腸胃較敏感、空腹飲用，或胃較容易受刺激的人，\n有可能會出現胃不舒服、胃酸感或脹感。\n\n建議可以先這樣調整看看：\n\n✔ 改成飯後飲用\n✔ 不要空腹喝\n✔ 水量可增加一些（泡淡一點）\n✔ 先減量，例如半包開始觀察\n✔ 避免太晚或一次喝太快\n\n若媽媽本身有：\n🔹 胃食道逆流\n🔹 胃潰瘍\n🔹 胃炎\n🔹 胃酸較多\n\n也會比較容易對酸類或發酵類飲品敏感。\n\n若調整後仍持續不舒服，\n建議先停止食用並諮詢醫師確認會比較安全喔😊\n\n提供給您參考～\n\n---\n\n### FAQ155｜之前購買的產品 完全沒效果 閃閃金+閃閃銀（午晚餐前各1）、酵素（第一週…\n**Q：** 客表示之前購買的產品 完全沒效果\n閃閃金+閃閃銀（午晚餐前各1）、酵素（第一週 早、晚各一包）？第二週（玫瑰孅孅像飲+酵素、三餐飯前10分鐘喝）、丟丟茶每日一包沖包2000cc當水喝\n飲控：精緻澱粉完全不碰，每日晨泳40分鐘1500公尺\n**A：** 您好～感謝您這麼詳細分享使用狀況😊\n\n看得出來您真的非常認真執行，\n不論是飲食控制還是每天晨泳1500公尺，都很不容易！\n\n這邊也幫您看了一下目前的搭配方式，\n有幾個方向或許可以再微調看看👇\n\n👉 閃閃金＋閃閃銀\n目前是午、晚餐前各1顆，\n會比較建議調整成三餐前食用（早餐前也補上），\n因為早餐的澱粉與油脂攝取，其實也會影響整體代謝節奏😊\n\n—\n\n👉 孅孅飲＋酵素\n目前兩款同時搭配，\n有些人腸胃較敏感時，反而會影響整體適應狀況。\n\n建議可以改成：\n\n✔ 酵素：早上空腹\n✔ 孅孅飲：午餐前或晚餐前\n\n分開時段通常身體感受會比較穩定。\n\n—\n\n👉 丟丟茶\n泡2000cc當水喝的方式其實很好，\n這部分可以繼續維持😊\n\n—\n\n💡 關於效果部分\n\n每個人的體質、代謝速度與身體狀況不同，\n有些運動量較大、代謝調整期較長的人，\n可能需要4～6週以上才會慢慢有感。\n\n建議可以先依照上述方式微調後，\n再持續觀察2～3週看看😊\n\n也謝謝您願意分享真實使用感受給我們參考\n\n161追加回覆\n客回覆:我已經三餐都是無澱粉，低油低糖的飲食，你們所推出產品就是沒有效果，我已經使用你們產品只少也有6週以上完全看不出效果\n答:您好～也謝謝您願意這麼詳細分享實際使用狀況🙏\n看得出來您真的非常認真執行， 不論是飲食控制、運動習慣，甚至產品搭配都已經投入很多努力了。\n如果持續使用這麼長時間， 但效果仍沒有達到您的期待， 我們可以理解那種落差感與失望感。\n這邊也幫您看了一下目前的生活與使用方式， 其實您的控制已經算相當嚴格， 有些人在長期高運動量、加上飲食控制非常嚴格的情況下，身體對外在補充的反應時間與感受，確實會因個人體質而有所不同， 讓體感或數字上的變化沒有那麼明顯。\n另外保健食品本身屬於輔助調整， 每個人的吸收、代謝與身體反應差異也都會不同， 因此感受上確實不一定完全一致。\n您的回饋我們也會如實記錄， 提供給內部作為後續產品與使用建議調整參考。\n也謝謝您願意這麼認真分享真實感受🙏\n\n若您有任何其他想法或需求，也歡迎告訴我們，以便協助您處理\n\n---\n\n### FAQ156｜A8 抗老豐盈乳霜和德兒瑪夏 彈力賦活抗痕緊緻霜使用方式\n**Q：** A8 抗老豐盈乳霜和德兒瑪夏 彈力賦活抗痕緊緻霜使用方式\n**A：** A8 抗老豐盈乳霜（含A醇0.3%）\n👉 建議用在保養程序的最後一步（乳霜/面霜階段）\n✔ 化妝水 → 精華液 → A8乳霜\n✔ 含A醇成分，建議晚上使用為主\n✔ 敏感肌建議1～2週使用一次，當厚敷面膜使用\n德兒瑪夏 彈力賦活抗痕緊緻霜（含玻尿酸1%、Tropoelastin）\n👉 建議用在精華液後、乳霜前\n✔ 化妝水 → 緊緻霜 → 乳霜/防曬\n✔ 早晚均可使用\n💡 兩款一起使用的順序\n化妝水 → 德兒瑪夏緊緻霜 → A8抗老乳霜（晚上）\n⚠️ A8含A醇，白天使用後需做好防曬\n\n---\n\n### FAQ157｜我早上空腹喝酵素加膠原一起喝可以嗎？\n**Q：** 請問我早上空腹喝酵素加膠原一起喝可以嗎？\n**A：** 您好～這邊幫您說明一下😊\n酵素和膠原蛋白（膠妍粉）一起喝是可以的，成分上沒有衝突喔！\n不過關於空腹這部分，這邊幫您說明：\n👉 超纖酵素\n✔ 早上空腹食用是可以的，幫助腸道啟動效果較好\n👉 膠妍粉（膠原蛋白）\n✔ 空腹也可以喝，不過膠原蛋白餐後或睡前吸收效果會更穩定\n✔ 搭配維生素C（膠妍粉本身已含）有助於膠原合成\n💡 建議的小調整\n👉 若想讓兩款效果都發揮得更好，可以考慮：\n✔ 酵素：早上空腹\n✔ 膠妍粉：晚上睡前或餐後\n分開時段通常身體感受會更穩定😊\n\n---\n\n### FAQ158｜纖纖凍是素食嗎?\n**Q：** 請問纖纖凍是素食嗎?\n**A：** 您好～這邊幫您說明一下😊\n孅孅凍不是素食喔！\n成分中含有：\n👉 專利二胜肽魚膠原蛋白粉（魚類製品）\n所以素食者不建議食用。\n\n---\n\n### FAQ159｜膠妍粉在售前及銷售的時候， 最推薦的時間段是餐前空腹 那這邊的文案 是有…\n**Q：** 膠妍粉在售前及銷售的時候，\n最推薦的時間段是餐前空腹\n\n那這邊的文案\n是有提到說餐後或睡前會更好\n\n想確認主要是因為膠妍粉中的成分\n是比較推薦餐後或睡前嗎？\n**A：** 您好～\n\n關於膠妍粉的食用時間，這邊幫您說明一下：\n\n👉 膠妍粉中的成分其實在任何時間補充都是可以的喔，因為膠原蛋白的補充是持續性的，每天有補充到最重要！\n\n👉 不過，如果想要達到最佳的感受，我們會更推薦在睡前空腹食用喔。\n✔ 我們的身體在夜間睡眠時是修復的黃金時段，這時候補充膠原蛋白，身體的利用率會更好，效果也會更有感喔！\n✔ 如果是餐前空腹吃，當然也是沒問題的！只是有些人腸胃比較敏感，睡前空腹吃感受上會更溫和穩定。\n✔ 餐後吃也是可以的，如果想達到空腹吸收的效果，會建議餐後至少間隔 2 小時再補充會更理想喔。\n\n所以，為了統一對外說明，最推薦的食用時間會是睡前空腹😊 但如果客人不方便，任何時間吃也都是沒問題的，只要記得每天持續補充最重要喔！\n\n⚠️ 注意事項\n✔ 請勿搭配高溫飲品，以免影響成分活性。\n✔ 每天持續補充，比偶爾一次吃很多更有效喔！\n\n💡 補充說明\n👉 膠原蛋白的補充貴在持之以恆，每天定時定量補充，效果才會慢慢看得見😊 我們的膠妍粉是水蜜桃莓果風味，直接吃或加在冷飲中都很棒喔！\n\n---\n\n### FAQ160｜客戶買酵素.康普茶.丟丟茶.clean coffee.孅孅凍.玫瑰孅孅飲…\n**Q：** 客戶買酵素.康普茶.丟丟茶.clean coffee.孅孅凍.玫瑰孅孅飲\n早上空腹吃酵素.2顆水煮蛋.丟茶1000CC.咖啡.孅孅凍.康普茶.晚上睡前玫瑰孅孅飲\n一天2餐，早餐水煮蛋，中餐正餐吃比較多，晚上5~6點後不進食，晚餐不吃但沒瘦，睡前喝200CC紅酒才入睡，吃半年都沒瘦\n**A：** 您好～\n\n以下提供幾個方向可以調整看看：\n\n👉 關於沖泡方式\n✔ 康普茶及丟丟茶可依個人口味調整水量\n✔ 若希望風味與配方比例較完整呈現，建議可依產品建議水量沖泡後飲用\n\n👉 關於玫瑰孅孅飲\n✔ 建議可安排於午餐前或晚餐前飲用\n✔ 讓膳食纖維有較充裕的時間搭配飲食與水分補充\n\n👉 關於飲食內容\n✔ 從您的分享來看，早餐較簡單、晚餐長期不吃\n✔ 長時間控制飲食除了熱量之外，也建議留意蛋白質及整體營養是否足夠\n✔ 有些人在持續控制飲食一段時間後，身體可能逐漸適應目前的飲食模式，使體重變化趨緩或進入停滯期\n✔ 建議可適度補充優質蛋白質（如豆類、魚類、雞蛋、雞胸肉等），並維持均衡飲食\n\n💡 補充說明\n\n產品主要是協助日常飲食管理與生活習慣調整，建議搭配均衡飲食、規律活動及充足睡眠一起進行觀察。\n\n除了體重之外，也可以一起留意腰圍、體態變化、排便狀況及整體精神狀況😊\n\n以上提供給您參考～\n\n---\n\n### FAQ161｜康普茶\n**問題分類：不良反應/副作用**\n**風險等級：低**\n**Q：** 喝了一陣子的康普茶都沒有變瘦？\n**A：** 您好～想先跟您確認一下😊 康普茶本身屬於日常保養型飲品，每個人的感受會有些差異。方便請問您：✔ 已經飲用了多久呢？✔ 每天喝幾包呢？✔ 是單獨飲用，還是有搭配酵素、孅孅飲等產品呢？✔ 平時飲食及水分攝取狀況如何呢？一般會建議：✅ 每天持續補充 ✅ 搭配足夠水分（約2000cc以上）✅ 避免高糖飲料及宵夜 ✅ 搭配均衡飲食與適度運動。提供給您參考😊\n\n---\n\n### FAQ162｜超纖酵素、玫瑰孅孅飲、膠妍粉\n**問題分類：產品搭配**\n**風險等級：低**\n**Q：** 丟妹酵素和纖纖飲可以加膠原蛋白粉及他牌益生菌嗎？\n**A：** 您好～可以喔😊 丟妹酵素、玫瑰孅孅飲、膠原蛋白粉與益生菌原則上是可以一起搭配補充的。不過為了讓各產品有較好的食用體驗，會比較建議分開時段：✔ 早上空腹：酵素＋益生菌 ✔ 白天或餐前：玫瑰孅孅飲 ✔ 晚上或睡前：膠原蛋白粉。這樣比較不容易造成腸胃負擔，也方便觀察身體的適應狀況😊 另外益生菌與酵素、孅孅飲及膠原蛋白粉之間沒有明顯衝突，可以搭配食用。建議食用期間也要記得補充足夠水分（每日約2000cc以上），效果會更理想喔～提供給您參考😊\n\n---\n\n### FAQ163｜孅孅凍、超纖酵素、玫瑰孅孅飲\n**問題分類：產品搭配**\n**風險等級：低**\n**Q：** 中午食用孅孅凍還適合飲用酵素+玫瑰孅孅飲嗎？\n**A：** 您好～可以喔😊 如果中午有食用孅孅凍，酵素和玫瑰孅孅飲仍然可以搭配補充。比較建議的方式是：✔ 早上空腹：咕嚕咕嚕超纖酵素 1包 ✔ 午餐時（當餐食用）：孅孅凍 1包 ✔ 晚餐前或晚上：玫瑰孅孅飲 1包。這樣分開時段食用，身體較容易適應，也能避免一次攝取太多膳食纖維造成腸胃負擔😊 另外記得多補充水分，建議每天至少2000cc以上，效果會更好喔～提供給您參考😊\n\n---\n\n### FAQ164｜超纖酵素、孅孅凍（甲狀腺藥物）\n**問題分類：疾病/用藥**\n**風險等級：高｜需轉人工確認**\n**Q：** 原本睡前吃酵素，現在睡前有孅孅凍要吃，早上空腹要吃甲狀腺的藥物，酵素要在什麼時候吃比較好？\n**A：** 您好～這邊幫您說明一下😊 因為您早上空腹需要服用甲狀腺藥物，建議還是以藥物服用為優先喔！酵素則可以改成：✔ 早餐後30分鐘～1小時，或 ✔ 午餐前30分鐘左右，與甲狀腺藥物錯開會比較理想😊 另外孅孅凍建議改為搭配正餐、當餐食用（例如午餐或晚餐時），不需要刻意跟酵素同時吃。若醫師有特別交代甲狀腺藥物與其他食品或保健品需間隔多久，建議依照醫師指示為主喔～提供給您參考😊\n\n---\n\n### FAQ165｜超纖酵素、玫瑰孅孅飲、康普茶、丟丟茶\n**問題分類：食用/使用方式**\n**風險等級：低**\n**Q：** 每天泡丟丟茶，中午康普茶跟丟丟茶一起喝，中午用康普茶泡酵素和玫瑰孅孅飲一起喝，喝了一陣子瘦了2公斤就定格，吃多一點體重又胖回來，要如何改善？\n**A：** 您好～感謝您這麼詳細分享😊 這邊幫您看了一下目前的搭配方式，有幾個地方或許可以微調看看👇 👉 關於酵素和孅孅飲的沖泡方式：✔ 酵素和孅孅飲建議用常溫水分開沖泡飲用 ✔ 這樣各產品的效果會更穩定😊 👉 建議調整搭配時段：✔ 早上空腹：酵素 1包 ✔ 午餐前：玫瑰孅孅飲 1包 ✔ 下午茶：康普茶 1包 ✔ 晚餐前：丟丟茶 1包。分開時段通常身體感受會更穩定😊 💡 關於停滯期：👉 身體適應同樣搭配一段時間後，有時會進入停滯期，這是很常見的現象 👉 調整搭配方式後，再持續觀察2～3週，通常會有新的變化😊 👉 我們的產品主要是幫助腸道調整與日常代謝，搭配均衡飲食和適度運動，整體效果會更明顯😊 👉 全天水分維持2000cc以上，纖維類產品一定要多喝水。提供給您參考～\n\n---\n\n### FAQ166｜超纖酵素、玫瑰孅孅飲、苦瓜胜肽菌絲膠囊\n**問題分類：食用/使用方式**\n**風險等級：低**\n**Q：** 早上空腹吃酵素1包、中餐前孅孅飲1包飯後苦瓜胜肽1顆、晚餐前孅孅飲1包飯後苦瓜胜肽1顆、最後再酵素1包，沒瘦還更胖，怎麼改善？\n**A：** 您好～感謝您這麼詳細分享😊 這邊幫您看了一下目前的搭配方式，有幾個地方或許可以微調看看👇 👉 關於酵素的食用時機：✔ 酵素早上空腹1包很好，但晚上睡前的1包可以拿掉 ✔ 建議一天1包就好，早上空腹食用幫助腸道啟動即可。👉 關於孅孅飲：✔ 中餐前＋晚餐前各1包，膳食纖維量偏高 ✔ 建議先從一天1包開始，讓身體慢慢適應後再評估 ✔ 孅孅飲搭配苦瓜胜肽是OK的，這部分不需要調整。👉 關於體重變化：✔ 膳食纖維攝取量突然增加，腸胃適應期間有時會有脹氣或水分滯留的狀況，這可能是短期體重波動的原因之一 ✔ 建議先減量、多喝水，讓身體慢慢適應。💡 補充說明：👉 我們的產品主要是幫助腸道調整與日常代謝，搭配均衡飲食和適度運動，整體效果會更明顯😊 👉 全天水分至少2000cc以上，纖維類產品一定要多喝水 👉 調整後持續觀察2～3週，通常會慢慢有感。提供給您參考～\n\n---\n\n### FAQ167｜超纖酵素\n**問題分類：不良反應/副作用**\n**風險等級：低**\n**Q：** 收到商品就開始使用，基本一包，水一天3000cc以上，沒吃宵夜，喝無糖飲料，單獨喝酵素，但沒有感覺到效果？\n**A：** 感謝您補充說明😊 看起來您在水分補充與日常飲食方面其實都維持得不錯，酵素也有持續補充。酵素主要是幫助日常調整與維持順暢，不同的人感受也會有所差異。若已經持續補充一段時間，目前沒有感受到明顯變化，建議可以搭配其他產品一起使用，例如孅孅飲、孅孅凍或康普茶等，透過不同方向的搭配來進行日常管理。另外除了體重之外，也可以一起觀察：✔ 排便是否較順暢 ✔ 飽足感是否有提升 ✔ 腰圍或衣褲鬆緊度是否有變化。有些時候身體的調整會先反映在生活感受與體態變化上，而不一定立即呈現在體重數字上😊 提供給您參考喔～\n\n---\n\n### FAQ168｜蜂王乳全能卸妝淨顏霜、皇家胺基酸保濕洗顏蜜、維他命C美白奈米粉\n**問題分類：食用/使用方式**\n**風險等級：低**\n**Q：** 蜂王乳全能卸妝淨顏霜、皇家胺基酸保濕洗顏蜜、維他命C美白奈米粉要怎麼使用？還有自己的膠原蛋白面膜。\n**A：** 您好～這邊幫您說明一下使用順序😊 👉 Step 1：卸妝 ✔ 蜂王乳全能卸妝淨顏霜：乾臉取適量，均勻塗抹全臉，畫圈按摩至乳化後，以清水洗淨。👉 Step 2：潔顏 ✔ 皇家胺基酸保濕洗顏蜜：取適量於手掌加少量水，按摩方式洗臉後以清水洗淨。👉 Step 3：面膜 ✔ 膠原蛋白面膜（您自備的）：敷臉15～20分鐘後取下，不需沖洗。👉 Step 4：保養精華 ✔ 維他命C美白奈米粉：可加入化妝水、精華液或乳霜中混合使用，均勻塗抹全臉至吸收即可。⚠️ 小提醒：✔ 奈米C粉建議晚上使用為主，白天使用需做好防曬 ✔ 若有發紅或過敏反應，請停止使用並諮詢皮膚科醫師。提供給您參考😊\n\n---\n\n### FAQ169｜璀璨藍銅彈潤精華液\n**問題分類：產品外觀/品質**\n**風險等級：低**\n**Q：** 璀璨藍銅彈潤精華液上面有白色浮層，是正常的嗎？\n**A：** 您好～感謝您提供照片😊 從照片看起來，白色部分較像是成分經過靜置後產生的自然聚集現象。璀璨藍銅彈潤精華液因含有多種保養成分，在長時間靜置或溫度變化下，偶爾可能出現些微分層或成分聚集的情況。建議您可以先輕輕搖晃均勻後再使用看看😊 若沒有異味、明顯變色或其他異常情況，這類成分聚集現象一般不影響正常使用喔～提供給您參考😊\n\n---\n\n### FAQ170｜璀璨藍銅彈潤精華液、美國專利黃金膠原蛋白凝膠\n**問題分類：產品搭配**\n**風險等級：低**\n**Q：** 璀璨藍銅彈潤精華液可以搭配美國專利黃金膠原蛋白凝膠一起用嗎？怎麼用？\n**A：** 您好～可以搭配使用喔😊 璀璨藍銅彈潤精華液與美國專利黃金膠原蛋白凝膠的產品屬性不同，可以一起作為日常保養使用。👉 建議使用順序：✔ 洗臉後 1️⃣ 化妝水 2️⃣ 璀璨藍銅彈潤精華液 3️⃣ 美國專利黃金膠原蛋白凝膠 4️⃣ 乳霜（如有使用）。由於藍銅精華液質地較輕盈，建議先使用；黃金膠原蛋白凝膠則可於後續加強保濕與彈潤保養。💡 建議順序邏輯：👉 一般由質地較輕薄的先用、較濃稠的後用，較能幫助產品均勻吸收😊 早晚皆可使用，並可依個人膚況調整用量喔😊 提供給您參考～\n\n---\n\n### FAQ171｜飽包（可可/奶茶/香蕉）\n**問題分類：食用/使用方式**\n**風險等級：低**\n**Q：** 飽包13歲可以吃嗎？\n**A：** 可以喔！飽包建議12歲以上食用，13歲沒問題😊 不過有幾點小提醒：✔ 以正常均衡飲食為主，飽包作為輔助補充 ✔ 不要用來取代正餐 ✔ 飽包含有大豆、牛奶、堅果、麩質，若有過敏體質請先確認成分。提供給您參考😊\n\n---\n\n### FAQ172｜飽包（可可/奶茶/香蕉）\n**問題分類：疾病/用藥**\n**風險等級：低**\n**Q：** 請問飽包為什麼要跟藥物間隔兩小時？\n**A：** 您好～😊 建議飽包與藥物間隔約2小時，主要是因為飽包含有膳食纖維、蛋白質、維生素及礦物質等營養成分，部分藥物若同時食用，可能會影響吸收效率。因此一般會建議：✔ 先服用藥物，再間隔約2小時後食用飽包，或 ✔ 先食用飽包，再間隔約2小時後服用藥物。讓藥物與營養補充品都能有較好的吸收空間😊 若您有固定服用慢性病藥物、甲狀腺藥物或其他特殊藥物，也建議依照醫師或藥師指示為主喔～提供給您參考😊\n\n---\n\n### FAQ173｜明守對策\n**問題分類：特殊族群**\n**風險等級：中**\n**Q：** 明守對策11歲小孩能吃嗎？\n**A：** 您好～😊 明守對策目前是以成人日常保養需求設計的產品，包含葉黃素、DHA藻油、亞麻仁油、鋅、硒、維生素E等成分。11歲兒童因仍處於生長發育階段，營養需求與成人不同，因此目前不建議自行補充成人劑量的明守對策。若有視力保養需求，建議可先從均衡飲食、充足睡眠及適當用眼習慣開始調整；若希望補充相關營養素，建議先諮詢兒科醫師或專業醫事人員評估後再食用較為合適喔😊 提供給您參考～\n\n---\n\n### FAQ174｜超纖酵素、孅孅凍\n**問題分類：成分詢問**\n**風險等級：低**\n**Q：** 酵素跟孅孅凍有抑制食慾的功效嗎？\n**A：** 您好～😊 酵素與孅孅凍本身並非以抑制食慾為主要訴求的產品喔。其中孅孅凍含有膳食纖維成分，搭配足夠水分食用後，有些人會覺得較有飽足感，因此在飲食管理上較容易控制食量。酵素則主要作為日常保養與調整使用，不同體質的感受也會有所差異。建議依照產品建議方式食用，並搭配均衡飲食及充足水分補充，較能幫助日常飲食管理😊 提供給您參考～\n\n---\n\n### FAQ175｜孅孅凍、超纖酵素\n**問題分類：食用/使用方式**\n**風險等級：低**\n**Q：** 孅孅凍除了睡前吃，大餐後也可以吃一包嗎？還是吃咕嚕咕嚕超纖酵素？\n**A：** 可以喔😊 孅孅凍本身就是設計在「當餐食用」，所以遇到大餐、聚餐或外食比較豐盛的那一餐，直接在當餐（餐中或餐後）吃一條孅孅凍是最合適的時機。👉 孅孅凍：✔ 搭配當餐食用，適合吃比較多、外食或油膩的那一餐 ✔ 記得搭配足量水分。👉 咕嚕咕嚕超纖酵素：✔ 可依原本習慣於空腹或餐前補充，幫助日常消化與順暢。兩款一起搭配也沒問題，間隔30分鐘以上即可😊 提供給您參考～\n\n---\n\n### FAQ176｜膠妍粉、Clean Coffee\n**問題分類：產品搭配**\n**風險等級：低**\n**Q：** 吃完膠原粉能馬上喝Clean Coffee嗎？\n**A：** 可以喔😊 膠妍粉（膠原蛋白粉）與 Clean Coffee 可以搭配使用。若想讓兩款產品分開補充，也可以間隔15～30分鐘左右再飲用，會比較理想😊 提供給您參考～\n\n---\n\n### FAQ177｜橙長鈣（樹飛雪）\n**問題分類：特殊族群**\n**風險等級：低**\n**Q：** 橙長鈣最小幾歲可以吃？\n**A：** 橙長鈣屬於營養補充品，一般建議1歲以上兒童即可補充。由於1歲前的寶寶仍以母乳、配方奶及副食品為主要營養來源，因此未滿1歲的寶寶，建議先諮詢兒科醫師後再補充較為合適。若已滿1歲，則可依照建議量補充喔😊 提供給您參考～\n\n---\n\n### FAQ178｜大激賞 元氣紅潤膠囊\n**問題分類：成分詢問**\n**風險等級：低**\n**Q：** 大激賞元氣紅潤膠囊素食可以吃嗎？\n**A：** 元氣紅潤膠囊的膠囊殼成分含有明膠（動物來源），所以不是全素喔！蛋奶素或一般素食者需要注意這點，建議確認自己的素食類型後再決定是否食用😊\n\n---\n\n### FAQ179｜Clean Coffee\n**問題分類：不良反應/副作用**\n**風險等級：高｜需轉人工確認**\n**Q：** 第一次喝Clean Coffee（加400ml豆漿），昨天感覺有些奇怪，今天喝了之後明顯心跳加速，正常嗎？\n**A：** 您好～😊 若平常沒有喝咖啡、茶或其他含咖啡因飲品的習慣，第一次飲用Clean Coffee後出現心跳加快、精神較亢奮或感覺怪怪的情況，是有可能發生的喔。因為Clean Coffee每包含有咖啡因成分，對於平常較少接觸咖啡因的人來說，身體感受通常會比較明顯。建議您可以先嘗試：✔ 先從半包開始飲用 ✔ 早上或白天飲用為主 ✔ 避免空腹飲用 ✔ 暫時避免同時飲用其他含咖啡因飲品。若減量後狀況改善，通常代表是對咖啡因較敏感所造成的反應😊 不過如果心悸、胸悶、不舒服的情況持續，或症狀較明顯，建議先停止飲用，並諮詢專業醫師評估喔\n\n---\n\n### FAQ180｜Diu+系列、孅孅凍、樹飛雪納豆Q10\n**問題分類：疾病/用藥**\n**風險等級：高｜需轉人工確認**\n**Q：** Diu+系列產品是否有添加會誘發子宮肌瘤或纖維囊腫的成分？孅孅凍有輕瀉成分嗎？樹飛雪納豆可以吃嗎？\n**A：** 您好～😊 關於您擔心的子宮肌瘤、乳房纖維囊腫以及代謝產品補充的問題，這邊幫您說明一下。目前 Diu+ 系列產品（包含孅孅飲、孅孅凍、咕嚕咕嚕超纖酵素、康普茶、丟丟茶、Clean Coffee 等）配方中，並未添加大豆異黃酮、蜂王乳（食用）、胎盤素等較常被討論與女性荷爾蒙相關的成分。因此從產品配方來看，並沒有特別以荷爾蒙調節為設計方向。至於孅孅凍，配方中含有決明子萃取物、蘆薈萃取物、羊角豆萃取物及多種膳食纖維來源，因此部分消費者食用後可能會感受到排便較順暢，這屬於產品特性的一部分。建議依照每日建議量補充即可，並維持均衡飲食及充足水分攝取，讓腸道維持自然的調整節奏😊 另外許多人也會擔心長期補充酵素、纖維或代謝類產品是否會產生依賴性，目前這類產品主要是透過膳食纖維、酵素、益生質等營養成分作為日常補充，並非透過藥物機制作用。至於樹飛雪納豆Q10，產品含有納豆激酶成分，若正在服用抗凝血藥物、準備接受手術，或有特殊疾病治療需求者，建議先諮詢醫師後再食用會較為合適。這部分主要是考量納豆激酶與凝血機制相關，而非與子宮肌瘤或乳房纖維囊腫有直接關聯。當然，每個人的身體狀況不同，若本身已有子宮肌瘤、乳房纖維囊腫或其他婦科疾病，也建議將產品成分提供給主治醫師評估，並依照醫師建議補充會較安心😊 提供給您參考～\n\n---\n\n### FAQ181｜多產品搭配\n**問題分類：食用/使用方式**\n**風險等級：低**\n**Q：** 像酵素、咖啡、飽包這類產品，是每樣都要間隔嗎？還是只有特定某些產品需要？\n**A：** 不一定每一種產品都需要特別間隔喔！😊 大部分產品（例如康普茶、丟丟茶、孅孅凍、膠妍粉等）成分之間沒有明顯衝突，原則上都可以依照建議時段搭配補充。比較建議間隔食用的情況，通常是：✔ 飽包與藥物：飽包含有蛋白質、膳食纖維及多種營養素，建議與藥物間隔約2小時，避免影響藥物吸收。✔ 甲狀腺藥物與保健食品：建議與酵素、孅孅飲、飽包等產品間隔至少2小時以上。✔ Clean Coffee 與膠妍粉：雖然可以一起使用，但若希望兩者都有較好的吸收空間，建議間隔15～30分鐘會更理想😊 一般來說，不需要把每樣產品都刻意錯開，只要依照建議的食用時段補充即可喔～提供給您參考～\n\n---\n\n### FAQ182｜樹飛雪精油（兒童使用）\n**問題分類：特殊族群**\n**風險等級：中**\n**Q：** 請問排水精油和補氣精油小孩可以用嗎？\n**A：** 您好～這邊幫您說明一下😊 樹飛雪精油系列（包含排水精油、補氣精油）依產品注意事項，一般標示為「嬰幼兒不適用」，部分滾珠精油系列則建議「12歲以上兒童或成人」使用。建議您確認手邊產品包裝上的注意事項，確認適用年齡後再使用。若小朋友年齡未滿12歲，或有特殊體質、皮膚敏感的情況，建議先諮詢小兒科醫師或皮膚科醫師評估後再使用，以確保安全😊 提供給您參考～\n\n**需要轉人工**\n- 嬰幼兒使用後出現皮膚紅疹、過敏等不適反應\n\n---\n\n### FAQ183｜多產品搭配（便秘無改善）\n**問題分類：不良反應/副作用、食用/使用方式**\n**風險等級：中**\n**Q：** 原本便秘就很嚴重，買了產品喝了兩個禮拜，還是沒有正常排便，兩週大概只有上三次，該怎麼改變喝法？\n**A：** 您好～謝謝您這麼詳細分享使用狀況😊 因為本身就有較嚴重的便秘困擾，腸道調整通常會需要比較長的時間，除了產品補充外，也建議同步留意以下幾個方向：✔ 每日飲水量：建議一天至少2000～3000cc，水分不足對於較嚴重便秘體質來說影響很大 ✔ 飲食內容：建議留意蔬菜、水果及蛋白質是否足夠，長期纖維或水分不足也可能影響排便 ✔ 生活作息與活動量：規律運動、充足睡眠及固定排便習慣，都會影響腸道蠕動。若方便的話，也想了解您目前一天大約喝多少水、飲食內容以及平常是否有運動習慣，我們再幫您看看是否有更適合調整的方向😊 若長期便秘一直沒有改善，或伴隨腹痛、腹脹等不適，也建議進一步諮詢專業醫師評估會較安心喔～\n\n**需要轉人工**\n- 使用超過2週完全無排便改善\n- 伴隨腹痛、腹脹等明顯不適\n- 客人情緒明顯不滿或要求退貨\n\n---\n\n### FAQ184｜多產品搭配（一天兩餐作息調整）\n**問題分類：食用/使用方式**\n**風險等級：低**\n**Q：** 客人只吃兩餐，建議的搭配方式要怎麼調整？\n**A：** 您好～😊 如果目前一天習慣吃兩餐的話，可以依照起床及用餐時間調整，不一定要完全照早餐、中餐、晚餐的時間安排喔！建議可以這樣搭配：✔ 起床後：咕嚕咕嚕超纖酵素1包，間隔10分鐘後飽包1包，再間隔20～30分鐘後吃第一餐 ✔ 第一餐前：玫瑰孅孅飲1包 ✔ 第二餐前：玫瑰孅孅飲1包、康普茶1包（餐前或餐後皆可）✔ 睡前：孅孅凍1條 ✔ 丟丟茶：全天分次飲用即可，建議搭配足夠水分補充。💡 由於一天只有兩餐，建議每餐都要有足夠蛋白質（豆魚蛋肉類），避免因為進食次數較少，反而讓蛋白質攝取不足，影響身體代謝與調整喔😊 提供給您參考～\n\n---\n\n### FAQ185｜奈米C粉（孕婦／兒童使用）\n**問題分類：特殊族群**\n**風險等級：低**\n**Q：** 請問Diu+ 維他命C美白奈米粉孕婦可以使用嗎？小朋友幾歲可以使用？\n**A：** 您好～😊\nDiu+ 維他命C美白奈米粉為外用保養品，目前產品並無孕婦禁用標示，若孕期膚況穩定，一般可依正常保養方式使用。不過因每個人體質及孕期狀況不同，建議可先於局部肌膚少量測試，確認無不適反應後再使用會較安心😊\n至於小朋友使用方面，因兒童肌膚較成人嬌嫩敏感，建議由家長評估膚況後少量使用，並先於局部肌膚測試，確認無不適反應後再正常使用。\n使用時請避免接觸眼睛及黏膜部位；若為學齡前幼童、敏感性肌膚或有特殊皮膚狀況者，建議先諮詢醫師評估喔😊\n提供給您參考～\n\n---\n\n### FAQ186｜酵素＋纖纖飲（吃了反胖＋便秘／水分不足）\n**問題分類：不良反應/副作用、食用/使用方式**\n**風險等級：中**\n**Q：** 吃超纖酵素和玫瑰纖纖飲快一個禮拜都沒有效果，結果反而胖起來，而且還便秘。\n**A：** 您好～😊\n感謝您提供資訊。\n酵素及纖纖飲中的膳食纖維成分，需要搭配足夠水分一起補充，才能幫助腸道順暢調整。若目前一天飲水量約為2～3瓶小瓶礦泉水，建議可先將每日飲水量提高至2000cc以上，並持續補充及觀察1～2週看看😊\n另外，每個人的體質、飲食習慣及生活作息不同，對產品的感受時間也會有所差異。除了水分補充外，蔬菜、水果及日常活動量也都會影響排便狀況。\n以上提供給您參考～\n\n**需要轉人工**\n- 客人明確要求退貨\n- 使用超過2週仍無改善且情緒不滿\n\n---\n\n### FAQ187｜苦瓜胜肽菌絲膠囊（糖尿病族群食用方式）\n**問題分類：特殊族群、食用/使用方式**\n**風險等級：中**\n**Q：** 請問一下有糖尿病的一天要吃幾顆？要怎麼吃？\n**A：** 您好～😊\n苦瓜胜肽菌絲膠囊建議每日1顆，餐前食用😊\n產品標示為每日一次、每次1顆，多食無益，不建議自行增加食用量。\n若目前有糖尿病、正在服用降血糖藥物或定期追蹤中，建議先與主治醫師確認後再補充會較安心喔🙏\n提供給您參考～\n\n**需要轉人工**\n- 正在使用胰島素或多種降血糖藥物\n- 血糖控制不穩定者\n\n---\n\n### FAQ188｜丟丟茶（兒童使用）\n**問題分類：特殊族群**\n**風險等級：中**\n**Q：** 請問丟丟茶小孩可以喝嗎？7跟11歲\n**A：** 您好～😊\n丟丟茶因含有多種體態管理相關成分，產品注意事項中標示「孕婦、幼兒及生長發育期青少年不宜食用」。\n因此7歲及11歲的小朋友目前都不建議飲用喔😊\n成長中的孩子建議以均衡飲食、規律作息及充足運動為主，會比較適合。\n提供給您參考～\n\n**需要轉人工**\n- 兒童飲用後出現不適反應\n\n---\n\n### FAQ189｜雙艙守宮飲（經期使用）\n**問題分類：特殊族群、食用/使用方式**\n**風險等級：中**\n**Q：** 經期可以喝雙艙守宮飲嗎？\n**A：** 您好～😊\n雙艙守宮飲下艙飲品於經期期間一般可以補充。\n不過上艙暖宮膠囊含有丹參、益母草、當歸、川芎等漢方成分，產品注意事項中也提醒經期中建議先諮詢醫師或專業人士後再食用。\n因個人體質不同，補充後可能影響經血量或經期狀況，因此若經期期間有顧慮，建議可先暫停上艙膠囊，單獨補充下艙守宮飲即可😊\n提供給您參考～\n\n**需要轉人工**\n- 凝血功能異常或服用抗凝血藥物者\n- 經期中食用後出現明顯不適\n\n---\n\n### FAQ190｜雙艙守宮飲、雙艙仙女飲、樹飛雪元氣紅潤膠囊（食用時機）\n**問題分類：食用/使用方式**\n**風險等級：低**\n**Q：** 守宮飲、仙女飲、樹飛雪元氣紅潤膠囊都是早上吃嗎？\n**A：** 您好～😊\n三款都不一定要固定早上食用喔！\n✔ 雙艙守宮飲：白天補充即可\n✔ 雙艙仙女飲：白天補充即可，餐前餐後皆可\n✔ 樹飛雪元氣紅潤膠囊：建議餐後食用，早、午、晚餐後皆可\n若擔心一次補充太多，也可以分開時段食用😊\n提供給您參考～\n\n---\n\n### FAQ191｜樹飛雪靈芝多醣體發泡錠（兒童使用）\n**問題分類：特殊族群**\n**風險等級：低**\n**Q：** 樹飛雪靈芝多醣體發泡錠小學二年級可以吃嗎？\n**A：** 您好～😊\n樹飛雪靈芝多醣體發泡錠，4歲以上即可正常食用喔！\n因此國小二年級的小朋友可以補充😊\n若本身有特殊疾病、正在服藥或體質較敏感，建議先諮詢醫師後再食用會較安心喔。\n提供給您參考～\n\n---\n\n### FAQ192｜長期飲控運動但體重居高不下（含飲食紀錄）\n**問題分類：不良反應/副作用、食用/使用方式**\n**風險等級：低**\n**Q：** 6月開始很認真飲控，有走路跟運動，丟丟茶每天泡一包2000ml，康普茶下午1-2點喝一包，超商咖啡換成丟妹咖啡，去年開始吃酵素排便正常，但體重一直居高不下。\n**A：** 您好～感謝您這麼詳細分享飲食紀錄，真的看得出來您非常認真在執行！🙏\n看了一下您的飲食內容，蛋白質補充得很好，運動也很規律，咖啡也換成丟妹咖啡，這些都做得很到位😊\n有幾個方向或許可以微調看看：\n✔ **體重停滯很正常**：持續執行一段時間後，身體會進入適應期，體重暫時不動不代表沒有效果，建議也觀察腰圍或衣褲鬆緊度的變化😊\n✔ **飲食部分**：整體控制得不錯，偶爾出現的麵包、小籠包、粽子等澱粉類，若能再稍微減少頻率，整體效果會更穩定\n✔ **產品搭配**：目前酵素、丟丟茶、康普茶搭配方式都很正確，繼續維持即可\n我們的產品主要是幫助腸道調整與日常代謝，身體的調整有時會先反映在體態與腰圍上，而不一定立即呈現在體重數字上，請不要灰心，繼續觀察2-3週😊\n\n**需要轉人工**\n- 客人情緒明顯低落或要求退貨\n- 使用超過6個月完全無任何改變\n\n---\n\n### FAQ193｜孅孅凍（腹痛腹瀉／要求退貨）\n**問題分類：不良反應/副作用、食用/使用方式**\n**風險等級：中**\n**Q：** 可以退貨嗎？退沒開的三組。纖纖凍飯前跟睡前都試過了，但吃了三天每天都是半夜肚子痛起來拉，隔天只要有吃東西肚子又會開始絞痛。\n**A：** 您好～不好意思讓您有這樣的狀況🙏\n建議您可以先暫停食用 2～3 天，等腸胃恢復後，再改成半包、隔天一次，讓身體慢慢適應，同時記得多補充水分（建議每天 2,000c.c. 以上）。\n若調整後仍然會有腹痛或腹瀉的情況，建議先停止食用，再私訊客服，我們會依您的狀況協助您處理後續事宜，希望能幫您找到最適合的方式😊\n\n**需要轉人工**\n- 客人明確要求退貨時轉客服處理\n- 腹痛持續超過3天或伴隨發燒、血便\n- 停用後仍持續不適\n\n---\n\n### FAQ194｜長期飲控但停滯期（含藥物搭配、蛋白質不足）\n**問題分類：不良反應/副作用、食用/使用方式、特殊族群**\n**風險等級：中**\n**Q：** 早上空腹吃酵素，之後吃血壓藥，中午吃纖纖凍喝丟丟茶，晚上吃酵素再吃晚餐，5/25到現在才瘦3公斤，後來都沒有再瘦，為什麼？\n**A：** 您好～感謝您這麼詳細分享使用狀況，看得出來您真的非常認真執行！🙏\n能成功瘦 3 公斤已經很棒了😊 其實減重過程中，進入停滯期是很常見的現象，因為身體逐漸適應目前的飲食與生活型態，體重可能會暫時放慢下降速度，但不代表沒有持續調整中。\n這邊幫您看了一下，有幾個方向可以微調看看：\n✔ 酵素與藥物建議錯開食用：由於您有固定服用血壓藥，建議酵素與藥物間隔約 2 小時以上，讓保健食品與藥物分開補充，也會比較安心😊\n✔ 蛋白質可再增加一些：目前早餐有 2 顆茶葉蛋、晚餐有肉或魚，但中午只有孅孅凍，建議中午可再搭配一些蛋白質來源，例如雞胸肉、豆腐、水煮蛋或無糖豆漿，有助於維持肌肉量，並支持正常代謝。\n✔ 晚上酵素可維持於晚餐前約 30 分鐘食用：若目前食用後很快就吃晚餐，可以稍微拉開一些時間，依照建議方式食用即可。\n✔ 飲食不用刻意吃得太少：若長時間熱量攝取過低，身體也可能逐漸適應目前的飲食模式，使代謝速度放慢。建議維持均衡飲食，搭配足夠蛋白質、蔬菜及適量的優質澱粉，整體效果會更理想。\n✔ 記得補充足夠水分：建議每天至少補充 2,000 c.c. 以上的水分，有助於維持身體正常代謝及腸道順暢。\n我們的產品主要是作為日常飲食與健康管理的輔助，搭配均衡飲食、充足水分及規律生活，更有助於達到理想的管理效果😊\n另外，也不用太擔心體重暫時沒有下降。有時候身體正在調整狀態，雖然體重沒有明顯變化，但腰圍、體態或衣服的鬆緊度仍可能持續改善。建議持續依照目前的方式搭配上述調整，再觀察一段時間，相信有機會看到新的變化喔！\n\n**需要轉人工**\n- 客人情緒明顯低落或要求退貨\n- 使用超過6個月完全無任何改變\n- 服用多種慢性病藥物者\n\n---\n\n### FAQ195｜Clean Coffee、飽包\n**問題分類：產品搭配**\n**風險等級：低**\n**Q：** 咖啡可以跟飽包一起泡在一起喝嗎？\n**A：** 可以的，Clean Coffee 可以和飽包一起沖泡飲用，不會影響食用😊 不過若希望有較好的口感及飲用體驗，建議還是分開沖泡後再一起飲用，會比較容易攪拌均勻，也比較不容易結塊。另外，若您是將飽包作為代餐使用，也建議依照建議份量沖泡，搭配均衡飲食，讓營養補充更完整喔！😊\n\n---\n\n### FAQ196｜膠妍粉、Clean Coffee、丟丟茶、超纖酵素（脹氣）\n**問題分類：不良反應/副作用**\n**風險等級：低**\n**Q：** 哪一個產品吃了會脹氣肚子悶悶的？早上有吃膠原蛋白粉、咖啡、丟丟茶、酵素。\n**A：** 您好～😊 您目前有補充膠妍粉、Clean Coffee、丟丟茶及咕嚕咕嚕超纖酵素，脹氣或肚子悶悶的感覺不一定是單一產品造成的。若本身腸胃較敏感，剛開始補充時，少部分人可能會因腸胃蠕動增加或身體適應，而出現短暫的脹氣或腹部悶悶的感覺。建議您可以先調整看看：👉 酵素可先改為半包開始補充，讓腸胃慢慢適應，並依建議於空腹或餐前食用。👉 丟丟茶若目前一次喝完整包，可以試著分次慢慢飲用，觀察身體反應。👉 Clean Coffee 本身可能促進腸胃蠕動，若目前與其他產品同時補充，也可以試著錯開時段飲用。👉 膠妍粉一般較少引起脹氣，建議可維持原本的食用方式；若想進一步確認，也可以暫時與其他產品錯開時段補充，觀察身體反應。👉 記得補充足夠水分，建議每天至少 2,000 c.c. 以上，並搭配均衡飲食，有助於維持腸道順暢😊\n\n**需要轉人工**\n- 脹氣或腹部不適持續超過兩週\n- 伴隨腹痛、腹瀉或其他明顯不良反應\n\n---\n\n### FAQ197｜Clean Coffee、康普茶、孅孅飲、膠妍粉（多產品搭配）\n**問題分類：產品搭配**\n**風險等級：低**\n**Q：** 可以把咖啡、康普茶、孅孅飲、膠妍粉合在一起喝嗎？\n**A：** 這幾款產品可以搭配補充，但建議分時段飲用會比較理想😊\n🧩 建議食用方式：\n👉 早餐前／早餐時\n✔ Clean Coffee → 建議於早餐前或早餐時飲用，搭配均衡飲食更佳。\n👉 午餐前 30 分鐘\n✔ 孅孅飲 → 建議餐前 30 分鐘飲用，依建議方式補充即可。\n👉 下午或餐間\n✔ 康普茶 → 建議於下午或餐間飲用，可依個人習慣補充。\n👉 白天或晚上\n✔ 膠妍粉 → 可依個人習慣於白天或晚上補充。\n⚠️ 小提醒\n✔ 若一次將多種產品混合飲用，腸胃較敏感者可能較不適應，建議分時段補充會更理想。\n✔ 記得每天補充足夠水分。\n✔ Clean Coffee 含有咖啡因，若對咖啡因較敏感，建議避免太晚飲用，以免影響睡眠。\n💡 搭配均衡飲食、規律作息及適度運動，更有助於日常健康管理😊\n\n---\n\n### FAQ198｜大餐防守對策（閃金／閃銀）\n**問題分類：不良反應/副作用**\n**風險等級：低**\n**Q：** 閃金閃銀會有拉肚子或其他副作用嗎？\n**A：** 您好～😊 大餐防守對策（閃金／閃銀）依照建議食用方式補充，一般不會造成拉肚子等副作用。不過，每個人的體質不同，少部分腸胃較敏感的人，在剛開始食用時，可能會有排便次數增加、排便較順暢或輕微腸胃反應，通常會隨著身體逐漸適應而改善。建議您可先依照建議食用方式補充，並記得多補充水分。\n\n---\n\n### FAQ199｜雙艙仙女飲、膠妍粉、超纖酵素（糖尿病、高血壓、高血脂）\n**問題分類：特殊族群、疾病/用藥**\n**風險等級：高｜需轉人工確認**\n**Q：** 糖尿病、高血壓、高血脂可以食用仙女飲、膠妍粉、超纖酵素嗎？產品有含糖嗎？\n**A：** 您好～😊 有幫您確認，仙女飲、膠妍粉及咕嚕咕嚕超纖酵素皆非無糖產品，產品配方中有使用糖類或甜味來源，主要是作為配方及風味所需。若您有糖尿病、高血壓及高血脂等慢性病，由於每位患者的身體狀況、飲食控制及用藥情形都不同，我們不建議直接保證可以安心食用。建議先與您的主治醫師或營養師討論，確認符合目前的飲食控制後再補充，會較為安心🙏\n\n**需要轉人工**\n- 有糖尿病、高血壓、高血脂等慢性病詢問是否可食用\n- 客人堅持要求確認可以食用\n\n**標準原則（供客服參考）**\n- 面對慢性病族群詢問含糖問題，直接說明「非無糖產品」，不對代糖或甜味劑做有利或不利的個別詮釋\n- 不分產品逐一判斷含糖影響，統一建議諮詢主治醫師或營養師\n\n---\n\n### FAQ200｜孅孅凍（胃痛／腸胃不適）\n**問題分類：不良反應/副作用**\n**風險等級：中**\n**Q：** 買纖纖凍吃了第三天感覺胃很不舒服，第一天吃還不會，第二、三天胃都在痛。\n**A：** 您好～😊 不好意思讓您有這樣的狀況🙏 建議您先暫停食用，讓腸胃休息幾天。少部分腸胃較敏感的人，在剛開始補充孅孅凍時，可能會有胃部不適的情況；但如果已經出現胃痛，建議先不要繼續食用，待不適感消退後，若想再嘗試，可以改從半份開始補充，讓身體慢慢適應，同時也記得多補充水分（建議每天 2,000 c.c. 以上）。若胃部不適持續未改善，或有其他身體不適，建議儘早就醫並洽詢醫師，會較為安心喔。以上提供您參考～😊\n\n**需要轉人工**\n- 胃痛持續超過3天或停用後仍未改善\n- 伴隨嘔吐、發燒或血便等症狀\n\n---\n\n### FAQ201｜閃閃金、閃閃銀（飽足感）\n**問題分類：成分詢問**\n**風險等級：低**\n**Q：** 吃閃閃金閃閃銀肚子有飽足感算正常嗎？阻糖阻油關係對吧？\n**A：** 您好～😊 是的，有些人食用閃閃金＋閃閃銀後，會感覺比較有飽足感，這是有可能的喔！因為產品中的部分成分會協助延緩醣類及油脂的吸收，再搭配膳食纖維等成分，可能讓部分使用者在餐前或用餐時覺得比較有飽足感，因此這樣的感受是屬於正常現象。每個人的體質及感受都不太一樣，所以飽足感的程度也會有所差異😊\n\n---\n\n### FAQ202｜孅孅飲、超纖酵素（使用3個月體重無變化）\n**問題分類：不良反應/副作用、食用/使用方式**\n**風險等級：低**\n**Q：** 從4/15收到吃到現在約3個月，體重沒變，天天都有上2號，臉一樣圓，肚子少1吋，約只剩12天份。有吃餐，飯前15分鐘前就喝纖纖茶＋酵素（泡冷水喝）幾乎天天喝2-3次，還有更具體的建議嗎？\n**A：** 您好～😊 謝謝您這麼詳細分享這段時間的使用狀況！從您4月中開始持續使用到現在，雖然體重目前沒有明顯變化，但看到您分享腰圍已經減少約1吋，代表身體還是有持續在調整，有些人會先從體態開始改變，不一定會立即反映在體重上，所以除了體重之外，腰圍及整體體態的變化也是很重要的觀察指標喔！目前每天都有正常排便，也表示腸道狀況維持得不錯。建議可以留意幾個方向：👉 每餐盡量攝取足夠的蛋白質（如雞蛋、豆腐、雞肉、魚肉等），有助於增加飽足感及維持身體代謝。👉 留意是否有零食、含糖飲料、宵夜或醬料等額外熱量攝取。👉 每天補充足夠的白開水（建議約2,000 c.c.左右），不要只以茶飲取代飲水。👉 若平時活動量較少，可以每天增加20～30分鐘的步行或簡單運動。建議將纖纖茶安排在一天最容易吃多的一餐前15～30分鐘飲用；酵素依照建議方式補充即可，不一定增加食用次數效果就會更快。以上提供您參考😊\n\n**需要轉人工**\n- 客人情緒明顯低落或要求退貨\n- 使用超過6個月完全無任何改變\n- 服用多種慢性病藥物者\n\n---\n\n### FAQ203｜閃閃銀（阻糖是否包含水果糖分）\n**問題分類：成分詢問**\n**風險等級：低**\n**Q：** 閃閃銀膠囊的效果是阻糖、促進新陳代謝，裡面的阻糖是有含水果的糖份嗎？\n**A：** 您好～😊 閃閃銀膠囊所說的「阻糖」，主要是指協助減少飲食中澱粉類及糖分的吸收，並不是只針對水果中的糖分喔！😊\n\n---\n\n### FAQ204｜丟丟茶金麥（有紅酒成分嗎）\n**問題分類：成分詢問**\n**風險等級：低**\n**Q：** 請問丟丟茶金麥口味裡面有紅酒的成分嗎？\n**A：** 金麥口味主要為蕎麥、南非國寶綠茶、鳳梨酵素、毛喉鞘蕊花萃取、四稜白粉藤萃取、柑橘萃取、仙人掌及玉米鬚等成分，不含紅酒相關成分喔😊\n\n---\n\n### FAQ205｜康普茶熱帶水果（芒果過敏）\n**問題分類：成分詢問、特殊族群**\n**風險等級：中**\n**Q：** 請問熱帶水果裡面的成分有含芒果嗎？客人說家人喝就過敏。\n**A：** 您好，幫您確認過配方，熱帶水果口味本身沒有添加芒果成分。其中使用的熱帶水果果汁粉，主要來源為百香果濃縮汁及鳳梨濃縮汁，配方中並未添加芒果。由於過敏反應的原因有時較不容易立即確認，若方便的話，也可以再留意看看是否還有其他可能影響的因素。若目前仍有過敏或身體不適的情況，建議先暫停食用，也祝家人早日恢復健康😊\n\n**需要轉人工**\n- 過敏症狀明顯或持續未改善\n- 出現呼吸困難、嚴重皮膚反應等\n\n---\n\n### FAQ206｜雙艙仙女飲（飲用後咳嗽）\n**問題分類：不良反應/副作用**\n**風險等級：中｜需轉人工確認**\n**Q：** 已飲用雙艙仙女飲1瓶後表示生理不適，半夜一直咳嗽咳不停。\n**A：** 您好～😊 雙艙仙女飲主要是補充膠原蛋白、維生素C及穀胱甘肽等營養成分，一般並不會有咳嗽的常見反應。不過每個人的體質及當下身體狀況不同，也可能因其他因素出現不同的身體反應。建議您先暫停食用幾天，觀察身體狀況是否恢復正常。待身體狀況穩定後，若您希望再嘗試補充，可以先從較少的量開始，觀察身體是否能適應，再依情況逐步恢復至建議食用量。以上提供您參考喔😊\n\n**需要轉人工**\n- 咳嗽症狀持續超過2天未改善\n- 伴隨呼吸困難、喉嚨腫脹等症狀\n- 客人要求退貨\n\n---\n\n### FAQ207｜丟丟茶（含蔗糖素但營養標示糖分為0）\n**問題分類：成分詢問**\n**風險等級：低**\n**Q：** 丟丟茶裡面有蔗糖素，為何糖成份表是0？\n**A：** 蔗糖素是代糖，所以含糖量才顯示為零。代糖只有添加零點多mg，趨近於零，因此在營養標示上糖分會標示為0喔😊\n\n---\n\n### FAQ208｜孅孅凍（使用4天無效）\n**問題分類：不良反應/副作用**\n**風險等級：低**\n**Q：** 纖纖凍睡前一條，吃了4天，一天都喝3000以上，客人說吃了無效。\n**A：** 您好～😊 感謝您的回饋，也謝謝您願意分享使用狀況。目前您已補充4天，且每天都有喝到3000cc以上的水分，這部分做得很好👍 由於目前補充時間還不長，身體調整的速度也會有所不同，因此現階段還不一定能完整評估產品的感受。另外，也提醒您，除了持續依建議方式補充外，均衡飲食、蔬果及膳食纖維攝取、規律作息與適度活動，都是影響腸道調整的重要因素，建議一併留意。另外也提供您參考，孅孅凍是設計在「當餐食用」，後續可以改在正餐時（特別是吃比較多或外食的那一餐）食用一條，會更貼近產品的使用方式😊 若持續補充至一盒後仍沒有明顯感受，歡迎再與我們聯繫，我們會再協助您了解後續處理方式😊\n\n**標準SOP說明**\n1. 先肯定客人有照做（水分足、吃法對）\n2. 提醒影響產品發揮的整體條件（均衡飲食、膳食纖維、規律作息、適度活動）\n3. 說明補充時間不足，建議持續至一盒後再評估\n\n**需要轉人工**\n- 補充一盒後仍完全無感受\n- 客人情緒明顯不滿或要求退貨\n\n---\n\n### FAQ209｜康普茶熱帶水果（氣泡少）\n**問題分類：產品品質**\n**風險等級：低**\n**Q：** 熱帶水果的康普茶都沒氣泡，另外2種口味都正常。\n**A：** 您好～😊 謝謝您這麼仔細協助測試，也感謝您提供詳細的回饋🙏 我們已向原廠確認，由於熱帶水果口味使用天然水果原料，天然原料本身因批次可能會有些微自然差異，因此泡出來的氣泡感可能會略有不同。氣泡多寡屬於正常現象，不會影響產品本身的品質、成分及食用效果，請您安心飲用😊\n\n**需要轉人工**\n- 客人反映氣泡完全消失且伴隨異味或變色\n- 客人要求退換貨\n\n---\n\n### FAQ210｜孅孅凍（腸沾黏、體重增加、糖尿病前期，已就醫）\n**問題分類：特殊族群、不良反應/副作用**\n**風險等級：高｜需轉人工確認**\n**Q：** 客昨晚食用孅孅凍，因沒有排便+嚴重水腫，又因本身有腸沾黏情況，今天一整天在醫院。客的家人食用一個月胖5公斤。醫院體檢已有前期糖尿病情況。已電話聯繫，請問有沒有關於產品的食用禁忌或更好的回覆說法？\n**A：** 您好～感謝您的來電與回饋，也很感謝您願意將使用狀況告知我們🙏 關於孅孅凍的產品說明，這邊補充如下😊 孅孅凍主要成分包含蒟蒻粉、藤黃果、決明子、玉米鬚、黃香草木樨、綜合酵素及蔬果發酵粉等植物性成分，主要是協助補充膳食纖維，維持消化道機能及排便順暢，屬於日常飲食補充，並非藥品。一般健康成人可依產品建議方式食用；若本身有腸道相關疾病（如腸沾黏、腸阻塞等）、曾接受腸胃道手術、患有慢性疾病，或正在服用藥物，建議可先與主治醫師討論，確認是否適合補充，會比較安心。另外，孅孅凍主要是補充膳食纖維，並非以增加或降低體重為產品設計目的。體重的變化通常會受到飲食、生活作息、活動量及個人身體狀況等多方面因素影響，因此建議整體評估會較為完整😊 若目前醫師有針對飲食或營養補充提供建議，也建議以醫師的評估為優先。再次感謝您與我們分享使用情況，您的回饋我們都已完整記錄，作為後續產品評估與品質追蹤的參考。以上資訊提供您參考，也祝您早日恢復健康🙏\n\n**處理原則**\n- 不直接回應客人的健康狀況，針對產品本身說明\n- 不承認產品造成問題，也不否認客人的不適\n- 客人已就醫，不需要再建議就醫，改為「以醫師評估為優先」\n- 體重變化部分，說明影響因素多元，不單純歸因於產品\n\n**需要轉人工**\n- 涉及住院、腸道疾病、慢性病等高風險狀況一律轉人工\n- 客人要求退換貨或賠償\n\n---\n\n### FAQ211｜艾灸精油（使用後手變薑黃色）\n**問題分類：不良反應/副作用**\n**風險等級：低**\n**Q：** 客人說使用艾灸精油後手變薑黃色。\n**A：** 艾灸補氣精油中含有多種天然植物萃取成分，若使用後手部出現淡淡的薑黃色，可能是天然植物萃取成分本身的色澤暫時附著於皮膚表面所致。一般清洗幾次或經過皮膚正常代謝後會逐漸淡化，並不代表產品變質。建議使用後可用洗手乳或肥皂清潔雙手，若擔心手部沾染色澤，也可以於使用後立即清洗。以上提供您參考，謝謝😊\n\n**需要轉人工**\n- 皮膚出現紅腫、搔癢、過敏等反應\n- 清洗後顏色仍未淡化超過數天\n\n---\n\n### FAQ212｜Clean Coffee（胃食道逆流）\n**問題分類：不良反應/副作用**\n**風險等級：中**\n**Q：** 客人反應喝了Clean Coffee會有胃食道逆流的狀況。\n**A：** 您好，感謝您與我們分享使用情況🙏 Clean Coffee 含有咖啡萃取液及咖啡粉等成分。若本身有胃食道逆流、胃部較敏感，或對咖啡因較敏感者，飲用後可能出現胃部不適或胃食道逆流等情形。建議您可以先調整看看：✔ 改為餐後飲用，避免空腹飲用。✔ 可先從半包開始嘗試，觀察身體反應。✔ 飲用時可適量補充水分。✔ 避免與其他含咖啡因或刺激性飲品（如濃茶、能量飲料等）同時飲用。若調整後仍持續或反覆出現不適，建議先停止食用，並請醫師評估目前身體狀況及是否適合飲用含咖啡因產品。以上提供您參考，謝謝🙏\n\n**回覆原則**\n- 不寫沒有正式依據的數字（如咖啡因mg數）\n- 不用「因個人體質」，直接描述具體狀況\n- 不寫沒有明確依據的說法（如「稀釋濃度」）\n\n**需要轉人工**\n- 症狀持續或反覆發生\n- 客人要求退換貨\n\n---\n\n### FAQ213｜超纖酵素（使用一個月持續拉稀）\n**問題分類：不良反應/副作用**\n**風險等級：中**\n**Q：** 酵素都是一直拉稀嗎？目前服用一個多月都是這種狀態，是正常的嗎？\n**A：** 您好～感謝您分享這段時間的使用狀況😊 一般來說，剛開始補充酵素時，部分人可能會因腸道適應而出現排便次數增加或糞便較軟的情況，通常會在幾天內逐漸穩定。若已經補充一個多月仍持續有拉稀的情形，建議可以先調整食用方式，觀察是否有所改善。建議可以試試：✔ 暫時減量食用（例如先從半包開始）✔ 暫停補充3～5天，待腸胃恢復後再減量食用✔ 留意補充後的身體反應。若調整後仍持續拉稀，或伴隨腹痛、血便、發燒等不適症狀，建議先停止食用，並請醫師協助評估是否有其他因素影響。以上提供您參考，希望能幫助您找到較適合自己的補充方式😊\n\n**回覆原則**\n- 使用超過2週仍持續不適，不能再用「身體還在調適」解釋，會造成邏輯矛盾\n- 不再提喝水、飲食、作息等建議，避免暗示是客人的問題\n- 直接給具體調整方向（減量、暫停觀察）\n\n**需要轉人工**\n- 伴隨腹痛、血便、發燒等症狀\n- 客人要求退換貨\n\n---\n\n### FAQ214｜孅孅凍（腹部悶痛）\n**問題分類：不良反應/副作用**\n**風險等級：中**\n**Q：** 客詢問食用孅孅凍後會腹部悶痛，是正常的嗎？\n**A：** 您好～ 孅孅凍含有決明子、蘆薈萃取物及多種膳食纖維成分，部分人在剛開始補充時，可能會因腸道蠕動增加，出現輕微腹脹、排便次數增加或腸胃不適的情況。建議可以先暫緩食用，若停用後狀況恢復，之後想再嘗試，可先改為隔天1包或降低食用頻率，觀察腸胃的適應情況😊 若本身有正在追蹤中的腸胃疾病、腸胃較敏感，或有長期服用藥物的情況，也建議先與主治醫師確認後再補充會比較安心。\n\n**需要轉人工**\n- 腹部悶痛持續超過3天或加劇\n- 伴隨血便、發燒等症狀\n- 本身有腸胃疾病病史\n\n---\n\n### FAQ215｜跳跳綜合維他命（常見問題）\n**問題分類：食用/使用方式**\n**風險等級：低**\n**Q1：** 跳跳綜合維他命有沒有其他建議或注意事項？\n**A1：** 目前沒有特別的注意事項，依照建議食用量補充即可😊\n\n**Q2：** 跳跳綜合維他命何時吃比較好？上午/中午/晚上？餐前/餐後？\n**A2：** 沒有特別限定食用時段，依照個人習慣安排補充即可😊\n\n**Q3：** 為什麼4歲以下不適用？\n**A3：** 跳跳綜合維他命為晶體粉末（跳跳糖）劑型，考量4歲以下幼兒吞嚥能力尚未發育完全，為避免噎到的風險，建議4歲以下幼兒不適合食用😊\n\n**Q4：** 每天吃超過2包以上有沒有問題？\n**A4：** 基本上不會有問題，不過因為產品含有糖分，建議不要過量食用，依照每日1-2包的建議量補充即可😊\n\n---\n\n### FAQ216｜膠妍粉（粉末外觀是否正常）\n**問題分類：產品品質**\n**風險等級：低**\n**Q：** 膠妍粉裡面粉末這樣是正常的嗎？（白色蓬鬆細粉）\n**A：** 您好～😊 這樣的外觀是正常的喔！膠妍粉本身為白色細緻粉末，開封後看起來就是這個樣子，請放心食用😊 建議開封後依照建議方式食用，並保存於陰涼乾燥處，避免受潮，開封後也盡快食用完畢會比較好。\n\n**需要轉人工**\n- 粉末出現異味、變色或明顯異常\n\n---\n\n### FAQ217｜膠妍粉（粉末內有黑點是否發霉）\n**問題分類：產品品質**\n**風險等級：低**\n**Q：** 客戶打開膠妍粉，看到裡面有深色小顆粒後詢問：裡面有黑點是發霉嗎？\n**A：** 謝謝您提供照片。從照片看起來，粉末中的深色小顆粒較可能是產品配方中莓果等天然植物原料本身的顏色及細微顆粒，因此在粉末中看到少量深色點點屬於正常現象，不影響產品品質及食用。我們也另外開封產品確認，粉末中同樣可見少量深色顆粒，屬於配方原料的自然呈現，並非發霉現象，請您安心食用😊\n\n**需要轉人工**\n- 粉末出現異味、潮濕結塊或明顯變色\n- 客人仍不放心要求退換貨\n\n---\n\n### FAQ218｜大餐防守對策（不提供成分含量明細）\n**問題分類：成分詢問**\n**風險等級：低**\n**Q：** 客戶詢問大餐防守對策的成分內容明細（各成分mg數）。\n**A：** 您好～😊 大餐防守對策採雙膠囊搭配設計，主要是針對不同飲食內容進行搭配補充。產品的主要重點成分包含白腎豆萃取物、藤黃果萃取物、洋菇萃取物、山茶花萃取物、秋葵萃取物、靈芝菌絲體、玉米鬚萃取物等，完整成分皆可依產品包裝標示參考。至於您詢問的各項重點成分實際含量，例如白腎豆萃取物為多少mg，因涉及產品的配方比例及研發資訊，因此這部分沒有辦法提供個別的毫克數，還請您見諒🙏 若您是因為特定成分的攝取需求、過敏或其他食用上的考量，也可以告訴我們想確認的項目，我們可以再協助確認相關食用資訊。以上提供您參考～😊\n\n**回覆原則**\n- 成分名稱可以說明，但各成分的mg數或配方比例不提供\n- 若客人有過敏或特殊需求，可進一步確認特定成分是否存在\n\n---\n\n### FAQ219｜丟丟茶（是否含蛋奶素）\n**問題分類：成分詢問**\n**風險等級：低**\n**Q：** 丟丟茶裡有蛋奶素嗎？\n**A：** 您好～😊 丟丟茶三款口味（水蜜桃茶、金麥茶、洛神茶）的成分中，皆沒有添加蛋及乳製品成分。以上提供您參考～😊\n\n---\n\n### FAQ220｜Clean Coffee、丟丟茶、康普茶（完整飲食作息說明但一點感覺都沒有）\n**問題分類：不良反應/副作用、食用/使用方式**\n**風險等級：低**\n**Q：** 每天早上一杯無糖豆漿，配兩包丟妹咖啡加一顆茶葉蛋或一小條地瓜，水量用一包丟茶+2包康普茶2000cc，睡眠六小時，偶爾運動，但一點感覺都沒有。\n**A：** 您好～😊 從您目前的方式來看，產品都有按照不同時段搭配，如果目前覺得體態上的感受還不明顯，建議可從幾個生活習慣一起調整看看。飲水部分，目前一天約2000cc主要是丟丟茶及康普茶，建議可以再另外補充一些白開水，讓日常水分來源更充足。睡眠部分，目前一天大約6小時，如果可以的話，建議慢慢增加睡眠時間，盡量維持較充足且規律的睡眠。活動量部分，比起偶爾一次運動，更建議增加每天固定的活動量，例如走路、增加步數，或每週固定安排幾次運動，讓活動變得比較規律。飲食部分，早餐無糖豆漿搭配茶葉蛋或地瓜是可以的，也可以再一起留意午、晚餐的蛋白質、蔬菜、澱粉比例及整體份量，不需要刻意吃得非常少，維持均衡及規律會比較重要。另外，體態的變化有時不一定會先反映在體重數字上，也可以一起觀察腰圍、衣服鬆緊度、排便狀況及身體感受，持續一段時間會比單看短期體重更容易看出變化。可以先從增加白開水、延長睡眠及提高規律活動量這三個方向開始調整，再搭配目前的飲食及產品使用方式觀察看看😊 以上提供您參考～\n\n---\n\n### FAQ221｜康普茶（飲用後口乾舌燥）\n**問題分類：不良反應/副作用**\n**風險等級：低**\n**Q：** 客反應喝康普茶會口乾舌燥。\n**A：** 您好～😊 感謝您分享飲用後的狀況。康普茶配方中含有檸檬酸、康普茶粉及植物萃取等成分，每個人的口腔及身體感受不同，部分人在飲用後可能會覺得口腔較乾、口渴或有口乾舌燥的感受。建議可以先嘗試調整飲用方式：✔ 增加沖泡水量，將濃度調淡一些 ✔ 飲用康普茶後再適量補充白開水 ✔ 避免一次快速喝完，可以分次慢慢飲用 ✔ 若近期也有飲用咖啡、濃茶等飲品，可以稍微錯開時間。以上提供您參考～\n\n---\n\n### FAQ222｜丟丟茶、康普茶（醫師要求避免紅色素，哪些產品含天然紅色成分）\n**問題分類：成分詢問、特殊族群**\n**風險等級：中**\n**Q：** 醫師提到需要避免「紅色素」，是指人工食用紅色色素，還是包含天然來源的紅色色素也需要避免？\n**A：** 您好～😊 有幫您確認目前丟丟茶及康普茶的成分標示，提供您參考：✔ 乳製品：目前三款丟丟茶及三款康普茶的成分中，皆沒有看到牛奶、奶粉、乳清、乳糖等乳製品來源成分。✔ 碘／海藻類：目前成分中沒有海帶、昆布、海藻等海藻類原料。不過因您是配合治療需要限制碘的攝取，因此這部分仍建議以醫師提供的低碘飲食原則為準。✔ 紅色素：目前配方中沒有使用常見的「食用紅色○號」等人工紅色色素標示；不過部分口味有天然來源的呈色成分，例如：藤黃果洛神茶含天然葡萄皮色素、紅甜菜；熱帶水果康普茶含紅花萃取。因此，如果您治療期間需要連天然來源的紅色呈色成分也一併避免，這兩款會建議先不要飲用。由於您這次是配合治療前兩週的特殊飲食限制，會建議以醫師交代的飲食規範為優先；若醫師要求的是較嚴格的無碘或特定色素限制，還是建議可先諮詢醫師，會比較安心🙏 以上提供您參考～\n\n**需要轉人工**\n- 涉及醫療治療期間飲食限制，建議轉人工確認\n\n---\n\n### FAQ223｜超纖酵素、玫瑰孅孅飲（是葷食還是素食）\n**問題分類：成分詢問**\n**風險等級：低**\n**Q：** 請問酵素跟纖纖飲是葷的嗎？\n**A：** 酵素及孅孅飲都不是葷食喔，分類如下：✔ 咕嚕咕嚕超纖酵素（優格益生菌、莓果、鳳梨三種口味）：成分皆含乳糖，屬於奶素。✔ 玫瑰孅孅飲：屬於素食。以上提供您參考😊\n\n---\n\n### FAQ224｜大餐防守對策（食用後不減反胖）\n**問題分類：不良反應/副作用**\n**風險等級：低**\n**Q：** 客反映食用防守對策不減反胖。\n**A：** 您好～😊 大餐防守對策主要是針對日常飲食中較容易攝取到的油脂及澱粉類飲食做搭配補充，比較適合安排在聚餐、外食或飲食較豐盛的餐次使用；產品主要是作為飲食管理上的輔助，因此體重的變化仍會受到整體飲食、活動量、作息及身體水分變化等多方面因素影響。您提到目前都是安排在中午食用，這部分可以稍微調整看看😊 不一定要固定在中午補充，可以依當天實際的餐點內容來安排。例如當餐的油脂、澱粉較多，或遇到聚餐、外食較豐盛的餐次，再依建議於餐前約10分鐘食用，會比較符合防守對策原本的搭配方式。平常飲食則可以維持均衡，適量攝取蛋白質、蔬菜及澱粉，並搭配規律活動；體態觀察除了體重之外，也可以一起記錄腰圍、衣物鬆緊度，會比單看短期體重數字更完整。如果近期體重確實是持續往上增加，也可以先觀察一段時間的飲食內容、活動量、睡眠及水分變化，再一起看看是否有可以調整的地方😊 以上提供您參考～😊\n\n---\n\n### FAQ225｜康普茶、丟丟茶（飲用後容易溢刺酸／胃食道逆流）\n**問題分類：不良反應/副作用**\n**風險等級：中**\n**Q：** 客反映後期喝康普茶跟丟丟茶，好容易溢刺酸（沒喝之前平常不會有這個狀況），飯前飯後喝都會。\n**A：** 您好～😊 感謝您跟我們分享近期的飲用狀況。康普茶及丟丟茶的配方中含有果酸、植物萃取等成分，每個人的腸胃耐受程度不同，若近期胃部較敏感，飲用後有可能會比較容易感受到酸感或胃部不舒服的情況。由於您提到先前飲用並沒有這樣的狀況，是近期才開始出現，而且目前飯前、飯後飲用都會有明顯的逆流感，建議可以先暫停康普茶及丟丟茶，讓胃部休息並觀察一段時間。若之後胃部狀況已經較穩定，也願意再嘗試看看，可以先選擇其中一款補充，不要兩款同時恢復，這樣也比較容易觀察身體對不同產品的適應狀況。康普茶可以先從半包開始，增加沖泡水量並安排在餐後飲用；丟丟茶則可以先從半包泡水，於白天分次飲用，避免短時間內集中喝完。恢復補充期間，也可以先避免與咖啡、濃茶、酸性或辛辣刺激的飲食集中在同一時段。同時也可以稍微留意近期的胃部狀況，例如在沒有飲用產品的時候，是否也會出現胃酸、胸口灼熱、酸水上來或其他胃部不適。有時胃部的敏感程度也可能受到近期飲食、作息、壓力或身體狀況影響。以上提供您參考～😊\n\n**需要轉人工**\n- 症狀持續超過一週或加劇\n- 伴隨其他腸胃不適症狀\n\n---\n\n### FAQ226｜丟系列產品（水腫要退貨）\n**問題分類：不良反應/副作用、客訴退貨**\n**風險等級：中｜需轉人工確認**\n**Q：** 客表示購買丟系列產品會水腫，想退貨。\n**A：** 您好～😊 因為您目前有感受到水腫的情況，建議可以先暫停幾天，觀察水腫狀況是否有所變化。若之後狀況較穩定、也願意再嘗試看看，可以先選擇其中一款開始補充，不要兩款同時恢復，並觀察幾天身體的反應。丟丟茶可以先從半包開始泡水，於白天分次飲用；康普茶則可以先從半包、餐後補充開始。等確認身體適應後，再視狀況慢慢調整即可。以上提供您參考～😊\n\n**需要轉人工**\n- 客人要求退貨，一律轉人工處理\n\n---\n\n### FAQ227｜極萃光日月初生精華（角蛋白是天然還是化學的）\n**問題分類：成分詢問**\n**風險等級：低**\n**Q：** 請問極萃光日月初生精華中的角蛋白的原料是天然還是化學的？\n**A：** 您好～😊 極萃光日月初生精華中所使用的角蛋白，原廠在原料選擇上主要考量配方的穩定性及使用品質，因此選用專業製程處理後，穩定性較佳的化妝品用角蛋白原料。以上提供您參考～😊\n\n---\n\n### FAQ228｜極萃光日月初生精華（有一股怪味）\n**問題分類：產品品質**\n**風險等級：低**\n**Q：** 客反應極萃光日月初生精華有一股怪味。\n**A：** 您好～😊 極萃光日月初生精華配方中含有角蛋白（Keratin）及水解角蛋白（Hydrolyzed Keratin）等原料，而角蛋白本身具有較明顯的原料氣味，因此在使用時可能會聞到一些較特殊的味道，這也是部分使用者覺得味道比較明顯的原因，並非另外添加的異常氣味。若產品本身的顏色、質地及使用狀態皆無明顯異常，可依正常方式使用😊 以上提供您參考～\n\n**需要轉人工**\n- 產品出現異色、異質或明顯異常\n- 客人要求退換貨\n\n---\n\n### FAQ229｜咖啡（早上空腹喝檸檬水後再喝咖啡）\n**問題分類：食用/使用方式**\n**風險等級：低**\n**Q：** 我如果早上空腹喝檸檬水，之後再喝咖啡，這樣可以嗎？會有影響嗎？\n**A：** 您好～ 如果早上習慣空腹喝檸檬水，之後再喝咖啡，一般來說兩者沒有特別的衝突，可以依照平常習慣補充喔！不過檸檬水及咖啡都可能讓胃部比較敏感的人感受到刺激，如果本身容易有胃酸、胃部不適或喝咖啡容易不舒服，建議不要兩者都在空腹時連續飲用，可以先吃點早餐後再喝咖啡，會比較溫和一些。如果平常喝了都沒有不舒服，就不需要特別錯開很久，依照自己的習慣安排即可。以上提供您參考～\n\n---\n\n### FAQ230｜彈力膠原產品、藍銅彈力緊緻水凝霜（挖取時凝固／質地變稠、使用後微癢）\n**問題分類：產品品質、不良反應/副作用**\n**風險等級：中**\n**Q：** 右邊彈力膠原那瓶要挖的時候都凝固是正常的嗎？左邊那瓶藍銅水凝霜今年6月中購買，先把之前的保養品用完，這幾天才開始使用，覺得質地怪怪的，擦完也會有些許癢癢的。\n**A：** 您好～😊 感謝您提供照片及使用狀況。關於您提到產品挖取時有些凝結、質地較稠的情況，因產品為玻璃瓶器盛裝，內容物接觸瓶身後，可能會受到環境溫度及保存狀況變化影響，使部分內容物出現較凝聚或質地較稠的情形，這部分屬於產品可能出現的質地變化，並不代表產品變質喔。另外您有提到使用後會有些微搔癢，由於每個人的膚況及肌膚耐受程度不同，建議目前可以先暫停使用，待肌膚狀況穩定後，再從局部少量測試並觀察肌膚反應，會比較安心喔😊 以上提供您參考～\n\n**需要轉人工**\n- 暫停使用後仍持續搔癢，或出現紅腫、刺痛等明顯肌膚反應\n- 產品出現異味、異色等明顯異常\n- 客人要求退換貨\n\n---\n\n### FAQ231｜丟丟茶（飲用後不適，停用改善、再喝又不適，想退貨）\n**問題分類：不良反應/副作用、客訴退貨**\n**風險等級：中｜需轉人工確認**\n**Q：** 無效果，想退丟茶。喝一段時間身體狀況有些不適，試著停一下，停一段時間有好些，為了確認又喝，就開始不適。\n**A：** 您好～😊 謝謝您提供這段時間的飲用狀況。由於每個人的身體狀況及對配方的適應程度不同，食用後的感受也可能有所差異。考量您目前反映的飲用狀況，還是以身體舒適為優先喔。至於您提到預期效果的部分，因丟丟茶屬於日常飲食搭配的補充食品，實際感受仍會受到飲食、作息、活動量及身體狀況等多方面因素影響，因此並非以特定的體重或體態變化作為食用後的保證，這部分也提供您了解。以上提供您參考～\n\n**需要轉人工**\n- 客人要求退貨，一律轉人工處理\n\n---\n\n### FAQ232｜孅孅凍（低碘飲食是否可食用）\n**問題分類：成分詢問、特殊族群**\n**風險等級：中**\n**Q：** 客人詢問低碘飲食孅孅凍可以吃嗎？\n**A：** 您好～😊 幫您確認過孅孅凍的完整成分，配方中主要為蒟蒻粉、決明子、藤黃果、蘆薈萃取等植物性成分，沒有海帶、昆布等常見含碘食材。不過成分中有鹿角菜膠，是從紅藻萃取的天然膠體，若您的低碘飲食需要嚴格限制所有海藻來源成分，建議將完整成分提供給主治醫師確認，以醫師的飲食規範為準會比較安心🙏\n\n**需要轉人工**\n- 涉及醫療治療期間飲食限制，建議轉人工確認\n\n---\n\n### FAQ233｜咕嚕咕嚕超纖酵素（肚子一直滾，改半包或早晚各半包）\n**問題分類：食用/使用方式、不良反應/副作用**\n**風險等級：低**\n**Q：** 吃咕嚕酵素肚子會一直滾，改吃半包可以嗎？效果會有差嗎？若早晚各半包這樣OK嗎？\n**A：** 您好～😊 若補充咕嚕酵素後，覺得肚子一直有滾動感，可以先調整為半包食用沒問題，先讓腸道慢慢適應。至於效果方面，因為食用量減少，效果可能會比一包來得溫和一些，但仍可依照個人的身體反應慢慢調整，不一定要一次補充到一整包。如果想分次補充，早晚各半包也是可以的，這樣有些人會覺得腸胃比較舒服，也能減少一次補充後的不適感。建議補充期間維持充足水分，並持續觀察身體狀況。若腸胃反應仍較明顯，也可以先暫停食用 2～3 天，待腸胃狀況較穩定後，再從半包開始恢復補充，並依身體反應逐步調整食用量。以上提供您參考～😊\n\n---\n\n### FAQ234｜Diu+ 體態管理系列（懷孕期間哪些產品不能食用）\n**問題分類：特殊族群**\n**風險等級：高｜需轉人工確認**\n**Q：** 客詢問如果懷孕，丟系列瘦身產品有哪些不能食用？\n**A：** 您好～😊 若有懷孕、備孕或哺乳中的情況，建議補充產品前可先確認各產品的注意事項。依目前 Diu+ 產品資訊，可參考以下建議：\n\n📌 孕期原則上不建議食用\n✔ Clean Coffee（含咖啡因及藤黃果等體態管理成分，孕期原則上不建議食用。）\n✔ 藤黃果茶系列（水蜜桃茶、金麥茶、洛神茶）（產品標示孕婦不宜使用。）\n✔ 超纖酵素（各口味）（產品標示孕婦不建議食用。）\n✔ 玫瑰孅孅飲（產品標示孕婦不宜食用，含桑黃菌絲體。）\n✔ 孅孅凍（含蘆薈萃取物，孕婦不建議食用。）\n✔ 雙艙守宮飲（含丹參、益母草、當歸等漢方活血成分，孕婦不建議食用。）\n✔ 雙艙仙女飲（產品標示孕婦、哺乳婦女不宜食用。）\n✔ 大餐防守對策（含藤黃果等體態管理成分，孕期原則上不建議食用。）\n\n📌 建議先諮詢醫師後再補充\n✔ 康普茶系列（孕婦及哺乳期間建議先諮詢專業人士。）\n✔ 膠妍粉（產品標示孕婦需評估，建議先諮詢醫師後再補充。）\n✔ 飽包（可可／香蕉／奶茶
