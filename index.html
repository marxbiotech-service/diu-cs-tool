）（未標示孕婦禁用，若孕期有補充需求，建議先諮詢醫師。）\n✔ 明守對策（產品標示孕期需評估，建議先諮詢醫師後再補充。）\n\n以上提供您參考～\n\n**需要轉人工**\n- 孕婦、哺乳中，一律轉人工確認\n\n---\n\n### FAQ235｜Diu+ 體態管理系列（糖尿病患者食用注意整理）\n**問題分類：特殊族群、疾病詢問**\n**風險等級：高｜需轉人工確認**\n**Q：** 客人希望針對糖尿病患者也做一份產品食用注意整理。\n**A：** 若有糖尿病、糖尿病前期，或正在服用降血糖藥物，建議補充產品前可先確認各產品的注意事項。由於糖尿病屬於需要綜合評估的慢性疾病，除了血糖控制外，也需考量目前的飲食規劃、服用藥物、身體狀況及其他慢性疾病等因素，因此在補充保健食品前，建議先與主治醫師討論，確認是否適合補充會較安心。依目前 Diu+ 產品資訊，可參考以下建議：\n\n📌 建議先諮詢醫師後再補充\n✔ Clean Coffee（含咖啡因及藤黃果、白腎豆等體態管理成分。）\n✔ 藤黃果茶系列（水蜜桃茶、金麥茶、洛神茶）（含藤黃果及多種植物萃取成分。）\n✔ 康普茶系列（含山苦瓜等植物萃取成分。）\n✔ 超纖酵素（含酵素及益生菌等成分。）\n✔ 玫瑰孅孅飲（含白腎豆、藤黃果及高膳食纖維配方。）\n✔ 孅孅凍（含膳食纖維及植物萃取成分。）\n✔ 大餐防守對策（含藤黃果等體態管理成分。）\n\n📌 一般可補充，但仍建議告知醫師\n✔ 雙艙守宮飲\n✔ 雙艙仙女飲\n✔ 膠妍粉\n✔ 飽包（可可／香蕉／奶茶）\n✔ 明守對策\n\n以上提供您參考喔\n\n**需要轉人工**\n- 正在服用降血糖藥物或施打胰島素\n- 多重慢性病患者\n\n---\n\n### FAQ236｜超纖酵素、孅孅飲、孅孅凍、丟丟茶、Clean Coffee（同時開始多項產品，水狀／噴射狀排便）\n**問題分類：不良反應/副作用、多產品搭配**\n**風險等級：中**\n**Q：** 7/31收到，8/1開始使用。早上纖酵1包+膠妍粉1包+咖啡1包隨餐+日明守1顆；晚餐前孅孅飲1包+夜明守1顆；睡前纖酵1包+孅孅凍1條；整天丟丟茶2000ml，喝太多就沒喝康普茶。8/2與8/1一樣。這幾天排便都是水狀、噴射狀，不會肚子痛，但有時一感到便意就要馬上上廁所，不然會來不及，這樣正常嗎？\n**A：** 您好～😊 感謝您詳細提供食用方式及身體狀況。從您的補充方式來看，第一次就同時搭配多項產品，包含纖酵、孅孅飲、孅孅凍、丟丟茶及 Clean Coffee，因每個人的體質及腸道適應狀況不同，部分人在初期補充時，可能會出現排便次數增加或糞便較稀的情形。不過，如果目前已經持續出現水狀、噴射狀排便，建議可以先適度調整補充方式，例如先將纖酵調整為每天1包，或先暫停孅孅凍 2～3 天觀察，待排便恢復較穩定後，再逐步恢復補充，讓腸道有時間適應。另外，也請持續補充足夠水分及留意身體狀況。以上提供您參考～😊\n\n**需要轉人工**\n- 調整後腹瀉仍持續超過3天\n- 出現腹痛、血便、頭暈或脫水等症狀\n\n---\n\n### FAQ237｜丟丟茶、康普茶（是否含米成分）\n**問題分類：成分詢問、過敏原**\n**風險等級：低**\n**Q：** 客詢問丟丟茶跟康普茶裡面是否有米的成分？\n**A：** 您好～😊 康普茶三種口味（蘋果鳳梨、麝香葡萄、熱帶水果）成分中皆沒有米或米製成分。藤黃果茶系列中，水蜜桃茶及金麥茶沒有米製成分；洛神茶則含有大吟釀酒粕，若您是因米來源、過敏或飲食需求而需要避免相關成分，建議可特別留意。另外，藤黃果茶系列依產品標示含有麩質之穀物及其製品，不適合對其過敏體質者食用。以上提供您參考～😊\n\n---\n\n### FAQ238｜超纖酵素（不易溶解於水）\n**問題分類：產品品質、食用/使用方式**\n**風險等級：低**\n**Q：** 客戶反映酵素很難溶解於水，請問是什麼原因？\n**A：** 從影片中看起來，粉末接觸到水後有較慢溶散的情況，這主要是因配方中含有膳食纖維、植物性原料及酵素等成分，遇水後會先吸附水分，因此在沖泡初期可能會出現較慢溶散的情況，屬於正常現象，不影響產品品質及食用。建議可改用常溫水或溫開水沖泡，並延長攪拌時間，或使用搖搖杯充分搖勻，通常會比直接以湯匙攪拌更容易混合均勻。以上提供您參考～😊\n\n---\n\n### FAQ239｜益菌球（孕婦可否食用）\n**問題分類：特殊族群**\n**風險等級：中｜需轉人工確認**\n**Q：** 客人詢問益菌球孕婦可以吃嗎？\n**A：** 您好～😊 關於益菌球孕婦是否可以食用，會需要依不同款式的成分來看喔！益菌球主要為益生菌、益生質等營養補充成分，不過孕期屬於較特殊的生理階段，建議仍依各款產品成分及注意事項確認後再補充。若是含有蜂膠成分的款式，孕婦則不建議食用，孕期建議先避開含蜂膠的產品。以上提供您參考～😊\n\n**需要轉人工**\n- 孕婦、哺乳中，一律轉人工確認\n\n---\n\n### FAQ240｜超纖酵素、玫瑰孅孅飲、康普茶、丟丟茶（想要加強版搭配）\n**問題分類：多產品搭配、食用/使用方式**\n**風險等級：低**\n**Q：** 目前購買酵素、玫瑰孅孅飲、康普茶、丟丟茶，如果想加強版的話，要怎麼配合著吃效果才會加速？\n**A：** 您好～😊 感謝您的詢問！目前酵素、玫瑰孅孅飲、康普茶及丟丟茶這四款，其實已經是蠻完整的搭配了，可以透過不同時段安排，讓日常補充更有規律喔😊 加強版搭配可以這樣安排👇\n\n✔ 起床後空腹｜酵素 1包：作為每日腸道與排便調整的補充，並搭配足夠水分。\n✔ 午餐前約30分鐘｜玫瑰孅孅飲 1包：補充膳食纖維，也可增加飽足感，建議搭配足夠水分一起飲用。\n✔ 下午｜康普茶 1包：可安排在餐後或下午補充，作為日常飲食搭配。\n✔ 白天｜丟丟茶 1包：每日1包泡水飲用，可於白天分次補充，不需要集中一次喝完。\n\n如果晚餐比較豐盛，也不需要特別把產品全部集中在晚餐前後補充，依照原本建議量、分開時段搭配即可😊 日常搭配也可以注意：✔ 每日維持充足水分，尤其補充膳食纖維時更要留意水分攝取 ✔ 三餐維持均衡，蛋白質、蔬菜及適量澱粉都要攝取 ✔ 不需要為了體態管理而過度節食 ✔ 搭配規律活動及運動，對整體體態管理也會更有幫助。四款產品依照建議食用量搭配就已經很完整，加強的重點是把食用時段、飲食、水分及活動量安排好。產品依照建議量穩定補充，來發揮原本搭配的作用，不用特別增加食用量喔😊 以上提供您參考～\n\n**回覆原則**\n- 「加強版」不等於增加食用量，重點放在時段安排與生活習慣\n", "sopKB": "# Diu+ 客訴SOP庫 v2.0\n最後更新：2026年6月\n\n---\n\n## SOP001｜吃很久沒瘦\n\n**客戶常見說法**\n- 吃了3個月都沒瘦\n- 喝半年都沒效果\n- 體重完全沒變\n- 怎麼吃都沒感覺\n\n**回覆原則**\n- 先肯定客戶努力\n- 不直接否定客戶做法\n- 不保證效果\n- 提供可調整方向\n\n**標準回覆**\n感謝您這麼詳細分享😊\n\n看得出來您真的非常認真執行，這部分很不容易。\n\n體重變化除了產品補充外，也和飲食內容、蛋白質攝取、肌肉量、作息及活動量有關。\n\n若長期低油、低糖、低澱粉，蛋白質攝取又不足，身體有時反而可能因肌肉量下降而影響基礎代謝。\n\n建議可以留意每日蛋白質是否足夠，並搭配規律活動及充足水分。\n\n我們的產品主要是幫助腸道調整與日常代謝管理，搭配均衡飲食及運動時，整體感受通常會更明顯😊\n\n**需要轉人工**\n- 使用超過6個月且完全無任何改變，客人情緒明顯不滿\n- 客人要求退貨\n\n**額外引導（體重無變化時）**\n除了體重，也引導客人觀察：\n✔ 排便是否較順暢\n✔ 飽足感是否有提升\n✔ 腰圍或衣褲鬆緊度是否有變化\n\n---\n\n## SOP002｜吃了反而變胖\n\n**客戶常見說法**\n- 吃了更胖\n- 體重增加\n- 腰圍變大\n\n**回覆原則**\n- 不直接否認\n- 不怪罪客戶\n- 提供觀察方向\n\n**標準回覆**\n感謝您分享目前的狀況😊\n\n剛開始補充膳食纖維、酵素或代謝相關產品時，有些人可能因腸道適應、水分滯留或飲食結構改變，而出現短期體重波動。\n\n除了體重之外，也建議一起觀察：\n✔ 排便狀況\n✔ 飽足感\n✔ 腰圍及衣褲鬆緊度\n\n有時身體的調整會先反映在體態與生活感受上，而不一定立即呈現在體重數字上😊\n\n**需要轉人工**\n- 體重短期大幅增加（超過3公斤）且同時出現身體不適\n\n---\n\n## SOP003｜拉肚子\n\n**客戶常見說法**\n- 一直跑廁所\n- 拉肚子\n- 肚子絞痛\n\n**回覆原則**\n- 確認食用產品\n- 先減量\n- 增加水分\n\n**標準回覆**\n您好～\n\n部分消費者剛開始補充酵素、孅孅飲、孅孅凍等產品時，因腸道正在適應，可能會出現排便次數增加的情況。\n\n建議可以先減量食用，並搭配充足水分（每日2000cc以上）觀察3～5天。\n\n若症狀持續或明顯不適，建議先暫停使用並諮詢專業醫療人員😊\n\n**需要轉人工**\n- 腹瀉持續超過3天\n- 出現血便或嚴重腹痛\n- 已就醫但仍持續\n\n---\n\n## SOP004｜便秘沒改善\n\n**客戶常見說法**\n- 還是便秘\n- 沒有排便\n- 沒有順暢感\n\n**回覆原則**\n- 先確認水量\n- 再確認纖維量\n- 不直接說產品無效\n\n**標準回覆**\n您好～\n\n順暢感除了產品補充外，和每日飲水量及膳食纖維攝取也有很大關係。\n\n建議每日飲水量至少2000cc以上，並搭配蔬菜水果及規律作息。\n\n有些人體質較慢熱，建議持續觀察1～2週看看😊\n\n---\n\n## SOP005｜心悸／睡不著\n\n**客戶常見說法**\n- 心跳加速\n- 胸口怪怪的\n- 喝完不舒服\n- 睡不著\n- 太亢奮\n\n**回覆原則**\n- 優先確認是否首次飲用\n- 說明咖啡因來源\n- 提供減量建議\n\n**標準回覆**\n您好～\n\nClean Coffee 含有咖啡萃取成分，每包約含150mg咖啡因。\n\n若平常較少喝咖啡、茶或能量飲料，第一次飲用可能會較明顯感受到精神提升或心跳加快。\n\n建議可以先從半包開始嘗試，或於早餐後飲用觀察身體狀況。\n\n若仍持續出現不適，建議停止食用並諮詢醫師😊\n\n**需要轉人工**\n- 心悸症狀持續或加劇\n- 本身有心臟病史\n\n---\n\n## SOP006｜產品異常（漂浮物、沉澱、變色、異味、膨脹）\n\n**客戶常見說法**\n- 上面有白白的\n- 有沉澱\n- 顏色跟之前不一樣\n- 聞起來怪怪的\n- 包裝膨脹\n\n**輕微色差、沉澱（正常現象）**\n感謝您提供照片😊\n\n從照片看起來較像是成分靜置後產生的自然聚集或分層現象。\n\n建議先輕輕搖晃均勻後再觀察看看。\n\n若沒有異味、變色或其他異常狀況，通常不影響正常使用。\n\n若方便的話，也歡迎提供更多照片讓我們協助確認😊\n\n**明顯異味、嚴重變色**\n感謝您告知，這邊需要特別確認一下😊\n\n建議先暫停食用，並提供：\n✔ 產品批號（包裝上的製造日期）\n✔ 保存方式\n✔ 照片\n\n收到後我們會盡快為您確認並處理🙏\n\n**包裝膨脹、漏液**\n感謝您告知，我們非常重視這個情況！\n\n建議先不要食用，請提供照片、批號及購買管道，我們會優先為您安排處理🙏\n\n**需要轉人工**\n- 包裝膨脹、漏液\n- 明顯異味（尤其同批號多人反映）\n- 客人食用後身體不適\n\n---\n\n## SOP007｜疾病詢問\n\n**適用情境**\n癌症、化療、腫瘤、子宮肌瘤、乳房纖維囊腫、慢性病、服藥中\n\n**回覆原則**\n先說明產品功能，再建議諮詢醫師，語氣溫和不嚇人\n\n**標準回覆**\n您好～\n\n[產品名稱]主要作為日常[功能說明]補充使用，一般健康族群是可以食用的，但：\n\n若目前有疾病治療、追蹤中或長期服藥，建議將產品成分提供給主治醫師評估，確認目前身體狀況是否適合補充，會較安心😊\n\n**高風險疾病（一律建議諮詢醫師）**\n- 糖尿病、高血壓、三高\n- 肝臟疾病、腎臟疾病\n- 心臟病、凝血功能異常\n- 腫瘤、癌症\n- 服用抗凝血藥（warfarin）\n- 服用降血糖藥、甲狀腺藥物\n\n**需要轉人工**\n- 正在服用抗凝血藥、化療藥物\n- 腫瘤患者\n- 肝腎功能不全\n\n---\n\n## SOP008｜孕婦／哺乳詢問\n\n**標準回覆**\n您好～\n\n因孕期每個人的身體狀況不同，若目前懷孕、備孕或哺乳中，建議先與婦產科醫師確認後再補充會較安心😊\n\n**孕婦絕對禁食的產品（需明確告知）**\n- 孅孅凍（含蘆薈萃取物）\n- 雙艙守宮飲（含漢方活血成分：丹參、益母草、當歸）\n- 納豆Q10膠囊\n\n**這三款的回覆**\n[產品名稱]的注意事項中有標示孕婦不宜食用，因此這段期間建議暫停使用，以媽媽和寶寶的健康為優先🙏\n\n---\n\n## SOP009｜兒童詢問\n\n**標準回覆**\n您好～\n\n不同產品建議年齡有所不同，建議提供產品名稱及小朋友年齡，我們再幫您確認最適合的補充方式😊\n\n**各產品年齡限制對照表**\n| 產品 | 建議年齡 |\n|------|---------|\n| 橙長鈣 | 1歲以上 |\n| 大餐防守對策 | 6歲以上 |\n| 閃閃金銀 | 6歲以上 |\n| 飽包 | 12歲以上 |\n| 明守對策 | 12歲以上（成人設計）|\n| 納豆Q10 | 15歲以上 |\n| 其他保健食品 | 建議諮詢兒科醫師 |\n\n---\n\n## SOP010｜產品搭配詢問\n\n**回覆原則**\n- 能一起吃先說可以\n- 再提供較佳時段\n- 不要過度強調衝突\n\n**標準回覆**\n您好～\n\n原則上可以搭配補充喔😊\n\n若希望身體感受較穩定，建議分開時段食用，例如早餐前、餐前或睡前安排不同產品即可。\n\n也記得補充足夠水分，整體感受通常會更好😊\n\n---\n\n## SOP011｜要求退貨\n\n**回覆原則**\n不在 AI 草稿裡承諾退貨，引導轉人工處理\n\n**標準回覆**\n感謝您告知，非常抱歉造成您的困擾🙏\n\n關於退換貨的部分，需要由我們的客服人員為您進一步確認和處理。\n\n可以請您提供：\n✔ 購買日期和購買管道\n✔ 手邊剩餘產品數量\n✔ 批號/製造日期\n\n我們會盡快為您安排後續處理😊\n\n**⚠️ 此類問題一律轉人工，不由 AI 決定退貨**\n\n---\n\n**特殊情況：副作用＋退貨同時出現**\n\n當客人同時反映身體不適且要求退貨時，**不要直接跳到退貨處理**，依以下順序回覆：\n\n1. **先同理不適**：關心客人身體狀況，語氣溫和\n2. **給調整建議**：建議暫停使用、減量、補充水分，說明以體質差異為由，不直接承認產品有問題\n3. **最後帶到後續**：「若仍有不適，再私訊客服，我們會依您的狀況協助後續處理」\n\n這樣的順序讓客人感覺被重視，同時保留退貨彈性空間，不直接承諾也不迴避。\n\n**範例回覆（以孅孅凍腹痛為例）**\n您好～不好意思讓您有這樣的狀況🙏\n建議您可以先暫停食用 2～3 天，等腸胃恢復後，再改成半包、隔天一次，讓身體慢慢適應，同時記得多補充水分（建議每天 2,000c.c. 以上）。\n若調整後仍然會有腹痛或腹瀉的情況，建議先停止食用，再私訊客服，我們會依您的狀況協助您處理後續事宜，希望能幫您找到最適合的方式😊\n\n---\n\n## SOP012｜產品質疑／負面輿論\n\n**適用情境**\n客人分享網路文章，質疑產品成分或安全性\n\n**回覆原則**\n- 不否定客人的疑慮\n- 根據實際成分誠實說明\n- 引導諮詢醫師\n\n**標準回覆**\n感謝您主動分享這個資訊，也謝謝您對產品成分的重視😊\n\n這邊幫您確認了[產品名稱]的成分：[根據實際成分說明]\n\n若您仍有疑慮，或本身有特殊健康狀況，建議將產品成分提供給主治醫師評估，以醫師建議為主喔😊\n\n\n---\n\n## SOP013｜胃不舒服／胃酸／胃脹氣\n\n**客戶常見說法**\n- 喝了胃怪怪的\n- 胃酸變多\n- 反胃\n- 胃脹氣\n- 胃不舒服\n\n**回覆原則**\n- 先確認食用產品與時段\n- 不直接判定產品有問題\n- 優先建議調整時段\n\n**標準回覆**\n您好～\n\n部分消費者若空腹食用酵素、康普茶、丟丟茶或 Clean Coffee，可能會因個人體質不同，而感受到胃部較敏感或胃酸增加的情況。\n\n建議可以改為餐後食用，或先從半份開始補充觀察看看😊\n\n另外也建議避免空腹搭配咖啡、濃茶或刺激性食物。\n\n若調整後仍持續不適，建議先暫停使用並諮詢醫師。\n\n**需要轉人工**\n- 胃痛持續超過3天\n- 已有胃潰瘍、胃食道逆流病史\n- 出現嘔吐或嚴重疼痛\n\n---\n\n## SOP014｜吃了沒感覺\n\n**客戶常見說法**\n- 沒感覺\n- 完全無感\n- 喝了不知道有沒有用\n- 好像沒什麼變化\n\n**回覆原則**\n- 不直接說正常\n- 先了解使用時間\n- 引導觀察其他指標\n\n**標準回覆**\n您好～\n\n每個人的體質、作息及飲食習慣不同，因此感受時間也會有所差異😊\n\n除了體重之外，也可以觀察：\n✔ 排便是否較順暢\n✔ 飽足感是否有提升\n✔ 精神狀況是否較穩定\n✔ 飲食控制是否較容易維持\n\n有些時候身體的調整會先反映在生活感受上，而不一定立即呈現在體重數字上喔😊\n\n---\n\n## SOP015｜產品一起吃會不會太多\n\n**客戶常見說法**\n- 一天吃這麼多會不會太多\n- 可以一起吃嗎\n- 會不會增加身體負擔\n- 這樣搭配有問題嗎\n\n**回覆原則**\n- 先讓客人安心\n- 再提供時段建議\n- 不強調衝突\n\n**標準回覆**\n您好～\n\n原則上依照建議量補充，多數產品是可以搭配使用的喔😊\n\n若希望身體感受較穩定，可以安排不同時段補充，例如：\n✔ 酵素：早上空腹\n✔ 孅孅飲：餐前\n✔ 康普茶或丟丟茶：白天飲用\n✔ 孅孅凍：晚餐後或睡前\n\n並搭配充足水分，通常整體感受會更好😊\n\n若有特殊疾病或長期服藥情況，再提供給我們確認即可。\n\n---\n\n## SOP016｜藥物搭配通用原則（含甲狀腺藥、血壓藥、慢性病用藥）\n\n**客戶常見說法**\n- 有在吃甲狀腺藥／血壓藥／慢性病藥\n- 保健食品可以跟藥一起吃嗎\n- 要間隔多久\n\n**回覆原則**\n- 不直接說可以一起吃\n- 說明「錯開食用」而非「影響吸收」（避免過度醫療聲稱）\n- 建議間隔2小時，語氣保守但不嚇人\n\n**標準回覆**\n您好～\n\n若有固定服用藥物，建議保健食品與藥物分開補充，間隔約2小時以上，讓兩者各自有較充裕的時間，也會比較安心😊\n\n優先依照醫師指示服藥，若有特殊治療或定期追蹤，也建議與主治醫師確認後再補充喔😊\n\n**各藥物類型補充說明**\n- 甲狀腺藥物：與酵素、孅孅飲、飽包等建議間隔2小時以上\n- 血壓藥：與酵素、保健食品建議間隔2小時以上\n- 抗凝血藥（warfarin）：需特別留意，建議諮詢醫師\n- 降血糖藥：與苦瓜胜肽等產品建議諮詢醫師\n\n**需要轉人工**\n- 甲狀腺癌患者\n- 服用抗凝血藥者\n- 剛調整藥量者\n- 多重慢性病患者\n\n---\n\n## SOP017｜使用超過半年仍完全沒效果\n\n**客戶常見說法**\n- 吃半年沒效果\n- 喝一年都沒變\n- 花很多錢都沒感覺\n- 完全沒用\n\n**回覆原則**\n- 先同理\n- 不爭辯\n- 不急著推薦產品\n\n**標準回覆**\n感謝您願意分享這段時間的使用狀況🙏\n\n也能理解持續補充一段時間後，卻沒有達到期待感受時的失落心情。\n\n由於每個人的體質、飲食內容、作息及活動量不同，身體反應確實會有差異。\n\n若方便的話，也可以提供目前的補充方式、飲食習慣及生活作息，我們再協助一起看看是否有可以調整的方向😊\n\n**需要轉人工**\n- 客人明確要求退貨\n- 情緒明顯不滿\n- 投訴產品無效\n\n---\n\n## SOP018｜體重停滯期\n\n**客戶常見說法**\n- 前面瘦2公斤就停了\n- 體重卡住\n- 瘦不下去\n- 吃多一點就胖回來\n\n**回覆原則**\n- 說明停滯期常見\n- 提供調整方向，特別強調蛋白質與熱量不能太低\n- 不直接推銷產品\n- 遇到「吃很少但沒效果」情況，引導客人注意蛋白質攝取，不要只叫客人少吃\n\n**標準回覆**\n您好～\n\n體態管理過程中，體重停滯其實是許多人都會遇到的階段😊\n\n當身體逐漸適應目前的飲食與活動模式後，體重下降速度可能會放緩。\n\n建議可以留意：\n✔ 蛋白質是否足夠：建議每餐都要有蛋白質來源（雞肉、魚、蛋、豆腐、無糖豆漿等），維持肌肉量有助於基礎代謝\n✔ 飲食不用刻意吃太少：若長時間熱量攝取過低，身體反而可能適應而放慢代謝速度，建議維持均衡飲食搭配適量優質澱粉\n✔ 水分是否充足：每天至少2000cc以上\n✔ 是否有規律活動或重量訓練\n\n有些時候體重雖然暫時沒有變化，但腰圍、體態及衣褲鬆緊度仍可能持續改善喔😊\n\n我們的產品主要是幫助腸道調整與日常代謝管理，搭配均衡飲食及適度運動時，整體感受通常會更明顯。\n", "diuHealth": "# Diu+ 品牌完整產品知識庫【最終版】\n最後更新：2026年7月\n包含：Diu+、大激賞、樹飛雪 GSH、金盞花葉黃素、葡萄糖胺、納豆Q10、元氣紅潤、閃閃金銀、大餐防守對策、雙艙系列、兒童益生菌、兒童鈣高上KIDS、跳跳綜合維他命、兒童葉黃素魚油、雙打Q凍、黃金橄欖輕檸飲\n\n---\n\n最後更新：2026年7月\n\n---\n\n## 新舊版產品說明\n\n- **康普茶（熱帶水果）**：有新舊兩版。新版含芙瑪金萃＋香檬精萃，功效更全面\n- **丟丟茶（藤黃果洛神茶）**：有新舊兩版。新版含藤黃果、毛喉鞘蕊花、四棱白粉藤、柑橘HPMF™、仙人掌、玉米鬚六大共同機能成分\n- **丟丟茶（鳳梨酵素茶）**：舊款，即將停售，庫存售完為止\n- **康普茶（綠茶）、康普茶（薑檸）**：已停售，不再回覆相關問題\n\n---\n\n## Diu+ Clean Coffee \n**品牌**：Diu+\n**產品分類**：保健食品\n**劑型**：液態飲\n**規格**：15ml/包\n**保存期限**：2年\n**保存方式**：陰涼乾燥處\n**產地**：台灣\n**主要成分**：咖啡因、藤黃果、白腎豆、毛喉鞘蕊花、膳食纖維\n**全成分**：水、咖啡萃取液（水、研磨咖啡粉）、專利難消化性麥芽糊精、咖啡粉、藤黃果萃取物、關華豆膠、白腎豆萃取物、專利毛喉鞘蕊花萃取物（毛喉鞘蕊花萃取物、麥芽糊精）\n**功效訴求**：體態管理、熱量控制、代謝提升\n**建議食用量/使用方式**：每日1次，每次1包\n**食用時機**：白天或餐後；咖啡因敏感者避免晚上\n**適用族群**：外食族、愛喝咖啡族、體態管理族\n**過敏原**：無常見過敏原（純植物萃取）\n**不適用族群**：咖啡因敏感者、孕婦需評估、兒童不建議、心悸或睡眠障礙者\n**注意事項**：含咖啡因，咖啡因敏感者、心悸或失眠體質需注意。孕婦與哺乳中建議先諮詢醫師。\n**風險標籤**：咖啡因     badge.className = 'token-badge mid'; badge.textContent = '⚡ 中量';
  } else {
    badge.className = 'token-badge high'; badge.textContent = '🔥 高量';
  }
}

function buildSys() {
  let s = KB.systemPrompt + '\n\n---\n\n';
  
  selectedCats.forEach(cat => {
    const key = CAT_INFO[cat].kbKey;
    if (key && KB[key]) {
      s += '## ' + KB_TITLES[key] + '\n' + KB[key] + '\n\n';
    }
  });

  // FAQ+SOP 固定加入
  s += '## FAQ 完整庫（240筆）\n' + KB.faqKB + '\n\n';
  s += '## 客訴SOP庫\n' + KB.sopKB;
  return s;
}

async function send() {
  const inp = document.getElementById('inp');
  const txt = inp.value.trim();
  if (!txt || busy) return;

  if (selectedCats.size === 0) {
    document.getElementById('noSelectWarn').style.display = 'block';
    return;
  }
  document.getElementById('noSelectWarn').style.display = 'none';

  hideEmpty();
  addMsg('user', txt);
  inp.value = '';
  inp.style.height = 'auto';
  history.push({ role: 'user', content: txt });

  busy = true;
  document.getElementById('sendBtn').disabled = true;
  const loader = addLoader();

  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 2000,
        system: buildSys(),
        messages: history
      })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    const reply = d.content?.[0]?.text || '（無回覆）';
    removeEl(loader);
    history.push({ role: 'assistant', content: reply });
    addReply(reply);
  } catch (e) {
    removeEl(loader);
    addSys('❌ 錯誤：' + e.message);
  }
  busy = false;
  document.getElementById('sendBtn').disabled = false;
}

function addMsg(type, text) {
  const msgs = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = 'msg ' + type;
  d.textContent = text;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}

function addReply(text) {
  const msgs = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap';
  const d = document.createElement('div');
  d.className = 'msg assistant';
  d.textContent = text;

  let badge = '';
  if (text.includes('需要轉人工') || text.includes('腫瘤') || text.includes('化療') || text.includes('腎功能不全')) {
    badge = '<span class="risk-badge risk-high">⚠️ 高風險</span>';
  } else if (text.includes('建議先諮詢醫師') || text.includes('先暫停') || text.includes('先諮詢')) {
    badge = '<span class="risk-badge risk-mid">⚡ 中風險</span>';
  } else {
    badge = '<span class="risk-badge risk-low">✅ 一般</span>';
  }

  const copyBtn = document.createElement('button');
  copyBtn.className = 'copy-btn';
  copyBtn.textContent = '📋 複製';
  copyBtn.onclick = () => {
    navigator.clipboard.writeText(text).then(() => {
      copyBtn.textContent = '✅ 已複製';
      copyBtn.classList.add('copied');
      setTimeout(() => { copyBtn.textContent = '📋 複製'; copyBtn.classList.remove('copied'); }, 2000);
    });
  };

  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  meta.innerHTML = badge;
  meta.appendChild(copyBtn);
  wrap.appendChild(d);
  wrap.appendChild(meta);
  msgs.appendChild(wrap);
  msgs.scrollTop = msgs.scrollHeight;
}

function addSys(text) {
  const msgs = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = 'msg sys';
  d.textContent = text;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}

function addLoader() {
  const msgs = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = 'loading';
  d.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
  return d;
}

function removeEl(el) { if (el && el.parentNode) el.parentNode.removeChild(el); }
function hideEmpty() { const e = document.getElementById('emptyState'); if (e) e.remove(); }
function clearChat() {
  history = [];
  document.getElementById('messages').innerHTML = '<div class="empty-state" id="emptyState"><div class="empty-icon">💬</div><div style="font-size:13px;color:#9ca3af">選擇產品類別（可多選），再貼上客人問題</div><div style="font-size:11px;color:#d1d5db;margin-top:3px">Enter 送出 ｜ Shift+Enter 換行</div></div>';
}
function fill(text) { const inp = document.getElementById('inp'); inp.value = text; inp.focus(); resize(inp); }
function onKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }
function resize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 140) + 'px'; }
</script>
</body>
</html>
